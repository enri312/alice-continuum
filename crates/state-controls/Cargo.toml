[package]
name = "alice-state-controls"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dioxus renderer for the existing Alice state and controls page"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.0", default-features = false, features = ["minimal", "web"] }
dioxus-web = { version = "=0.7.10", default-features = false }
futures-channel = "0.3"
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "Node"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
