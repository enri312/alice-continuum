<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .c-pulse{animation:cPulse 1.8s ease-in-out infinite}.c-dash{animation:cDash 2.4s linear infinite}.c-type{animation:cType 1.4s steps(3,end) infinite}.c-scan{animation:cScan 2.8s ease-in-out infinite}.c-led{animation:cLed 1.2s steps(2,end) infinite}
    @keyframes cPulse{50%{opacity:.28;stroke-width:5}}@keyframes cDash{to{stroke-dashoffset:-28}}@keyframes cType{0%,20%{opacity:.2}60%,100%{opacity:1}}@keyframes cScan{0%,100%{transform:translateY(-12px);opacity:.2}50%{transform:translateY(24px);opacity:.9}}@keyframes cLed{50%{opacity:.28}}
    @media (prefers-reduced-motion:reduce){.c-pulse,.c-dash,.c-type,.c-scan,.c-led{animation:none}}
  </style>
  <defs>
    <linearGradient id="c-frame" x1="20" y1="12" x2="180" y2="188" gradientUnits="userSpaceOnUse"><stop stop-color="#334155"/><stop offset=".45" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="c-glass" x1="60" y1="48" x2="142" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#0e7490" stop-opacity=".92"/><stop offset=".45" stop-color="#082f49" stop-opacity=".9"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="c-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5f3fc"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <radialGradient id="c-field"><stop stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></radialGradient>
    <filter id="c-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="c-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity=".85"/></filter>
    <pattern id="c-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#164e63" stroke-width=".6" opacity=".5"/></pattern>
  </defs>
