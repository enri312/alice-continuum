<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Conversación">
  <title>Conversación</title>
  <style>
    .conversation-orbit{animation:conversationOrbit 4s linear infinite}.conversation-pulse{animation:conversationPulse 1.8s ease-in-out infinite}.conversation-scan{animation:conversationScan 3s ease-in-out infinite}
    @keyframes conversationOrbit{to{stroke-dashoffset:-42}}@keyframes conversationPulse{50%{opacity:.3}}@keyframes conversationScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.conversation-orbit,.conversation-pulse,.conversation-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="conversation-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="conversation-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="conversation-accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <radialGradient id="conversation-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".68" stop-color="#34d399"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="conversation-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#22d3ee" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="conversation-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="conversation-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="conversation-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#conversation-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#conversation-grid)" stroke="#22d3ee" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#conversation-beam)"/>
  <circle class="conversation-orbit" cx="100" cy="100" r="71" fill="none" stroke="#22d3ee" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="conversation-orbit" cx="100" cy="100" r="62" fill="none" stroke="#34d399" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".65"/>
  <g fill="url(#conversation-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#22d3ee" filter="url(#conversation-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#34d399"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#22d3ee" font-size="7" text-anchor="middle" letter-spacing="1.5">CONVERSATION · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#22d3ee" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#22d3ee"/><circle class="conversation-pulse" cx="19" cy="27" r="2" fill="#34d399" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#34d399" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#34d399"/><circle class="conversation-pulse" cx="8" cy="27" r="2" fill="#22d3ee" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#conversation-shadow)">
      <path d="M-55-31 0-55 55-31 0-7z" fill="#13283a" stroke="#22d3ee" stroke-width="1.8"/>
      <path d="M-55-31 0-7v47l-55-24z" fill="#071521" stroke="#164e63"/><path d="M55-31 0-7v47l55-24z" fill="#0b1d29" stroke="#155e75"/>
      <path d="M-43-29 0-47 43-29 0-11z" fill="#06202b" stroke="#67e8f9"/>
      <path d="M-31-30h13l7-7 10 16 9-18 9 13h16" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#conversation-glow)"/>
      <path d="M-33 0h26l8 8 8-8h24v18H9L1 27l-8-9h-26z" fill="#0d2630" stroke="#34d399"/>
      <circle cx="-19" cy="9" r="2" fill="#34d399"/><circle cx="-9" cy="9" r="2" fill="#34d399"/><circle cx="1" cy="9" r="2" fill="#34d399"/>
    </g><path d="M76 137q24 12 48 0" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3 4"/>
  <g font-family="Consolas,monospace" font-weight="900"><g transform="translate(38 125)"><rect width="42" height="21" rx="3" fill="#061827" stroke="#22d3ee"/><text x="21" y="8" fill="#22d3ee" font-size="5" text-anchor="middle">PRIVACY GATE</text><path d="M6 14h19" stroke="#64748b"/><circle cx="33" cy="14" r="3" fill="#34d399"/></g><g transform="translate(120 125)"><rect width="42" height="21" rx="3" fill="#061827" stroke="#34d399"/><text x="21" y="8" fill="#34d399" font-size="5" text-anchor="middle">CLOUD ROUTE</text><path d="M7 14h10m5 0h13" stroke="#64748b"/><circle cx="18" cy="14" r="2" fill="#22d3ee"/></g><path d="M80 135h40" stroke="#22d3ee" stroke-dasharray="3 2"/><path d="m115 131 6 4-6 4" fill="none" stroke="#22d3ee"/><text x="100" y="154" fill="#94a3b8" font-size="5" text-anchor="middle">REVIEW · AUTHORIZE · SEND</text></g>
  <g class="conversation-scan" stroke="#34d399" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#22d3ee" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#22d3ee"/><circle cx="58" cy="2.5" r="1.5" fill="#34d399"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
