<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Conversación">
  <title>Conversación</title>
  <style>
    .conversation-dash{animation:conversationDash 2.8s linear infinite}.conversation-blink{animation:conversationBlink 1.6s steps(2,end) infinite}.conversation-blink2{animation:conversationBlink 2.3s steps(2,end) .5s infinite}.conversation-scan{animation:conversationScan 4.2s ease-in-out infinite}.conversation-spin{transform-box:fill-box;transform-origin:50% 50%;animation:conversationSpin 16s linear infinite}
    @keyframes conversationDash{to{stroke-dashoffset:-26}}@keyframes conversationBlink{50%{opacity:.25}}
    @keyframes conversationScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes conversationSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.conversation-dash,.conversation-blink,.conversation-blink2,.conversation-scan,.conversation-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="conversation-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="conversation-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="conversation-gb" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="conversation-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="conversation-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#22d3ee"/><stop offset=".7" stop-color="#34d399"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="conversation-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="conversation-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#conversation-plate)" stroke="url(#conversation-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="conversation-blink" cx="100" cy="42" r="2.2" fill="#34d399" filter="url(#conversation-glow)"/>
  <g filter="url(#conversation-shadow)"><rect x="40" y="56" width="68" height="56" rx="3" fill="#071521" stroke="#22d3ee" stroke-width="1.2"/></g>
    <path d="M40 64h68" stroke="#164e63"/><circle cx="45" cy="60" r="1.3" fill="#f87171"/><circle cx="50" cy="60" r="1.3" fill="#fbbf24"/><circle cx="55" cy="60" r="1.3" fill="#34d399"/>
    <path class="conversation-dash" d="M46 74h48M46 82h38M46 90h44" stroke="#ccfbf1" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 4" opacity=".85"/>
    <g class="conversation-blink" fill="#22d3ee"><circle cx="47" cy="101" r="1.7"/><circle cx="54" cy="101" r="1.7"/><circle cx="61" cy="101" r="1.7"/></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6">
      <g fill="#061827" stroke="#475569"><rect x="112" y="56" width="48" height="9" rx="2"/><rect x="112" y="68" width="48" height="9" rx="2"/><rect x="112" y="80" width="48" height="9" rx="2"/></g>
      <rect x="115" y="58.5" width="4" height="4" fill="none" stroke="#64748b"/><rect x="115" y="70.5" width="4" height="4" fill="none" stroke="#64748b"/><rect x="115" y="82.5" width="4" height="4" fill="none" stroke="#64748b"/>
      <text x="122" y="63" fill="#94a3b8">HIST</text><text x="122" y="75" fill="#94a3b8">MEM</text><text x="122" y="87" fill="#94a3b8">VENT</text>
      <rect x="112" y="92" width="48" height="9" rx="2" fill="#052e2b" stroke="#34d399"/><rect x="115" y="94.5" width="4" height="4" fill="#34d399"/><text x="122" y="99" fill="#a7f3d0">EPS ON</text>
    </g>
    <g filter="url(#conversation-shadow)"><path d="M112 106h36l7 7-7 7h-36l-6-7Z" fill="#111827" stroke="#fbbf24" stroke-width="1.1"/></g>
    <path d="M120 112v-1.6a2.4 2.4 0 0 1 4.8 0V112" fill="none" stroke="#fde68a"/><rect x="118.5" y="112" width="8" height="6" rx="1.2" fill="url(#conversation-gb)" stroke="#fde68a" stroke-width=".7"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="132" y="116" fill="#fcd34d" font-size="4">GATE</text></g>
    <g transform="translate(50 127)"><circle r="7" fill="#07111e" stroke="#64748b" stroke-dasharray="3 3"/><rect x="-2.6" y="-5" width="5.2" height="8" rx="2.6" fill="#1e293b" stroke="#94a3b8" stroke-width=".8"/><path d="m-5-5 10 10" stroke="#f87171" stroke-width="1.6"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="60" y="130" fill="#fca5a5" font-size="3.8">SAFE OFF</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="121.5" fill="#64748b" font-size="3" text-anchor="end">REV → AUTH → SEND · 0 CHARS</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="145" fill="#475569" font-size="3">R6.2 · RAM</text></g>
    <rect x="92" y="124" width="68" height="7" rx="3.5" fill="#020617" stroke="#334155"/><rect x="94" y="126" width="10" height="3" rx="1.5" fill="#22d3ee"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="92" y="138" fill="#64748b" font-size="3.6">PREVIEW · 0 B OUT</text><text x="160" y="138" fill="#64748b" font-size="3.6" text-anchor="end">MODEL · READONLY</text></g>
  <rect class="conversation-scan" x="40" y="50" width="120" height="1.4" fill="#22d3ee"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#22d3ee"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-CONVERSATION</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">DIALOGUE</text></g>
</svg>
