    <path d="M163 54h20l4 5v29l-4 5h-20l-5-5V59Z" fill="#07111e" stroke="#f59e0b"/><path d="M166 62h14m-10 7h10m-14 7h14m-8 7h8" stroke="#fbbf24"/><text x="173" y="90" fill="#fef3c7" text-anchor="middle">SALIDA</text>
    <rect x="78" y="151" width="44" height="12" rx="3" fill="#1e1b4b" stroke="#e879f9"/><circle cx="86" cy="157" r="2" fill="#f472b6" filter="url(#core-glow)"/><text x="105" y="159" fill="#f5d0fe" text-anchor="middle">IDENTIDAD</text>
  </g>
  <g fill="none" stroke="#c084fc" stroke-width="1" opacity=".78"><path d="M14 95h8v-8m-8 36h8v8m164-36h-8v-8m8 36h-8v8"/><path class="core-flow" d="M80 32h40" stroke-dasharray="3 4"/></g>
  <g transform="translate(63 177)"><rect width="74" height="8" rx="4" fill="#020617" stroke="#334155"/><rect x="3" y="2.5" width="49" height="3" rx="1.5" fill="url(#core-center)" filter="url(#core-glow)"/><circle cx="62" cy="4" r="2" fill="#38bdf8"/><circle cx="70" cy="4" r="2" fill="#f59e0b"/></g>
</svg>
