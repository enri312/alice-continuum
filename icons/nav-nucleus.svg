<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .core-pulse{transform-box:fill-box;transform-origin:center;animation:corePulse 2.5s ease-in-out infinite}.core-flow{animation:coreFlow 3.2s linear infinite}.core-node{animation:coreNode 2s ease-in-out infinite}.core-node:nth-child(2n){animation-delay:-1s}.core-orbit{transform-box:fill-box;transform-origin:center;animation:coreOrbit 14s linear infinite}
    @keyframes corePulse{50%{transform:scale(1.13);opacity:.82}}@keyframes coreFlow{to{stroke-dashoffset:-32}}@keyframes coreNode{50%{opacity:.35}}@keyframes coreOrbit{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.core-pulse,.core-flow,.core-node,.core-orbit{animation:none}}
  </style>
  <defs>
    <linearGradient id="core-frame" x1="10" y1="8" x2="190" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#28394e"/><stop offset=".48" stop-color="#0b1423"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="core-left" x1="38" y1="54" x2="101" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#0e7490" stop-opacity=".72"/><stop offset=".6" stop-color="#082f49" stop-opacity=".5"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="core-right" x1="162" y1="54" x2="99" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#b45309" stop-opacity=".68"/><stop offset=".6" stop-color="#451a03" stop-opacity=".46"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="core-center"><stop stop-color="#fff"/><stop offset=".15" stop-color="#f5d0fe"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
    <radialGradient id="core-field"><stop stop-color="#a855f7" stop-opacity=".25"/><stop offset=".48" stop-color="#38bdf8" stop-opacity=".08"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <filter id="core-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="core-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".88"/></filter>
    <pattern id="core-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0v10" fill="none" stroke="#312e81" stroke-width=".55" opacity=".5"/></pattern>
  </defs>

