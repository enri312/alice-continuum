  <path d="M98 47C80 35 55 44 47 61c-16 4-23 22-15 36-9 14-2 34 13 39 7 18 30 25 53 10Z" fill="url(#core-left)" stroke="#38bdf8" stroke-width="2.8" filter="url(#core-shadow)"/>
  <path d="M102 47c18-12 43-3 51 14 16 4 23 22 15 36 9 14 2 34-13 39-7 18-30 25-53 10Z" fill="url(#core-right)" stroke="#f59e0b" stroke-width="2.8" filter="url(#core-shadow)"/>
