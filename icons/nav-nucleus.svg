  <path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="none" stroke="#e879f9" stroke-width="1.2" opacity=".56"/>
  <circle cx="100" cy="103" r="77" fill="url(#core-field)"/><circle cx="100" cy="103" r="70" fill="url(#core-grid)" opacity=".36"/>
  <g fill="#475569" stroke="#111827" stroke-width="2"><circle cx="29" cy="29" r="5"/><circle cx="171" cy="29" r="5"/><circle cx="29" cy="171" r="5"/><circle cx="171" cy="171" r="5"/></g><g stroke="#020617" stroke-width="2"><path d="m26 26 6 6m136-6 6 6M26 168l6 6m136-6 6 6"/></g>
  <text x="100" y="27" fill="#f0abfc" font-family="Consolas,monospace" font-size="8.4" font-weight="900" text-anchor="middle" letter-spacing="1.6">NEU-02 · ALICE CORE</text>

