    <g fill="#fde68a"><circle cx="155" cy="78" r="3"/><circle cx="136" cy="63" r="3"/><circle cx="118" cy="78" r="3"/><circle cx="162" cy="103" r="3"/><circle cx="140" cy="96" r="3"/><circle cx="122" cy="111" r="3"/><circle cx="154" cy="130" r="3"/><circle cx="134" cy="115" r="3"/><circle cx="118" cy="132" r="3"/></g>
  </g>

  <ellipse class="core-orbit" cx="100" cy="99" rx="72" ry="29" fill="none" stroke="#c084fc" stroke-width="1.3" stroke-dasharray="4 7" opacity=".72"/>
  <circle class="core-pulse" cx="100" cy="101" r="22" fill="url(#core-center)" stroke="#fff" stroke-width="1.8" filter="url(#core-glow)"/>
  <circle cx="100" cy="101" r="14" fill="#100b2d" stroke="#f0abfc" stroke-width="1.5" opacity=".92"/>
  <path d="m100 86-12 29h7l2-6h7l2 6h7Zm0 9 3 9h-6Z" fill="#fff" stroke="#f5d0fe" stroke-width=".8" filter="url(#core-glow)"/>
