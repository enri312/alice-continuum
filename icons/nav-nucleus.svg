<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Núcleo cognitivo" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <title>Núcleo cognitivo</title>
  <style>
    .nucleus-dash{animation:nucleusDash 2.8s linear infinite}.nucleus-blink{animation:nucleusBlink 1.6s steps(2,end) infinite}.nucleus-blink2{animation:nucleusBlink 2.3s steps(2,end) .5s infinite}.nucleus-scan{animation:nucleusScan 4.2s ease-in-out infinite}.nucleus-spin{transform-box:fill-box;transform-origin:50% 50%;animation:nucleusSpin 16s linear infinite}
    @keyframes nucleusDash{to{stroke-dashoffset:-26}}@keyframes nucleusBlink{50%{opacity:.25}}
    @keyframes nucleusScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes nucleusSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.nucleus-dash,.nucleus-blink,.nucleus-blink2,.nucleus-scan,.nucleus-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="nucleus-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="nucleus-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="nucleus-gb" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="nucleus-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="nucleus-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="nucleus-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#fbbf24"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="nucleus-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="nucleus-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#nucleus-plate)" stroke="url(#nucleus-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="nucleus-blink" cx="100" cy="42" r="2.2" fill="#22d3ee" filter="url(#nucleus-glow)"/>
  <!-- Top System Header -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#fbbf24" font-size="4">NÚCLEO COGNITIVO · R3 CORE</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">FUSION LATENCY 1.2ms</text>
    </g>

    <!-- Concentric Neural Energy Conduits & Orbital Racks -->
    <g filter="url(#nucleus-shadow)">
      <!-- Satellite Input Nodes (Top & Bottom Left) -->
      <circle cx="56" cy="74" r="12" fill="#0b1d29" stroke="#22d3ee" stroke-width="1.3"/>
      <circle cx="56" cy="74" r="7" fill="#05131c" stroke="#164e63" stroke-width=".8"/>
      <circle cx="56" cy="114" r="12" fill="#0b1d29" stroke="#22d3ee" stroke-width="1.3"/>
      <circle cx="56" cy="114" r="7" fill="#05131c" stroke="#164e63" stroke-width=".8"/>
      <!-- Central Cognitive Fusion Core -->
      <circle cx="92" cy="94" r="16" fill="url(#nucleus-halo)" stroke="#fff7c2" stroke-width="1.6" filter="url(#nucleus-glow)"/>
      <circle cx="92" cy="94" r="8" fill="#171207" stroke="#fbbf24" stroke-width="1.1"/>
      <g font-family="Consolas,monospace" font-weight="900"><text x="92" y="75" fill="#64748b" font-size="3.2" text-anchor="middle">5/7 REG</text></g>
      <!-- Satellite Output & Motor Nodes (Top & Bottom Right) -->
      <circle cx="128" cy="74" r="12" fill="#1a1207" stroke="#fbbf24" stroke-width="1.3"/>
      <circle cx="128" cy="74" r="7" fill="#120c04" stroke="#713f12" stroke-width=".8"/>
      <circle cx="128" cy="114" r="12" fill="#141024" stroke="#f472b6" stroke-width="1.3"/>
      <circle cx="128" cy="114" r="7" fill="#0c0a17" stroke="#831843" stroke-width=".8"/>
    </g>
    <!-- Circuit Divider & Flow Bus -->
    <path d="M110 58v72" stroke="#475569" stroke-width=".9" stroke-dasharray="3 3"/>
    <!-- Synaptic Link Rays with animated flow -->
    <g fill="none" stroke-width="1.5">
      <path class="nucleus-dash" d="M68 78q12 6 15 8M68 110q12-6 15-8M104 88q12-6 15-8" stroke="#22d3ee" stroke-dasharray="4 3"/>
      <path class="nucleus-dash" d="M104 100q12 6 15 8" stroke="#fbbf24" stroke-dasharray="4 3"/>
    </g>
    <!-- Link Weight Callouts -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.9" fill="#94a3b8">
      <text x="76" y="80">×2</text><text x="76" y="112">×1</text>
      <text x="114" y="86">×1</text><text x="114" y="106">×1</text>
    </g>
    <!-- Core Status Pulsars -->
    <g class="nucleus-blink" fill="#fff">
      <circle cx="56" cy="74" r="2.6"/><circle cx="56" cy="114" r="2.6"/>
      <circle cx="92" cy="94" r="3.2"/><circle cx="128" cy="74" r="2.6"/><circle cx="128" cy="114" r="2.6"/>
    </g>
    <!-- Node Labels -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6">
      <text x="56" y="91" fill="#22d3ee" text-anchor="middle">ENTRADA</text>
      <text x="56" y="131" fill="#22d3ee" text-anchor="middle">CONTEXTO</text>
      <text x="128" y="91" fill="#fbbf24" text-anchor="middle">SALIDA</text>
      <text x="128" y="131" fill="#f9a8d4" text-anchor="middle">MOTOR · MAN</text>
    </g>
    <!-- Bottom Diagnostic Badges -->
    <g font-family="Consolas,monospace" font-weight="900">
      <rect x="38" y="135" width="54" height="10" rx="2" fill="#0b1320" stroke="#fbbf24" stroke-width=".9"/>
      <text x="65" y="141.5" fill="#fde68a" font-size="3.6" text-anchor="middle">7 REG · 5 LINKS</text>
      <rect x="108" y="135" width="54" height="10" rx="2" fill="#0b1320" stroke="#22d3ee" stroke-width=".9"/>
      <text x="135" y="141.5" fill="#a5f3fc" font-size="3.6" text-anchor="middle">R3 · 5 MIN</text>
      <text x="42" y="149" fill="#475569" font-size="3">R3 CORE</text>
    </g>
  <g aria-label="Ruteo cognitivo" fill="none" stroke-width=".75">
    <path d="M42 154h22l8-6 12 6 16-6 16 6 12-6 8 6h22" stroke="#fbbf24"/><path d="M72 148l28 0 28 0" stroke="#22d3ee" stroke-dasharray="2 2"/>
    <g fill="#020617" stroke="#f9a8d4"><circle cx="72" cy="148" r="2.2"/><circle cx="100" cy="148" r="2.2"/><circle cx="128" cy="148" r="2.2"/></g>
  </g>
  <rect class="nucleus-scan" x="40" y="50" width="120" height="1.4" fill="#fbbf24"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#fbbf24"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-NUCLEUS</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">CORE</text></g>
</svg>
