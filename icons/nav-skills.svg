  <g opacity=".65" stroke="#fb923c" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#fb923c"/><circle cx="58" cy="2.5" r="1.5" fill="#a78bfa"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
