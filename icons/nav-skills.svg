<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Habilidades">
  <title>Habilidades</title>
  <style>
    .skills-orbit{animation:skillsOrbit 4s linear infinite}.skills-pulse{animation:skillsPulse 1.8s ease-in-out infinite}.skills-scan{animation:skillsScan 3s ease-in-out infinite}
    @keyframes skillsOrbit{to{stroke-dashoffset:-42}}@keyframes skillsPulse{50%{opacity:.3}}@keyframes skillsScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.skills-orbit,.skills-pulse,.skills-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="skills-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="skills-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="skills-accent" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="skills-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#fb923c"/><stop offset=".68" stop-color="#a78bfa"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="skills-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#fb923c" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="skills-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="skills-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="skills-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fb923c" stop-opacity=".28"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
  </defs>
