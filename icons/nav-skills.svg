<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Taller de habilidades" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <title>Taller de habilidades</title>
  <style>
    .skills-dash{animation:skillsDash 2.8s linear infinite}.skills-blink{animation:skillsBlink 1.6s steps(2,end) infinite}.skills-blink2{animation:skillsBlink 2.3s steps(2,end) .5s infinite}.skills-scan{animation:skillsScan 4.2s ease-in-out infinite}.skills-spin{transform-box:fill-box;transform-origin:50% 50%;animation:skillsSpin 16s linear infinite}
    @keyframes skillsDash{to{stroke-dashoffset:-26}}@keyframes skillsBlink{50%{opacity:.25}}
    @keyframes skillsScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes skillsSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.skills-dash,.skills-blink,.skills-blink2,.skills-scan,.skills-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="skills-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="skills-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="skills-gb" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="skills-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="skills-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="skills-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#fb923c"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="skills-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="skills-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#skills-plate)" stroke="url(#skills-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="skills-blink" cx="100" cy="42" r="2.2" fill="#a78bfa" filter="url(#skills-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#fb923c" font-size="4">[08] TALLER DE HABILIDADES // SKILL_FACTORY</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">MODULE COMPILATION</text>
    </g>

    <!-- Left: Source Code / Blueprint Editor -->
    <g filter="url(#skills-shadow)">
      <rect x="38" y="56" width="68" height="68" rx="4" fill="#0d0a04" stroke="#fb923c" stroke-width="1.3"/>
      <rect x="40" y="58" width="64" height="64" rx="3" fill="url(#skills-screen-bg)"/>
    </g>
    <!-- IDE Header Bar -->
    <rect x="39" y="57" width="66" height="8" fill="#fb923c" opacity="0.1"/>
    <path d="M38 65h68" stroke="#7c2d12" stroke-width="0.8"/>
    <circle cx="44" cy="61" r="1.5" fill="#f87171"/>
    <circle cx="49" cy="61" r="1.5" fill="#fbbf24"/>
    <circle cx="54" cy="61" r="1.5" fill="#4ade80"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="60" y="62.5" fill="#fdba74" font-size="2.6">skill_blueprint.ts</text>
    </g>

    <!-- Code Syntax Lines -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2">
      <text x="43" y="73" fill="#64748b">01</text><text x="50" y="73" fill="#c084fc">import</text><text x="62" y="73" fill="#e2e8f0">{ api }</text>
      <text x="43" y="79" fill="#64748b">02</text><text x="50" y="79" fill="#c084fc">export const</text><text x="73" y="79" fill="#fbbf24">action</text>
      <text x="43" y="85" fill="#64748b">03</text><text x="54" y="85" fill="#cbd5e1">req: Payload = {</text>
      <text x="43" y="91" fill="#64748b">04</text><text x="58" y="91" fill="#94a3b8">mode:</text><text x="68" y="91" fill="#4ade80">'strict'</text>
      <text x="43" y="97" fill="#64748b">05</text><text x="54" y="97" fill="#cbd5e1">};</text>
      <text x="43" y="103" fill="#64748b">06</text><text x="50" y="103" fill="#e2e8f0">await api.</text><text x="67" y="103" fill="#fbbf24">execute</text><text x="79" y="103" fill="#e2e8f0">()</text>
    </g>
    <!-- Editor Cursor -->
    <rect x="88" y="99" width="1.5" height="5" fill="#fb923c" class="skills-blink"/>

    <!-- Terminal Footer in Editor -->
    <path d="M38 111h68" stroke="#334155" stroke-width="0.8"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2">
      <text x="43" y="117" fill="#4ade80">></text><text x="48" y="117" fill="#cbd5e1">npm run build_skill</text>
      <text x="43" y="121" fill="#94a3b8">Compiling 1 module...</text>
    </g>

    <!-- Right: Capability Hexagon / Build Graph -->
    <g filter="url(#skills-shadow)">
      <rect x="110" y="56" width="52" height="68" rx="4" fill="#0b0811" stroke="#a78bfa" stroke-width="1.3"/>
      <rect x="112" y="58" width="48" height="64" rx="3" fill="#0a0510"/>
    </g>
    <!-- Dependency Graph / Skill Node -->
    <g transform="translate(136 78)">
      <!-- Hexagon Node -->
      <path d="M0 -14 L12 -7 L12 7 L0 14 L-12 7 L-12 -7 Z" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M0 -9 L8 -4 L8 4 L0 9 L-8 4 L-8 -4 Z" fill="#a78bfa" opacity="0.2"/>
      <circle cx="0" cy="0" r="2.5" fill="#a78bfa" class="skills-blink2"/>
      
      <!-- Outgoing edges -->
      <path d="M0 14 v12" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
      <path d="M-12 7 l-10 -6" stroke="#475569" stroke-width="1"/>
      <path d="M12 7 l10 -6" stroke="#475569" stroke-width="1"/>
      
      <!-- Child nodes -->
      <circle cx="-22" cy="1" r="3" fill="#64748b"/>
      <circle cx="22" cy="1" r="3" fill="#fb923c"/>
      <circle cx="0" cy="26" r="3" fill="#4ade80"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="136" y="115" fill="#d8b4fe" font-size="3" text-anchor="middle">AST PARSED</text>
      <text x="136" y="121" fill="#4ade80" font-size="2.6" text-anchor="middle">0 ERRORS · 0 WARN</text>
    </g>

    <!-- Bottom Compilation Status -->
    <g filter="url(#skills-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#0d0a04" stroke="#fb923c" stroke-width="1.1"/>
    </g>
    <!-- Integration Badge -->
    <g stroke="#fb923c" stroke-width="1.2" fill="none">
       <rect x="44" y="131" width="8" height="7" rx="1"/>
       <path d="M48 131v7 M44 134.5h8"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="57" y="136" fill="#fdba74" font-size="3.5">SKILL DRAFT: REVIEW REQUIRED</text>
      <text x="157" y="136" fill="#fb923c" font-size="3.2" text-anchor="end">NO EXECUTION</text>
      <text x="42" y="148" fill="#64748b" font-size="3">TOOL REGISTRY COMPATIBLE</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">RISK: LOW // SANDBOXED</text>
    </g>
  <g aria-label="Ciclo de habilidad" font-family="Consolas,monospace" font-weight="900">
    <g fill="#1e1107" stroke="#fb923c" stroke-width=".65"><polygon points="47,149 55,149 59,153 55,157 47,157 43,153"/><polygon points="78,149 86,149 90,153 86,157 78,157 74,153"/><polygon points="109,149 117,149 121,153 117,157 109,157 105,153"/><polygon points="140,149 148,149 152,153 148,157 140,157 136,153"/></g>
    <path d="M59 153h15m16 0h15m16 0h15" stroke="#38bdf8" stroke-width=".7"/><text x="51" y="154.5" fill="#fdba74" font-size="1.8" text-anchor="middle">D</text><text x="82" y="154.5" fill="#fdba74" font-size="1.8" text-anchor="middle">R</text><text x="113" y="154.5" fill="#fdba74" font-size="1.8" text-anchor="middle">A</text><text x="144" y="154.5" fill="#fdba74" font-size="1.8" text-anchor="middle">X</text>
  </g>
  <rect class="skills-scan" x="40" y="50" width="120" height="1.4" fill="#fb923c"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#fb923c"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-SKILLS</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">WORKSHOP</text></g>
</svg>
