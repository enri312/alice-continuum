    <g filter="url(#skills-shadow)"><rect x="108" y="56" width="52" height="20" rx="3" fill="#100d1c" stroke="#a78bfa"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="134" y="64" fill="#a78bfa" font-size="4" text-anchor="middle">SIM PLAN</text><text x="134" y="71" fill="#4ade80" font-size="3.6" text-anchor="middle">0 EFFECTS · EXEC OFF</text></g>
    <g fill="none" stroke="#475569"><path d="M110 88h44"/></g>
    <g><circle cx="112" cy="88" r="3" fill="#fb923c"/><circle cx="126" cy="88" r="3" fill="#a78bfa"/><circle cx="140" cy="88" r="3" fill="#4ade80"/><circle cx="154" cy="88" r="3" fill="#475569"/></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2"><text x="112" y="95" fill="#fb923c" text-anchor="middle">DRAFT</text><text x="140" y="95" fill="#a7f3d0" text-anchor="middle">APPROVED</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><rect x="108" y="100" width="52" height="16" rx="2" fill="#07111e" stroke="#fb923c" stroke-width=".8"/><text x="134" y="107" fill="#fdba74" font-size="3.4" text-anchor="middle">REVISAR-PROVEEDORES</text><text x="134" y="113" fill="#64748b" font-size="3.2" text-anchor="middle">SHA 8A4F…91C2 · v1</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="141" fill="#475569" font-size="3">R4</text><text x="100" y="141" fill="#fca5a5" font-size="3.8" text-anchor="middle">LIFECYCLE · EXECUTION BLOCKED</text></g>
  <rect class="skills-scan" x="40" y="50" width="120" height="1.4" fill="#fb923c"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#fb923c"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-SKILLS</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">WORKSHOP</text></g>
</svg>
