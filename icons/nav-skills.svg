    <path d="M40 64h62" stroke="#3b2b16"/><circle cx="45" cy="60" r="1.2" fill="#fb923c"/><circle cx="50" cy="60" r="1.2" fill="#a78bfa"/>
    <g stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"><path d="M47 73h30M47 81h36M47 89h26M47 97h33"/></g>
    <g fill="#a78bfa"><circle cx="44" cy="73" r="1.3"/><circle cx="44" cy="81" r="1.3"/><circle cx="44" cy="89" r="1.3"/><circle cx="44" cy="97" r="1.3"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="47" y="106" fill="#64748b" font-size="3">4 PASOS · RISK LOW</text></g>
