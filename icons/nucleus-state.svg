<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Estado interno">
  <title>Estado interno</title>
  <style>
    .state-dash{animation:stateDash 2.8s linear infinite}.state-blink{animation:stateBlink 1.6s steps(2,end) infinite}.state-blink2{animation:stateBlink 2.3s steps(2,end) .5s infinite}.state-scan{animation:stateScan 4.2s ease-in-out infinite}.state-spin{transform-box:fill-box;transform-origin:50% 50%;animation:stateSpin 16s linear infinite}
    @keyframes stateDash{to{stroke-dashoffset:-26}}@keyframes stateBlink{50%{opacity:.25}}
    @keyframes stateScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes stateSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.state-dash,.state-blink,.state-blink2,.state-scan,.state-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="state-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="state-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="state-gb" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="state-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="state-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#10b981"/><stop offset=".7" stop-color="#f59e0b"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="state-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="state-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#state-plate)" stroke="url(#state-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#10b981" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="state-blink" cx="100" cy="42" r="2.2" fill="#f59e0b" filter="url(#state-glow)"/>
  <g filter="url(#state-shadow)"><rect x="42" y="60" width="116" height="62" rx="3" fill="#071b18" stroke="#10b981" stroke-width="1.3"/></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6"><text x="48" y="74" fill="#94a3b8">R3 SIGNAL</text><text x="48" y="92" fill="#94a3b8">MEMORY</text><text x="48" y="110" fill="#94a3b8">AFFECT</text></g>
    <rect x="86" y="68" width="56" height="7" rx="3.5" fill="#0b2824" stroke="#1f3c38"/><rect x="86" y="68" width="40" height="7" rx="3.5" fill="#10b981" filter="url(#state-glow)"/><circle class="state-blink" cx="126" cy="71.5" r="2.4" fill="#d1fae5"/>
    <rect x="86" y="86" width="56" height="7" rx="3.5" fill="#0b2824" stroke="#3d301e"/><rect x="86" y="86" width="24" height="7" rx="3.5" fill="#f59e0b"/><circle class="state-blink2" cx="110" cy="89.5" r="2.4" fill="#fef3c7"/>
    <path d="M100 68v7M114 68v7M100 86v7M114 86v7" stroke="#06201c" stroke-width="1"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3" fill="#64748b"><text x="146" y="78" text-anchor="end">62%</text><text x="146" y="96" text-anchor="end">34%</text></g>
    <rect x="86" y="104" width="56" height="7" rx="3.5" fill="#0b2824" stroke="#1f3c38"/><rect x="86" y="104" width="2" height="7" rx="1" fill="#475569"/><text x="146" y="110" fill="#64748b" font-size="3.4" text-anchor="end">0.00</text>
    <g><circle cx="146" cy="70" r="6.4" fill="#1c1013" stroke="#ef4444"/><path d="m143.4 70 2.2 2.2 3.6-4" fill="none" stroke="#ef4444" stroke-width="1.4"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="132" fill="#64748b" font-size="3.5" text-anchor="middle">BEHAVIOR LOCKED · HEURISTIC</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="143" fill="#475569" font-size="3">TTL 30'</text><text x="100" y="143" fill="#10b981" font-size="3.8" text-anchor="middle">SIGNALS R3 · MEMORY LOCAL</text></g>
  <rect class="state-scan" x="40" y="50" width="120" height="1.4" fill="#10b981"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#10b981"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-STATE</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">INTERNAL</text></g>
</svg>
