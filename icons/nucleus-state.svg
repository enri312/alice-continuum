<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Estado y controles" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <title>Estado y controles</title>
  <style>
    .state-dash{animation:stateDash 2.8s linear infinite}.state-blink{animation:stateBlink 1.6s steps(2,end) infinite}.state-blink2{animation:stateBlink 2.3s steps(2,end) .5s infinite}.state-scan{animation:stateScan 4.2s ease-in-out infinite}.state-spin{transform-box:fill-box;transform-origin:50% 50%;animation:stateSpin 16s linear infinite}
    @keyframes stateDash{to{stroke-dashoffset:-26}}@keyframes stateBlink{50%{opacity:.25}}
    @keyframes stateScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes stateSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.state-dash,.state-blink,.state-blink2,.state-scan,.state-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="state-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="state-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="state-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="state-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="state-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="state-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#10b981"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="state-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="state-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#state-plate)" stroke="url(#state-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="state-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#state-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#10b981" font-size="4">[03] ESTADO Y CONTROLES // R3 STATE</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">READ-ONLY · 0 AUTONOMY</text>
    </g>

    <!-- Left Subsystem: Señales Internas (Internal Telemetry Meters) -->
    <g filter="url(#state-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#071b18" stroke="#10b981" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#state-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="64" fill="#6ee7b7" font-size="2.9">SEÑALES [R3 VERIF]</text>
      <circle cx="91" cy="62.5" r="1.5" fill="#10b981" class="state-blink"/>
    </g>

    <!-- Metric 1: Inhibición / Seguridad Activa (0.580) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="44" y="73" fill="#cbd5e1">INHIBICIÓN</text>
      <text x="92" y="73" fill="#34d399" text-anchor="end">0.58</text>
      <rect x="44" y="75" width="48" height="4.5" rx="2.2" fill="#06201b" stroke="#134e4a" stroke-width=".6"/>
      <rect x="44" y="75" width="28" height="4.5" rx="2.2" fill="#10b981" filter="url(#state-glow)"/>
    </g>

    <!-- Metric 2: Memoria Local (0.720) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="44" y="86" fill="#cbd5e1">MEMORIA</text>
      <text x="92" y="86" fill="#38bdf8" text-anchor="end">0.72</text>
      <rect x="44" y="88" width="48" height="4.5" rx="2.2" fill="#071b26" stroke="#0e4e68" stroke-width=".6"/>
      <rect x="44" y="88" width="34" height="4.5" rx="2.2" fill="#38bdf8"/>
    </g>

    <!-- Metric 3: Afecto / Emoción (0.000 - Planificado) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="44" y="99" fill="#94a3b8">AFECTO</text>
      <text x="92" y="99" fill="#64748b" text-anchor="end">0.00</text>
      <rect x="44" y="101" width="48" height="4.5" rx="2.2" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
      <rect x="44" y="101" width="3" height="4.5" rx="1.5" fill="#475569"/>
    </g>

    <!-- Metric 4: Curiosidad (0.000 - Planificado) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="44" y="112" fill="#94a3b8">CURIOSIDAD</text>
      <text x="92" y="112" fill="#64748b" text-anchor="end">0.00</text>
      <rect x="44" y="114" width="48" height="4.5" rx="2.2" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
      <rect x="44" y="114" width="3" height="4.5" rx="1.5" fill="#475569"/>
    </g>

    <!-- Right Subsystem: Controles de Comportamiento Bloqueados (Behavior Sliders) -->
    <g filter="url(#state-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#131109" stroke="#f59e0b" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#0a0803"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="64" fill="#fde68a" font-size="2.9">CONTROLES [LOCKED]</text>
      <!-- Mini Lock Badge -->
      <path d="M152 61v-1.5a1.5 1.5 0 0 1 3 0V61" fill="none" stroke="#fbbf24" stroke-width=".8"/>
      <rect x="151" y="61" width="5" height="3.8" rx=".8" fill="#78350f" stroke="#fbbf24" stroke-width=".6"/>
    </g>

    <!-- Control 1: Autonomía (0.00 - Hard Locked) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="108" y="73" fill="#fca5a5">AUTONOMÍA</text>
      <text x="156" y="73" fill="#ef4444" text-anchor="end">0.00</text>
      <rect x="108" y="76" width="48" height="3" rx="1.5" fill="#1e1014" stroke="#7f1d1d" stroke-width=".6"/>
      <circle cx="110" cy="77.5" r="3.2" fill="#7f1d1d" stroke="#ef4444" stroke-width=".8"/>
    </g>

    <!-- Control 2: Inhibición Forzada (0.58 - Locked) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="108" y="86" fill="#cbd5e1">LÍMITES</text>
      <text x="156" y="86" fill="#34d399" text-anchor="end">0.58</text>
      <rect x="108" y="89" width="48" height="3" rx="1.5" fill="#042f2e" stroke="#115e59" stroke-width=".6"/>
      <rect x="108" y="89" width="28" height="3" rx="1.5" fill="#10b981"/>
      <circle cx="136" cy="90.5" r="3.2" fill="#0f766e" stroke="#34d399" stroke-width=".8"/>
    </g>

    <!-- Control 3: Influencia de Memoria (0.00 - Locked) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="108" y="99" fill="#94a3b8">INFL. MEM</text>
      <text x="156" y="99" fill="#64748b" text-anchor="end">0.00</text>
      <rect x="108" y="102" width="48" height="3" rx="1.5" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
      <circle cx="110" cy="103.5" r="3.2" fill="#1e293b" stroke="#64748b" stroke-width=".8"/>
    </g>

    <!-- Control 4: Creatividad / Estilo (0.00 - Locked) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8">
      <text x="108" y="112" fill="#94a3b8">CREATIVIDAD</text>
      <text x="156" y="112" fill="#64748b" text-anchor="end">0.00</text>
      <rect x="108" y="115" width="48" height="3" rx="1.5" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
      <circle cx="110" cy="116.5" r="3.2" fill="#1e293b" stroke="#64748b" stroke-width=".8"/>
    </g>

    <!-- Bottom Governance & Safety Banner -->
    <g filter="url(#state-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#051f1b" stroke="#10b981" stroke-width="1.1"/>
    </g>
    <!-- Safety Shield / Lock Monogram -->
    <circle cx="48" cy="134.5" r="4.5" fill="#042f2e" stroke="#34d399" stroke-width="1"/>
    <path d="M46 133v-1.2a2 2 0 0 1 4 0V133m-5 0h6v4.5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1Z" fill="none" stroke="#6ee7b7" stroke-width="1"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#a7f3d0" font-size="3.5">GOBERNANZA: CONTROLES BLOQUEADOS</text>
      <text x="157" y="136" fill="#34d399" font-size="3.2" text-anchor="end">HEURÍSTICA OK</text>
      <text x="42" y="148" fill="#64748b" font-size="3">TTL 30' · RAM RECALL</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">CERO EXPERIENCIA INTERNA</text>
    </g>
  <g aria-label="Canales de estado" font-family="Consolas,monospace" font-weight="900">
    <g fill="#020617" stroke="#10b981" stroke-width=".65"><rect x="42" y="149" width="32" height="7" rx="1"/><rect x="84" y="149" width="32" height="7" rx="1"/><rect x="126" y="149" width="32" height="7" rx="1"/></g>
    <path d="M45 153h8l3-2 4 3 5-1h6M87 153h7l4-3 5 5 4-3h6M129 153h8l4-2 4 3 5-2h5" fill="none" stroke="#6ee7b7" stroke-width=".7"/>
    <text x="58" y="158" fill="#64748b" font-size="1.9" text-anchor="middle">AFFECT</text><text x="100" y="158" fill="#64748b" font-size="1.9" text-anchor="middle">DRIVE</text><text x="142" y="158" fill="#64748b" font-size="1.9" text-anchor="middle">INHIBIT</text>
  </g>
  <rect class="state-scan" x="40" y="50" width="120" height="1.4" fill="#10b981"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#10b981"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-STATE</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">STATE &amp; CTRL</text></g>
</svg>
