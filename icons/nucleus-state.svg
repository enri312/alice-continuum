<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Estado interno">
  <title>Estado interno</title>
  <style>
    .state-orbit{animation:stateOrbit 4s linear infinite}.state-pulse{animation:statePulse 1.8s ease-in-out infinite}.state-scan{animation:stateScan 3s ease-in-out infinite}
    @keyframes stateOrbit{to{stroke-dashoffset:-42}}@keyframes statePulse{50%{opacity:.3}}@keyframes stateScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.state-orbit,.state-pulse,.state-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="state-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="state-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="state-accent" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <radialGradient id="state-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#10b981"/><stop offset=".68" stop-color="#f59e0b"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="state-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#10b981" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="state-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="state-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="state-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10b981" stop-opacity=".28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#state-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#state-grid)" stroke="#10b981" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#state-beam)"/>
  <circle class="state-orbit" cx="100" cy="100" r="71" fill="none" stroke="#10b981" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="state-orbit" cx="100" cy="100" r="62" fill="none" stroke="#f59e0b" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#10b981" stroke-width="1" opacity=".65"/>
  <g fill="url(#state-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#10b981" filter="url(#state-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#f59e0b"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#10b981" font-size="7" text-anchor="middle" letter-spacing="1.5">STATE · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#10b981" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#10b981"/><circle class="state-pulse" cx="19" cy="27" r="2" fill="#f59e0b" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#f59e0b" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#f59e0b"/><circle class="state-pulse" cx="8" cy="27" r="2" fill="#10b981" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#state-shadow)">
      <path d="M-57-44 48-50 57 43-48 49z" fill="#071b18" stroke="#10b981" stroke-width="2"/>
      <path d="M-47-27h87l2 21h-87z" fill="#0b2824" stroke="#6ee7b7"/><path d="M-39-16h10l6-8 8 15 10-23 10 21 7-9 6 5h18" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#state-glow)"/>
      <g><path d="M-42 8h82" stroke="#1f3c38" stroke-width="8"/><path d="M-42 8h62" stroke="#10b981" stroke-width="8"/><circle cx="20" cy="8" r="7" fill="#d1fae5" stroke="#10b981"/><path d="M-42 29h82" stroke="#3d301e" stroke-width="8"/><path d="M-42 29h39" stroke="#f59e0b" stroke-width="8"/><circle cx="-3" cy="29" r="7" fill="#fef3c7" stroke="#f59e0b"/></g>
    </g>
  <g class="state-scan" stroke="#f59e0b" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#10b981" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#10b981"/><circle cx="58" cy="2.5" r="1.5" fill="#f59e0b"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
