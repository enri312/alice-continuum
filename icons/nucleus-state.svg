    .s-scan-live{animation:sScan 3.2s ease-in-out infinite}.s-meter-live{transform-box:fill-box;transform-origin:left center;animation:sMeter 2.5s ease-in-out infinite}.s-led-live{animation:sLed 1.2s steps(2,end) infinite}.s-safe-live{animation:sSafe 2s ease-in-out infinite}.s-data-live{animation:sData 2.4s linear infinite}
