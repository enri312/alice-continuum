<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rotar vista">
  <title>Rotar vista</title>
  <style>
    .rotate-dash{animation:rotateDash 2.8s linear infinite}.rotate-blink{animation:rotateBlink 1.6s steps(2,end) infinite}.rotate-blink2{animation:rotateBlink 2.3s steps(2,end) .5s infinite}.rotate-scan{animation:rotateScan 4.2s ease-in-out infinite}.rotate-spin{transform-box:fill-box;transform-origin:50% 50%;animation:rotateSpin 16s linear infinite}
    @keyframes rotateDash{to{stroke-dashoffset:-26}}@keyframes rotateBlink{50%{opacity:.25}}
    @keyframes rotateScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes rotateSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.rotate-dash,.rotate-blink,.rotate-blink2,.rotate-scan,.rotate-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="rotate-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="rotate-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="rotate-gb" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="rotate-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="rotate-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="rotate-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#22d3ee"/><stop offset=".7" stop-color="#fb923c"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="rotate-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="rotate-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#rotate-plate)" stroke="url(#rotate-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="rotate-blink" cx="100" cy="42" r="2.2" fill="#fb923c" filter="url(#rotate-glow)"/>
  <!-- Dual Orbital Rotation Ring Arcs -->
    <g fill="none" stroke-linecap="round" filter="url(#rotate-glow)">
      <path class="rotate-dash" d="M63 83a41 41 0 0 1 70-12" stroke="#22d3ee" stroke-width="6.5" stroke-dasharray="17 8"/>
      <path d="M137 113a41 41 0 0 1-70 12" stroke="#fb923c" stroke-width="6.5"/>
    </g>
    <path d="m137 58-4 25-23-12z" fill="#22d3ee"/><path d="m63 138 4-25 23 12z" fill="#fb923c"/>
    <!-- Center Pivot Gyroscope Ring -->
    <circle cx="100" cy="98" r="9.5" fill="#0b1420" stroke="#e0f2fe" stroke-width="3.2"/>
    <circle cx="100" cy="98" r="3.5" fill="#22d3ee"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="154" fill="#64748b" font-size="3.5" text-anchor="middle">X 0° · Y 0°</text></g>
  <rect class="rotate-scan" x="40" y="50" width="120" height="1.4" fill="#22d3ee"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#22d3ee"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-ROTATE</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">ORBIT</text></g>
</svg>
