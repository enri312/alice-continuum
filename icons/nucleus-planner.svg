<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Planificador de acciones">
  <title>Planificador de acciones</title>
  <style>
    .planner-dash{animation:plannerDash 2.8s linear infinite}.planner-blink{animation:plannerBlink 1.6s steps(2,end) infinite}.planner-blink2{animation:plannerBlink 2.3s steps(2,end) .5s infinite}.planner-scan{animation:plannerScan 4.2s ease-in-out infinite}.planner-spin{transform-box:fill-box;transform-origin:50% 50%;animation:plannerSpin 16s linear infinite}
    @keyframes plannerDash{to{stroke-dashoffset:-26}}@keyframes plannerBlink{50%{opacity:.25}}
    @keyframes plannerScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes plannerSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.planner-dash,.planner-blink,.planner-blink2,.planner-scan,.planner-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="planner-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="planner-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="planner-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="planner-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="planner-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="planner-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f59e0b"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="planner-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="planner-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#planner-plate)" stroke="url(#planner-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="planner-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#planner-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#f59e0b" font-size="4">[04] ACTION PLANNER // ARBITER</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">4-STAGE PIPELINE</text>
    </g>

    <!-- Left: Decision Branching DAG (Candidate Evaluation Graph) -->
    <g filter="url(#planner-shadow)">
      <rect x="38" y="56" width="68" height="68" rx="4" fill="#0c1622" stroke="#f59e0b" stroke-width="1.3"/>
      <rect x="40" y="58" width="64" height="64" rx="3" fill="url(#planner-screen-bg)"/>
    </g>

    <!-- DAG Branching Bezier Flow Lines -->
    <g fill="none" stroke-width="1.4">
      <!-- Path to Candidate 1 (Top) -->
      <path d="M52 90c8 0 10-18 20-18h16" stroke="#475569" stroke-dasharray="3 2"/>
      <!-- Path to Candidate 2 (Selected - Middle) -->
      <path class="planner-dash" d="M52 90h36" stroke="#f59e0b" stroke-dasharray="5 3"/>
      <!-- Path to Candidate 3 (Bottom) -->
      <path d="M52 90c8 0 10 18 20 18h16" stroke="#475569" stroke-dasharray="3 2"/>
    </g>

    <!-- Input Node Checkpoint -->
    <g filter="url(#planner-shadow)">
      <circle cx="49" cy="90" r="6" fill="#1e1808" stroke="#f59e0b" stroke-width="1.4"/>
      <circle cx="49" cy="90" r="2.8" fill="#f59e0b" class="planner-blink"/>
    </g>
    <text x="49" y="101" fill="#fde68a" font-size="2.6" font-family="Consolas,monospace" font-weight="900" text-anchor="middle">INPUT</text>

    <!-- Candidate Nodes on DAG -->
    <!-- Candidate 1 -->
    <rect x="86" y="67" width="14" height="10" rx="2" fill="#0f172a" stroke="#64748b" stroke-width=".9"/>
    <text x="93" y="74" fill="#94a3b8" font-size="3" font-family="Consolas,monospace" font-weight="900" text-anchor="middle">C-01</text>
    
    <!-- Candidate 2 (Selected Active with Glow) -->
    <g filter="url(#planner-glow)">
      <rect x="86" y="85" width="14" height="10" rx="2" fill="#2d1c03" stroke="#f59e0b" stroke-width="1.3"/>
    </g>
    <text x="93" y="92" fill="#fef08a" font-size="3" font-family="Consolas,monospace" font-weight="900" text-anchor="middle">C-02</text>
    <circle cx="86" cy="90" r="1.5" fill="#34d399"/>

    <!-- Candidate 3 -->
    <rect x="86" y="103" width="14" height="10" rx="2" fill="#0f172a" stroke="#64748b" stroke-width=".9"/>
    <text x="93" y="110" fill="#94a3b8" font-size="3" font-family="Consolas,monospace" font-weight="900" text-anchor="middle">C-03</text>

    <!-- Right: 4 Metrics Scoring Matrix -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <!-- Metric 1: Intent (INT) -->
      <g filter="url(#planner-shadow)">
        <rect x="110" y="56" width="52" height="14" rx="2.5" fill="#07131e" stroke="#334155" stroke-width=".9"/>
      </g>
      <text x="114" y="65" fill="#38bdf8">INT</text>
      <rect x="127" y="61" width="22" height="4" rx="2" fill="#020617" stroke="#1e293b" stroke-width=".5"/>
      <rect x="128" y="62" width="16" height="2" rx="1" fill="#38bdf8"/>
      <text x="158" y="65" fill="#bae6fd" text-anchor="end">0.88</text>

      <!-- Metric 2: Utility (UTL) -->
      <g filter="url(#planner-shadow)">
        <rect x="110" y="73" width="52" height="14" rx="2.5" fill="#07131e" stroke="#334155" stroke-width=".9"/>
      </g>
      <text x="114" y="82" fill="#f59e0b">UTL</text>
      <rect x="127" y="78" width="22" height="4" rx="2" fill="#020617" stroke="#1e293b" stroke-width=".5"/>
      <rect x="128" y="79" width="19" height="2" rx="1" fill="#f59e0b"/>
      <text x="158" y="82" fill="#fde68a" text-anchor="end">0.94</text>

      <!-- Metric 3: Safety Risk (RSK) -->
      <g filter="url(#planner-shadow)">
        <rect x="110" y="90" width="52" height="14" rx="2.5" fill="#061f1a" stroke="#10b981" stroke-width=".9"/>
      </g>
      <text x="114" y="99" fill="#34d399">RSK</text>
      <text x="135" y="99" fill="#a7f3d0" font-size="2.8">LOW</text>
      <text x="158" y="99" fill="#34d399" text-anchor="end">0.02</text>

      <!-- Metric 4: Novelty (NOV) -->
      <g filter="url(#planner-shadow)">
        <rect x="110" y="107" width="52" height="14" rx="2.5" fill="#07131e" stroke="#334155" stroke-width=".9"/>
      </g>
      <text x="114" y="116" fill="#94a3b8">NOV</text>
      <rect x="127" y="112" width="22" height="4" rx="2" fill="#020617" stroke="#1e293b" stroke-width=".5"/>
      <rect x="128" y="113" width="8" height="2" rx="1" fill="#94a3b8"/>
      <text x="158" y="116" fill="#94a3b8" text-anchor="end">0.31</text>
    </g>

    <!-- Bottom Decision Arbiter Banner -->
    <g filter="url(#planner-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#131008" stroke="#f59e0b" stroke-width="1.1"/>
    </g>
    <!-- Decision Gate Badge with Lock/Check -->
    <circle cx="48" cy="134.5" r="4.5" fill="#062e24" stroke="#34d399" stroke-width="1"/>
    <path d="m45.5 134.5 1.8 1.8 3.6-3.8" fill="none" stroke="#34d399" stroke-width="1.3" stroke-linecap="round"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#fde68a" font-size="3.5">PLAN: WAITING FOR REAL INPUT</text>
      <text x="157" y="136" fill="#34d399" font-size="3.2" text-anchor="end">NO ACTION</text>
      <text x="42" y="148" fill="#64748b" font-size="3">TRACE: 01➔02➔03➔04</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">DETERMINISTIC EVAL</text>
    </g>
  <g aria-label="Puertas del planificador" font-family="Consolas,monospace" font-weight="900">
    <g fill="#131008" stroke="#f59e0b" stroke-width=".7"><circle cx="48" cy="153" r="4"/><rect x="68" y="149" width="18" height="8" rx="1"/><polygon points="104,149 112,153 104,157 96,153"/><rect x="122" y="149" width="18" height="8" rx="1"/><circle cx="156" cy="153" r="4"/></g>
    <path d="M52 153h16m18 0h10m16 0h10m18 0h12" stroke="#34d399" stroke-width=".75"/><text x="77" y="154.5" fill="#fde68a" font-size="1.8" text-anchor="middle">INTENT</text><text x="131" y="154.5" fill="#fde68a" font-size="1.8" text-anchor="middle">GATE</text>
  </g>
  <rect class="planner-scan" x="40" y="50" width="120" height="1.4" fill="#f59e0b"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f59e0b"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-PLANNER</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">PLANNER</text></g>
</svg>
