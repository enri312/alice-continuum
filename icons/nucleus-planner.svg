<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Planificador de acciones">
  <title>Planificador de acciones</title>
  <style>
    .planner-dash{animation:plannerDash 2.8s linear infinite}.planner-blink{animation:plannerBlink 1.6s steps(2,end) infinite}.planner-blink2{animation:plannerBlink 2.3s steps(2,end) .5s infinite}.planner-scan{animation:plannerScan 4.2s ease-in-out infinite}.planner-spin{transform-box:fill-box;transform-origin:50% 50%;animation:plannerSpin 16s linear infinite}
    @keyframes plannerDash{to{stroke-dashoffset:-26}}@keyframes plannerBlink{50%{opacity:.25}}
    @keyframes plannerScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes plannerSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.planner-dash,.planner-blink,.planner-blink2,.planner-scan,.planner-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="planner-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="planner-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="planner-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="planner-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="planner-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f59e0b"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="planner-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="planner-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#planner-plate)" stroke="url(#planner-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="planner-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#planner-glow)"/>
  <g filter="url(#planner-shadow)"><circle cx="68" cy="92" r="26" fill="#171207" stroke="#f59e0b" stroke-width="1.5"/><circle cx="68" cy="92" r="18.5" fill="none" stroke="#71531c" stroke-dasharray="3 4" class="planner-dash"/></g>
    <path d="M68 70v3M68 114v-3M46 92h3M90 92h-3" stroke="#71531c" stroke-width="1"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3" fill="#64748b"><text x="68" y="66" text-anchor="middle">T-0</text></g>
    <g fill="#38bdf8"><circle cx="68" cy="70" r="2.4"/><circle cx="90" cy="92" r="2.4"/><circle cx="68" cy="114" r="2.4"/><circle cx="46" cy="92" r="2.4"/></g>
    <path d="M68 92v-14M68 92l11 7" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" filter="url(#planner-glow)"/><circle cx="68" cy="92" r="4" fill="#fff1b8" stroke="#a16207"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6">
      <rect x="104" y="66" width="54" height="11" rx="2" fill="#0b1320" stroke="#475569"/><text x="109" y="74" fill="#94a3b8">INTENT</text><text x="153" y="74" fill="#ef4444" text-anchor="end">—</text>
      <rect x="104" y="81" width="54" height="11" rx="2" fill="#0b1320" stroke="#475569"/><text x="109" y="89" fill="#94a3b8">UTILITY</text><text x="153" y="89" fill="#ef4444" text-anchor="end">—</text>
      <rect x="104" y="96" width="54" height="11" rx="2" fill="#0b1320" stroke="#475569"/><text x="109" y="104" fill="#94a3b8">RISK</text><text x="153" y="104" fill="#ef4444" text-anchor="end">—</text>
    </g>
    <rect x="104" y="112" width="54" height="10" rx="2" fill="none" stroke="#475569" stroke-dasharray="3 3"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="131" y="119" fill="#475569" font-size="3.4" text-anchor="middle">+ SLOT</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="141" fill="#475569" font-size="3">R7</text><text x="100" y="141" fill="#fca5a5" font-size="3.8" text-anchor="middle">NO CANDIDATE · NO DECISION</text></g>
  <rect class="planner-scan" x="40" y="50" width="120" height="1.4" fill="#f59e0b"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f59e0b"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-PLANNER</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">PLANNER</text></g>
</svg>
