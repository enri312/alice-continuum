  <path d="M31 43h138l8 8v97l-8 8H31l-8-8V51Z" fill="#030a14" stroke="#155e75" stroke-width="2" filter="url(#bf-shadow)"/>
  <ellipse cx="100" cy="100" rx="63" ry="59" fill="url(#bf-field)"/>
  <ellipse class="bf-ring" cx="100" cy="101" rx="51" ry="57" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 7" opacity=".62"/>

