    <g transform="translate(152 57)"><rect width="20" height="37" fill="#07131f" stroke="#164e63"/><text x="10" y="8" fill="#7dd3fc" text-anchor="middle">BLS</text><path d="M5 15h10M5 21h5M5 27h8" stroke="#e879f9"/><text x="10" y="34" fill="#475569" text-anchor="middle">000</text></g>
  </g>

