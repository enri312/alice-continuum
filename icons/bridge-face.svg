  <g transform="translate(14 65)" fill="#07111e" stroke="#f472b6" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#f472b6"/><circle class="face-pulse" cx="19" cy="27" r="2" fill="#22d3ee" stroke="none"/></g>
