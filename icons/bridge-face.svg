    <path d="M100 91c-6 14-8 27 0 32 8-5 6-18 0-32" stroke="#5eead4"/>
  </g>
  <g fill="#34d399" filter="url(#bf-glow)">
    <circle class="bf-point" cx="77" cy="91" r="2.8"/><circle class="bf-point b" cx="89" cy="88" r="2.8"/><circle class="bf-point c" cx="111" cy="88" r="2.8"/><circle class="bf-point" cx="123" cy="91" r="2.8"/>
    <circle class="bf-point b" cx="100" cy="104" r="2.6"/><circle class="bf-point c" cx="100" cy="122" r="2.6"/><circle class="bf-point" cx="87" cy="131" r="2.6"/><circle class="bf-point b" cx="100" cy="136" r="2.6"/><circle class="bf-point c" cx="113" cy="131" r="2.6"/>
  </g>
  <path class="bf-scan" d="M54 98h92" stroke="url(#bf-scanline)" stroke-width="2.2" filter="url(#bf-glow)"/>

