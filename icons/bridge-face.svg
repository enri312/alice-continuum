<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Calibrador de rostro y canales faciales de Alice">
  <title>Rostro · perfil de calibración facial</title>
  <style>
    .fac-scan{animation:facScan 3s ease-in-out infinite}.fac-dot{animation:facDot 2.2s ease-in-out infinite}.fac-ring{animation:facRing 5s linear infinite}
    @keyframes facScan{0%,100%{transform:translateY(-25px);opacity:.18}50%{transform:translateY(28px);opacity:.85}}@keyframes facDot{50%{opacity:.35}}@keyframes facRing{to{stroke-dashoffset:-30}}
    @media(prefers-reduced-motion:reduce){.fac-scan,.fac-dot,.fac-ring{animation:none}}
  </style>
  <defs>
    <linearGradient id="fac-frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45203e"/><stop offset=".38" stop-color="#191425"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <linearGradient id="fac-panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6" stop-opacity=".16"/><stop offset=".5" stop-color="#111827" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".1"/></linearGradient>
    <linearGradient id="fac-accent" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset=".48" stop-color="#f9a8d4"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="fac-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".32" stop-color="#334155"/><stop offset="1" stop-color="#060b12"/></linearGradient>
    <radialGradient id="fac-lens"><stop stop-color="#fff"/><stop offset=".2" stop-color="#67e8f9"/><stop offset=".58" stop-color="#2563eb"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <pattern id="fac-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0v10" fill="none" stroke="#f472b6" stroke-width=".35" opacity=".2"/></pattern>
    <filter id="fac-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="fac-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Consola coral de perfil; evita por completo una cara frontal -->
  <path d="M17 32 39 12h123l21 19v126l-23 27H39l-22-21Z" fill="#020509" stroke="#020617" stroke-width="3"/>
  <path d="M23 35 43 18h115l19 16v120l-20 23H43l-20-18Z" fill="url(#fac-frame)" stroke="#64748b" stroke-width="1.4"/>
  <path d="M31 43h138v109l-16 17H48l-17-15Z" fill="url(#fac-panel)" stroke="#fb7185" stroke-width=".9"/>
  <path d="M31 43h138v109l-16 17H48l-17-15Z" fill="url(#fac-grid)"/>
  <path d="M31 43h138v18H31Z" fill="#0b0d15" stroke="#475569"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="39" y="54" fill="#fda4af" font-size="6.2" letter-spacing=".9">FACE CALIBRATION</text><text x="162" y="54" fill="#ef4444" font-size="5.3" text-anchor="end">NO SIGNAL</text></g>

  <!-- Cámara física visible -->
  <g transform="translate(99 31)" filter="url(#fac-shadow)"><path d="M-23-10h46l7 7v17l-7 7h-46l-7-7V-3Z" fill="url(#fac-metal)" stroke="#94a3b8"/><circle r="12" fill="#020617" stroke="#fb7185"/><circle r="8" fill="url(#fac-lens)" stroke="#67e8f9"/><circle cx="-3" cy="-3" r="2" fill="#fff" opacity=".85"/><circle cx="22" cy="11" r="2" fill="#ef4444"/></g>

  <!-- Perfil humano abstracto, amable y técnico -->
  <g transform="translate(96 105)" filter="url(#fac-shadow)">
    <circle class="fac-ring" r="49" fill="#07111d" stroke="#f472b6" stroke-width=".8" stroke-dasharray="6 4" opacity=".8"/>
    <circle class="fac-ring" r="42" fill="none" stroke="#22d3ee" stroke-width=".6" stroke-dasharray="2 5" opacity=".55"/>
    <path d="M-17-38c18-10 39-5 47 12 4 9 2 18 8 24l9 9-9 7c0 13-5 22-17 25l-2 12h-44l8-18c-12-13-17-28-13-43 2-12 7-22 13-28Z" fill="#111c2a" stroke="url(#fac-accent)" stroke-width="2"/>
    <path d="M-17-38c16 2 27 12 31 27M14-11c7 2 12 6 15 12M28 8l10 6-11 3M26 22q-4 4-10 2M-16 33c11 3 23 1 32-6" fill="none" stroke="#94a3b8" stroke-width="1" opacity=".65"/>
    <!-- ojo y landmarks sin expresión inquietante -->
    <path d="M10-8q8-6 15 0-8 5-15 0Z" fill="#38bdf8" stroke="#bae6fd"/><circle cx="18" cy="-8" r="1.8" fill="#fff"/>
    <g class="fac-dot" fill="#fff" stroke="#fb7185" stroke-width="1" filter="url(#fac-glow)"><circle cx="2" cy="-24" r="2"/><circle cx="12" cy="-14" r="2"/><circle cx="25" cy="-8" r="2"/><circle cx="31" cy="2" r="2"/><circle cx="38" cy="14" r="2"/><circle cx="27" cy="23" r="2"/><circle cx="14" cy="28" r="2"/><circle cx="-4" cy="19" r="2"/></g>
    <g fill="none" stroke="#f472b6" stroke-width=".7" opacity=".75"><path d="M2-24 12-14 25-8 31 2 38 14 27 23 14 28-4 19 2-24"/><path d="M12-14 31 2M-4 19l35-17"/></g>
    <g class="fac-scan" stroke="#22d3ee" filter="url(#fac-glow)"><path d="M-36 0h75"/><path d="M-32-3v6m67-6v6"/></g>
  </g>

  <!-- Cinco dependencias y ocho canales, ambos inactivos -->
  <g font-family="Consolas,monospace" font-weight="900">
    <g transform="translate(35 68)"><path d="M0 0h23v67H0Z" fill="#150b16" stroke="#fb7185"/><text x="11.5" y="8" fill="#fda4af" font-size="4.2" text-anchor="middle">DEPS</text><g fill="#3f0b13" stroke="#ef4444"><circle cx="11.5" cy="18" r="3"/><circle cx="11.5" cy="28" r="3"/><circle cx="11.5" cy="38" r="3"/><circle cx="11.5" cy="48" r="3"/><circle cx="11.5" cy="58" r="3"/></g><text x="11.5" y="65" fill="#ef4444" font-size="4.5" text-anchor="middle">0/5</text></g>
    <g transform="translate(142 68)"><path d="M0 0h23v67H0Z" fill="#07131d" stroke="#22d3ee"/><text x="11.5" y="8" fill="#67e8f9" font-size="4.2" text-anchor="middle">CHANNELS</text><g fill="#0f172a" stroke="#38bdf8"><circle cx="7" cy="18" r="2"/><circle cx="16" cy="18" r="2"/><circle cx="7" cy="28" r="2"/><circle cx="16" cy="28" r="2"/><circle cx="7" cy="38" r="2"/><circle cx="16" cy="38" r="2"/><circle cx="7" cy="48" r="2"/><circle cx="16" cy="48" r="2"/></g><text x="11.5" y="65" fill="#67e8f9" font-size="4.5" text-anchor="middle">0/8</text></g>
  </g>

  <!-- Base de telemetría segura -->
  <path d="m39 151 119 0 15 15-17 18H43l-16-18Z" fill="url(#fac-metal)" stroke="#94a3b8"/>
  <path d="m47 158h103l11 9-10 10H48l-9-10Z" fill="#070b12" stroke="#fb7185" stroke-width=".8"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="52" y="166" fill="#94a3b8" font-size="4.7">LANDMARKS</text><text x="96" y="166" fill="#ef4444" font-size="4.7">000</text><text x="109" y="166" fill="#94a3b8" font-size="4.7">FPS</text><text x="134" y="166" fill="#ef4444" font-size="4.7">00</text><text x="52" y="174" fill="#94a3b8" font-size="4.4">CAMERA</text><text x="81" y="174" fill="#ef4444" font-size="4.4">OFF</text><text x="105" y="174" fill="#94a3b8" font-size="4.4">VIDEO</text><text x="132" y="174" fill="#22d3ee" font-size="4.4">NOT STORED</text></g>
  <g fill="url(#fac-metal)" stroke="#020617"><circle cx="29" cy="31" r="3.5"/><circle cx="171" cy="31" r="3.5"/><circle cx="31" cy="161" r="3.5"/><circle cx="169" cy="159" r="3.5"/></g><g stroke="#cbd5e1" stroke-width=".7"><path d="M26 31h6m-3-3v6M168 31h6m-3-3v6M28 161h6m-3-3v6M166 159h6m-3-3v6"/></g>
</svg>
