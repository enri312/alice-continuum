<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Calibración facial">
  <title>Calibración facial</title>
  <style>
    .face-dash{animation:faceDash 2.8s linear infinite}.face-blink{animation:faceBlink 1.6s steps(2,end) infinite}.face-blink2{animation:faceBlink 2.3s steps(2,end) .5s infinite}.face-scan{animation:faceScan 4.2s ease-in-out infinite}.face-spin{transform-box:fill-box;transform-origin:50% 50%;animation:faceSpin 16s linear infinite}
    @keyframes faceDash{to{stroke-dashoffset:-26}}@keyframes faceBlink{50%{opacity:.25}}
    @keyframes faceScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes faceSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.face-dash,.face-blink,.face-blink2,.face-scan,.face-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="face-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="face-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="face-gb" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="face-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="face-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="face-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f472b6"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="face-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="face-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#face-plate)" stroke="url(#face-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="face-blink" cx="100" cy="42" r="2.2" fill="#22d3ee" filter="url(#face-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#f472b6" font-size="4">[BRIDGE] BIOMETRIA FACIAL // NEURAL_VISION</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">MEDIAPIPE BLENDSHAPE CORE</text>
    </g>

    <!-- Left: Holographic 478-Landmark Vision Node -->
    <g filter="url(#face-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#0d0a14" stroke="#f472b6" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#face-screen-bg)"/>
    </g>
    <!-- Viewport HUD -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#fbcfe8" font-size="2.6">SENSORY_INPUT</text>
      <text x="92" y="66" fill="#22d3ee" font-size="2.6" text-anchor="end">TRACKING</text>
      <circle cx="45" cy="116" r="1.5" fill="#4ade80" class="face-blink"/>
      <text x="49" y="117.5" fill="#4ade80" font-size="2.2">CAM_0 ACTIVE</text>
    </g>

    <!-- Biometric Face Wireframe (Iris/Face Scanner) -->
    <g stroke="#f472b6" stroke-width="0.8" opacity="0.6">
      <!-- Radial Scanner -->
      <circle cx="68" cy="88" r="24" fill="none" stroke-dasharray="2 4"/>
      <circle cx="68" cy="88" r="14" fill="none" stroke-dasharray="1 3"/>
      <!-- Grid Crosshairs -->
      <path d="M44 88 h48 M68 64 v48" opacity="0.4"/>
    </g>
    
    <!-- Face Mesh Topography -->
    <g stroke="#22d3ee" stroke-width="0.6" fill="none">
      <!-- Contour -->
      <path d="M58 80 C58 70, 78 70, 78 80"/>
      <path d="M58 80 L60 96 L65 104 L68 106 L71 104 L76 96 L78 80" fill="#172554" fill-opacity="0.4"/>
      <!-- Inner Features -->
      <!-- Eyes -->
      <path d="M60 84 L62 82 L64 84 Z"/>
      <path d="M72 84 L74 82 L76 84 Z"/>
      <!-- Nose -->
      <path d="M68 84 L65 92 L71 92 Z"/>
      <!-- Mouth -->
      <path d="M63 97 L68 96 L73 97 L68 100 Z"/>
      <!-- Connections -->
      <path d="M58 80 L62 82 M78 80 L74 82 M64 84 L68 84 M72 84 L68 84 M65 92 L63 97 M71 92 L73 97" opacity="0.5"/>
    </g>
    
    <!-- Key Landmarks Tracking Nodes -->
    <g fill="#22d3ee">
      <circle cx="62" cy="83" r="1"/><circle cx="74" cy="83" r="1"/> <!-- Pupils -->
      <circle cx="68" cy="92" r="1.5" fill="#fbcfe8"/> <!-- Nose Tip -->
      <circle cx="63" cy="97" r="1"/><circle cx="73" cy="97" r="1"/> <!-- Mouth Corners -->
      <circle cx="68" cy="106" r="1"/> <!-- Chin -->
    </g>
    <!-- Gaze Vector Projection -->
    <g stroke="#fbcfe8" stroke-width="0.8" stroke-dasharray="1 2" opacity="0.8">
      <path d="M62 83 L55 75 M74 83 L81 75"/>
    </g>

    <!-- Right: Affect Compute (Emotion Engine) -->
    <g filter="url(#face-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#040a12" stroke="#22d3ee" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#020617"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#818cf8" font-size="2.6">AFFECT_COMPUTE</text>
    </g>
    <path d="M108 69h48" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Valence-Arousal Grid -->
    <g transform="translate(132 86)">
      <rect x="-16" y="-14" width="32" height="28" fill="none" stroke="#1e293b" stroke-width="0.8"/>
      <!-- Grid Lines -->
      <path d="M-16 0 h32 M0 -14 v28" stroke="#334155" stroke-width="0.8"/>
      <path d="M-8 -14 v28 M8 -14 v28 M-16 -7 h32 M-16 7 h32" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="1 2"/>
      
      <!-- Current Emotion Plot Point -->
      <circle cx="8" cy="-6" r="2.5" fill="#f472b6" class="face-blink" filter="url(#face-glow)"/>
      <path d="M0 0 L8 -6" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.6"/>
      <path d="M8 -6 h6 M8 -6 v-4" stroke="#f472b6" stroke-width="0.5" opacity="0.8"/>
      
      <!-- Emotion Zones Labels -->
      <text x="0" y="-16" fill="#64748b" font-family="Consolas,monospace" font-weight="900" font-size="1.8" text-anchor="middle">AROUSAL</text>
      <text x="18" y="1" fill="#64748b" font-family="Consolas,monospace" font-weight="900" font-size="1.8" text-anchor="start">VALENCE</text>
    </g>
    
    <!-- Action Units (FACS) Bar Charts -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#94a3b8">
      <text x="108" y="107">AU01: INNER_BROW</text>
      <rect x="108" y="109" width="48" height="2" fill="#1e293b"/>
      <rect x="108" y="109" width="22" height="2" fill="#22d3ee"/>
      
      <text x="108" y="115">AU12: LIP_CORNER</text>
      <rect x="108" y="117" width="48" height="2" fill="#1e293b"/>
      <rect x="108" y="117" width="36" height="2" fill="#4ade80" class="face-blink2"/>
      
      <text x="108" y="123">AU45: BLINK</text>
      <rect x="108" y="125" width="48" height="2" fill="#1e293b"/>
      <rect x="108" y="125" width="8" height="2" fill="#f472b6"/>
    </g>

    <!-- Bottom Module Output Tabs & Terminal -->
    <g filter="url(#face-shadow)">
      <rect x="38" y="129" width="124" height="16" rx="3" fill="#0c0a10" stroke="#f472b6" stroke-width="1.1"/>
    </g>
    
    <!-- Vision Logs & Metrics -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#64748b">
      <text x="42" y="135">> SENSOR: RGB-IR fused (52 FPS)</text>
      <text x="42" y="139">> BLENDSHAPES: 52 coefficients streaming</text>
      <text x="42" y="143">> CONFIDENCE: Landmarks=0.98, Iris=0.94</text>
    </g>
    
    <!-- Status Badges -->
    <path d="M120 130 V144" stroke="#f472b6" stroke-width="0.8" opacity="0.5"/>
    
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <rect x="124" y="131" width="34" height="6" fill="#1e1b4b"/>
      <text x="126" y="135.5" fill="#818cf8">MODE: LOCAL_ONLY</text>
      
      <rect x="124" y="138" width="34" height="6" fill="#052e2b"/>
      <text x="126" y="142.5" fill="#4ade80">VIDEO: NOT STORED</text>
    </g>
  <rect class="face-scan" x="40" y="50" width="120" height="1.4" fill="#f472b6"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f472b6"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-FACE</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">FACE CALIBRATION</text></g>
</svg>
