  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#face-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#face-grid)" stroke="#f472b6" stroke-width=".8" opacity=".78"/>
