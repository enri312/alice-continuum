<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .bf-scan{animation:bfScan 3.1s ease-in-out infinite}.bf-ring{transform-box:fill-box;transform-origin:center;animation:bfRing 10s linear infinite}.bf-dash{animation:bfDash 3s linear infinite}.bf-point{animation:bfPoint 1.9s steps(2,end) infinite}.bf-point.b{animation-delay:-.65s}.bf-point.c{animation-delay:-1.3s}
    @keyframes bfScan{0%,100%{transform:translateY(-47px);opacity:.08}50%{transform:translateY(57px);opacity:.9}}@keyframes bfRing{to{transform:rotate(360deg)}}@keyframes bfDash{to{stroke-dashoffset:-36}}@keyframes bfPoint{50%{opacity:.28}}@media(prefers-reduced-motion:reduce){.bf-scan,.bf-ring,.bf-dash,.bf-point{animation:none}}
  </style>
  <defs>
    <linearGradient id="bf-frame" x1="10" y1="8" x2="190" y2="192"><stop stop-color="#324157"/><stop offset=".48" stop-color="#0b1626"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="bf-field"><stop stop-color="#0e7490" stop-opacity=".34"/><stop offset=".6" stop-color="#312e81" stop-opacity=".12"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <linearGradient id="bf-face" x1="68" y1="54" x2="130" y2="151"><stop stop-color="#0e7490" stop-opacity=".55"/><stop offset=".48" stop-color="#172554" stop-opacity=".5"/><stop offset="1" stop-color="#4c1d95" stop-opacity=".32"/></linearGradient>
    <linearGradient id="bf-scanline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <filter id="bf-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bf-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".86"/></filter>
    <pattern id="bf-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#164e63" stroke-width=".55" opacity=".55"/></pattern>
  </defs>
  <path d="M100 7c79 0 93 14 93 93s-14 93-93 93S7 179 7 100 21 7 100 7Z" fill="url(#bf-frame)" stroke="#0e7490" stroke-width="3"/>
  <path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="url(#bf-grid)" opacity=".5" stroke="#67e8f9"/>
