<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Calibración facial">
  <title>Calibración facial</title>
  <style>
    .face-dash{animation:faceDash 2.8s linear infinite}.face-blink{animation:faceBlink 1.6s steps(2,end) infinite}.face-blink2{animation:faceBlink 2.3s steps(2,end) .5s infinite}.face-scan{animation:faceScan 4.2s ease-in-out infinite}.face-spin{transform-box:fill-box;transform-origin:50% 50%;animation:faceSpin 16s linear infinite}
    @keyframes faceDash{to{stroke-dashoffset:-26}}@keyframes faceBlink{50%{opacity:.25}}
    @keyframes faceScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes faceSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.face-dash,.face-blink,.face-blink2,.face-scan,.face-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="face-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="face-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="face-gb" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="face-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="face-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f472b6"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="face-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="face-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#face-plate)" stroke="url(#face-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#f472b6" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="face-blink" cx="100" cy="42" r="2.2" fill="#22d3ee" filter="url(#face-glow)"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="58" fill="#ef4444" font-size="4.4" text-anchor="end">NO SIGNAL</text></g>
    <g filter="url(#face-shadow)"><rect x="86" y="60" width="28" height="17" rx="3" fill="url(#face-metal)" stroke="#94a3b8"/><circle cx="100" cy="68.5" r="5.6" fill="#020617" stroke="#f472b6"/><circle cx="100" cy="68.5" r="3.4" fill="#0f172a" stroke="#22d3ee" stroke-width=".7"/></g>
    <path d="m93 62 14 12" stroke="#ef4444" stroke-width="1.8"/>
    <g filter="url(#face-shadow)"><path d="M86 90c8-6 20-3 25 7 2 5 1 9 4 13l5 5-5 4c0 7-3 12-9 13l-1 7h-24l4-10c-6-7-9-15-7-23 1-6 4-12 8-16Z" fill="#111c2a" stroke="url(#face-ga)" stroke-width="1.3"/></g>
    <g fill="#475569" stroke="#94a3b8" stroke-width=".6"><circle cx="96" cy="97" r="1.5"/><circle cx="105" cy="101" r="1.5"/><circle cx="110" cy="109" r="1.5"/><circle cx="107" cy="118" r="1.5"/><circle cx="99" cy="123" r="1.5"/><circle cx="90" cy="117" r="1.5"/></g>
    <path d="M96 97l9 4 5 8-3 9-8 5-9-6" fill="none" stroke="#334155" stroke-width=".7"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8" fill="#475569"><text x="114" y="100">LM 478</text><text x="114" y="126">BS 52</text></g>
    <rect class="face-scan" x="84" y="104" width="34" height="1.2" fill="#22d3ee" opacity=".7"/>
    <path d="M70 88h-6v-6M130 88h6v-6M70 124h-6v6M130 124h6v6" fill="none" stroke="#475569" stroke-width=".8"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <g transform="translate(40 66)"><rect width="18" height="58" rx="2" fill="#150b16" stroke="#ef4444"/><text x="9" y="8" fill="#fda4af" font-size="3.4" text-anchor="middle">DEPS</text><g fill="#3f0b13" stroke="#ef4444"><circle cx="9" cy="16" r="2.2"/><circle cx="9" cy="25" r="2.2"/><circle cx="9" cy="34" r="2.2"/><circle cx="9" cy="43" r="2.2"/></g><text x="9" y="54" fill="#ef4444" font-size="3.8" text-anchor="middle">0/5</text></g>
      <g transform="translate(142 66)"><rect width="18" height="58" rx="2" fill="#07131d" stroke="#22d3ee"/><text x="9" y="8" fill="#67e8f9" font-size="3.4" text-anchor="middle">CHAN</text><g fill="#0f172a" stroke="#38bdf8"><circle cx="6" cy="16" r="1.7"/><circle cx="12" cy="16" r="1.7"/><circle cx="6" cy="25" r="1.7"/><circle cx="12" cy="25" r="1.7"/><circle cx="6" cy="34" r="1.7"/><circle cx="12" cy="34" r="1.7"/><circle cx="6" cy="43" r="1.7"/><circle cx="12" cy="43" r="1.7"/></g><text x="9" y="54" fill="#67e8f9" font-size="3.8" text-anchor="middle">0/8</text></g>
    </g>
    <g font-family="Consolas,monospace" font-weight="900"><rect x="64" y="130" width="72" height="9" rx="2" fill="#0b1320" stroke="#22d3ee" stroke-width=".8"/><text x="100" y="136.5" fill="#67e8f9" font-size="3.4" text-anchor="middle">R2 · CRITICAL · 60s</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="146" fill="#475569" font-size="3">MEDIAPIPE</text><text x="100" y="146" fill="#64748b" font-size="3.4" text-anchor="middle">CAMERA OFF · VIDEO NOT STORED</text></g>
  <rect class="face-scan" x="40" y="50" width="120" height="1.4" fill="#f472b6"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f472b6"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-FACE</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">FACE CALIBRATION</text></g>
</svg>
