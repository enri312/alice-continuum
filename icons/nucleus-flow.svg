<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- PREMIUM METALLIC GRADIENTS -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="20%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#fcd34d"/><stop offset="80%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#94a3b8"/><stop offset="60%" stop-color="#f1f5f9"/><stop offset="90%" stop-color="#475569"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="solarCellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="15%" stop-color="#0369a1"/><stop offset="85%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="accentGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0c4a6e"/></radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer><feFuncA type="linear" slope="1.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="2.5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- BACKGROUND BADGE (Ambient Breathing Animation) -->
  <g>
    <path d="M100 10 C 175 10 190 25 190 100 C 190 175 175 190 100 190 C 25 190 10 175 10 100 C 10 25 25 10 100 10 Z" fill="#0f172a" stroke="url(#silverGrad)" stroke-width="2"></path>
    <!-- Inner glowing edge with breathing animation -->
    <path d="M100 13 C 171 13 187 29 187 100 C 187 171 171 187 100 187 C 29 187 13 171 13 100 C 13 29 29 13 100 13 Z" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 18 Q 170 22 182 100 Q 170 178 100 182 Q 30 178 18 100 Q 30 22 100 18 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.15"></path>
    <circle cx="22" cy="22" r="3.5" fill="url(#silverGrad)" filter="url(#dropShadow)"/><circle cx="22" cy="22" r="1.5" fill="#020617"/>
    <circle cx="178" cy="22" r="3.5" fill="url(#silverGrad)" filter="url(#dropShadow)"/><circle cx="178" cy="22" r="1.5" fill="#020617"/>
    <circle cx="22" cy="178" r="3.5" fill="url(#silverGrad)" filter="url(#dropShadow)"/><circle cx="22" cy="178" r="1.5" fill="#020617"/>
    <circle cx="178" cy="178" r="3.5" fill="url(#silverGrad)" filter="url(#dropShadow)"/><circle cx="178" cy="178" r="1.5" fill="#020617"/>
  </g>

  <!-- MAIN SCALED GROUP - DYNAMIC ANIMATED INTERNALS -->
  <g transform="translate(100, 100) scale(1.6)" filter="url(#dropShadow)">

      <!-- Animated Logic Flowchart Matrix -->
      <rect x="-26" y="-38" width="52" height="22" rx="4" fill="url(#darkMetal)" stroke="url(#silverGrad)" stroke-width="2"/>
      <rect x="-20" y="-32" width="40" height="10" rx="3" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" filter="url(#strongGlow)"/>
      <!-- Flow arrows inside processor -->
      <path d="M -12 -27 L 0 -29 L 12 -27" fill="none" stroke="#fff" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="-5 0; 5 0; -5 0" dur="2s" repeatCount="indefinite"/>
      </path>

      <!-- Glowing logic conduits -->
      <line x1="0" y1="-16" x2="0" y2="4" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="-26" y1="4" x2="26" y2="4" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="-26" y1="4" x2="-26" y2="18" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="26" y1="4" x2="26" y2="18" stroke="url(#goldGrad)" stroke-width="4"/>

      <!-- Moving Data Packets on Conduits -->
      <circle cx="0" cy="0" r="3" fill="#fff" filter="url(#strongGlow)"><animateMotion path="M 0 -16 L 0 4 L -26 4 L -26 18" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="0" r="3" fill="#fff" filter="url(#strongGlow)"><animateMotion path="M 0 -16 L 0 4 L 26 4 L 26 18" dur="2s" repeatCount="indefinite" begin="1s"/></circle>

      <!-- Success Logic Branch -->
      <polygon points="-38,18 -14,18 -8,32 -14,46 -38,46 -44,32" fill="url(#solarCellGrad)" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" filter="url(#dropShadow)"/>
      <circle cx="-26" cy="32" r="6" fill="#22c55e" filter="url(#strongGlow)"><animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/></circle>
      <path d="M -29 32 L -26 35 L -20 29" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Fail/Alt Logic Branch -->
      <polygon points="14,18 38,18 44,32 38,46 14,46 8,32" fill="url(#solarCellGrad)" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" filter="url(#dropShadow)"/>
      <circle cx="26" cy="32" r="6" fill="#ef4444" filter="url(#strongGlow)"><animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite" begin="0.5s"/></circle>
      <path d="M 23 29 L 29 35 M 29 29 L 23 35" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  </g>
</svg>
