<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .f-route-live{animation:fRoute 2.4s linear infinite}.f-node-live{transform-box:fill-box;transform-origin:center;animation:fNode 1.7s ease-in-out infinite}.f-packet-live{animation:fPacket 2.2s ease-in-out infinite}.f-meter-live{transform-box:fill-box;transform-origin:left center;animation:fMeter 3s ease-in-out infinite}.f-led-live{animation:fLed 1.1s steps(2,end) infinite}
    @keyframes fRoute{to{stroke-dashoffset:-48}}@keyframes fNode{50%{opacity:.32;transform:scale(.88)}}@keyframes fPacket{0%,100%{transform:translateX(-12px);opacity:.1}50%{transform:translateX(18px);opacity:1}}@keyframes fMeter{50%{transform:scaleX(.7);opacity:.65}}@keyframes fLed{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.f-route-live,.f-node-live,.f-packet-live,.f-meter-live,.f-led-live{animation:none}}
  </style>
