<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Flujo cognitivo">
  <title>Flujo cognitivo</title>
  <style>
    .flow-dash{animation:flowDash 2.8s linear infinite}.flow-blink{animation:flowBlink 1.6s steps(2,end) infinite}.flow-blink2{animation:flowBlink 2.3s steps(2,end) .5s infinite}.flow-scan{animation:flowScan 4.2s ease-in-out infinite}.flow-spin{transform-box:fill-box;transform-origin:50% 50%;animation:flowSpin 16s linear infinite}
    @keyframes flowDash{to{stroke-dashoffset:-26}}@keyframes flowBlink{50%{opacity:.25}}
    @keyframes flowScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes flowSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.flow-dash,.flow-blink,.flow-blink2,.flow-scan,.flow-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="flow-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="flow-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="flow-gb" x1="0" x2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="flow-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="flow-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="flow-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#ec4899"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="flow-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="flow-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#flow-plate)" stroke="url(#flow-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="flow-blink" cx="100" cy="42" r="2.2" fill="#ec4899" filter="url(#flow-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#8b5cf6" font-size="4">[05] FLUJO COGNITIVO // DATA BUS</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">EVIDENCED LINKS ONLY</text>
    </g>

    <!-- Left: Cognitive Graph / Topology -->
    <g filter="url(#flow-shadow)">
      <rect x="38" y="56" width="68" height="68" rx="4" fill="#130b20" stroke="#8b5cf6" stroke-width="1.3"/>
      <rect x="40" y="58" width="64" height="64" rx="3" fill="url(#flow-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#c4b5fd" font-size="2.9">TOPOLOGY_MAP</text>
    </g>

    <!-- Central Nodes & Routing Connections -->
    <g stroke-width="1.2" fill="none">
      <!-- IN -> MEM -->
      <path class="flow-dash" d="M53 84L69 74" stroke="#8b5cf6" stroke-dasharray="3 2"/>
      <!-- MEM -> OUT -->
      <path class="flow-dash" d="M75 74L91 84" stroke="#8b5cf6" stroke-dasharray="3 2" filter="url(#flow-glow)"/>
      <!-- IN -> AFF -->
      <path d="M53 88L69 98" stroke="#64748b" stroke-dasharray="2 2"/>
      <!-- AFF -> OUT -->
      <path d="M75 98L91 88" stroke="#64748b" stroke-dasharray="2 2"/>
    </g>

    <!-- Nodes -->
    <!-- Input Node -->
    <circle cx="50" cy="86" r="4.5" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="50" y="93" fill="#a78bfa" font-family="Consolas,monospace" font-weight="900" font-size="2.2" text-anchor="middle">IN</text>
    
    <!-- Mem Node (Top) -->
    <circle cx="72" cy="72" r="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="72" cy="72" r="2" fill="#8b5cf6" class="flow-blink"/>
    <text x="72" y="66" fill="#ddd6fe" font-family="Consolas,monospace" font-weight="900" font-size="2.2" text-anchor="middle">MEM</text>

    <!-- Aff Node (Bottom) -->
    <circle cx="72" cy="100" r="4.5" fill="#311024" stroke="#ec4899" stroke-width="1"/>
    <text x="72" y="108" fill="#fbcfe8" font-family="Consolas,monospace" font-weight="900" font-size="2.2" text-anchor="middle">AFF</text>

    <!-- Out Node -->
    <circle cx="94" cy="86" r="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="94" y="93" fill="#c4b5fd" font-family="Consolas,monospace" font-weight="900" font-size="2.2" text-anchor="middle">OUT</text>

    <!-- Right: Pipeline Telemetry & Routing Table -->
    <g filter="url(#flow-shadow)">
      <rect x="110" y="56" width="52" height="68" rx="4" fill="#0f071a" stroke="#4c1d95" stroke-width="1.3"/>
      <rect x="112" y="58" width="48" height="64" rx="3" fill="#020617"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="116" y="66" fill="#c4b5fd" font-size="2.9">LINK_TELEMETRY</text>
    </g>

    <!-- Link 1 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="116" y="76" fill="#94a3b8">IN➔MEM</text>
      <text x="156" y="76" fill="#34d399" text-anchor="end">OK</text>
      <rect x="116" y="78" width="40" height="1.5" fill="#1e1b4b"/>
      <rect class="flow-scan" x="116" y="78" width="24" height="1.5" fill="#34d399"/>
      <text x="116" y="84" fill="#64748b" font-size="2.2">LATENCY: 2ms</text>
    </g>

    <!-- Link 2 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="116" y="92" fill="#94a3b8">MEM➔OUT</text>
      <text x="156" y="92" fill="#8b5cf6" text-anchor="end">ACT</text>
      <rect x="116" y="94" width="40" height="1.5" fill="#1e1b4b"/>
      <rect class="flow-scan" x="116" y="94" width="34" height="1.5" fill="#8b5cf6" filter="url(#flow-glow)"/>
      <text x="116" y="100" fill="#64748b" font-size="2.2">LATENCY: 4ms</text>
    </g>

    <!-- Link 3 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="116" y="108" fill="#94a3b8">IN➔AFF</text>
      <text x="156" y="108" fill="#64748b" text-anchor="end">IDLE</text>
      <rect x="116" y="110" width="40" height="1.5" fill="#1e1b4b"/>
      <rect x="116" y="110" width="10" height="1.5" fill="#64748b"/>
      <text x="116" y="116" fill="#475569" font-size="2.2">LATENCY: --</text>
    </g>

    <!-- Bottom Governance & Safety Banner -->
    <g filter="url(#flow-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#1b102b" stroke="#8b5cf6" stroke-width="1.1"/>
    </g>
    <!-- Graph Node Monogram -->
    <circle cx="48" cy="134.5" r="4.5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
    <path d="M46 134.5h4m-2-2v4" stroke="#ec4899" stroke-width="1" stroke-linecap="round"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#ddd6fe" font-size="3.5">BUS: EVIDENCED ROUTES ONLY</text>
      <text x="157" y="136" fill="#8b5cf6" font-size="3.2" text-anchor="end">R3 LINK VALID</text>
      <text x="42" y="148" fill="#64748b" font-size="3">ZERO BLACKBOX COMM</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">DIRECT ACYCLIC [PASS]</text>
    </g>
  <rect class="flow-scan" x="40" y="50" width="120" height="1.4" fill="#8b5cf6"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#8b5cf6"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-FLOW</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">LINKS</text></g>
</svg>
