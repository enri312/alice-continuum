<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Flujo cognitivo">
  <title>Flujo cognitivo</title>
  <style>
    .flow-orbit{animation:flowOrbit 4s linear infinite}.flow-pulse{animation:flowPulse 1.8s ease-in-out infinite}.flow-scan{animation:flowScan 3s ease-in-out infinite}
    @keyframes flowOrbit{to{stroke-dashoffset:-42}}@keyframes flowPulse{50%{opacity:.3}}@keyframes flowScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.flow-orbit,.flow-pulse,.flow-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="flow-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="flow-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="flow-accent" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="flow-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#8b5cf6"/><stop offset=".68" stop-color="#ec4899"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="flow-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#8b5cf6" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="flow-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="flow-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="flow-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#flow-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#flow-grid)" stroke="#8b5cf6" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#flow-beam)"/>
  <circle class="flow-orbit" cx="100" cy="100" r="71" fill="none" stroke="#8b5cf6" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="flow-orbit" cx="100" cy="100" r="62" fill="none" stroke="#ec4899" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#8b5cf6" stroke-width="1" opacity=".65"/>
  <g fill="url(#flow-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#8b5cf6" filter="url(#flow-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#ec4899"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#8b5cf6" font-size="7" text-anchor="middle" letter-spacing="1.5">FLOW · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#8b5cf6" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#8b5cf6"/><circle class="flow-pulse" cx="19" cy="27" r="2" fill="#ec4899" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#ec4899" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#ec4899"/><circle class="flow-pulse" cx="8" cy="27" r="2" fill="#8b5cf6" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#flow-shadow)">
      <path d="M-61 43 0 13l61 30L0 73z" fill="#111126" stroke="#645a85"/><path d="M-61 43 0 73v8l-61-30z" fill="#090816"/><path d="M61 43 0 73v8l61-30z" fill="#0e0c1d"/>
      <path d="M-55-1h22c11 0 9-34 22-34H5c13 0 12 67 25 67h27M-55-32h17c12 0 10 58 24 58H2c13 0 13-28 27-28h28" fill="none" stroke="url(#flow-accent)" stroke-width="4" stroke-linecap="round" filter="url(#flow-glow)"/>
      <g stroke="#fff" stroke-width="1.5"><circle cx="-55" cy="-1" r="7" fill="#8b5cf6"/><circle cx="-11" cy="-35" r="7" fill="#a78bfa"/><circle cx="30" cy="32" r="7" fill="#ec4899"/><circle cx="57" cy="32" r="7" fill="#f9a8d4"/></g>
      <path d="m51 27 6 5-6 5" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
  <g font-family="Consolas,monospace" font-size="5" font-weight="900"><g transform="translate(31 126)"><rect width="138" height="30" rx="3" fill="#100c1b" stroke="#8b5cf6"/><g fill="#1e1b4b" stroke="#8b5cf6"><circle cx="12" cy="15" r="7"/><circle cx="39" cy="15" r="7"/><circle cx="66" cy="15" r="7"/></g><g fill="#4a1638" stroke="#ec4899"><circle cx="93" cy="15" r="7"/><circle cx="120" cy="15" r="7"/></g><path d="M19 15h13m14 0h13m14 0h13m14 0h13" stroke="#e2e8f0"/><text x="12" y="17" fill="#fff" text-anchor="middle">IN</text><text x="39" y="17" fill="#fff" text-anchor="middle">MEM</text><text x="66" y="17" fill="#fff" text-anchor="middle">AFF</text><text x="93" y="17" fill="#fff" text-anchor="middle">WS</text><text x="120" y="17" fill="#fff" text-anchor="middle">OUT</text></g><text x="100" y="163" fill="#e9d5ff" text-anchor="middle">EVIDENCED LINKS ONLY</text></g>
  <g class="flow-scan" stroke="#ec4899" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#8b5cf6" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#8b5cf6"/><circle cx="58" cy="2.5" r="1.5" fill="#ec4899"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
