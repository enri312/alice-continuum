<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Procedimientos" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <title>Procedimientos</title>
  <style>
    .procedures-dash{animation:proceduresDash 2.8s linear infinite}.procedures-blink{animation:proceduresBlink 1.6s steps(2,end) infinite}.procedures-blink2{animation:proceduresBlink 2.3s steps(2,end) .5s infinite}.procedures-scan{animation:proceduresScan 4.2s ease-in-out infinite}.procedures-spin{transform-box:fill-box;transform-origin:50% 50%;animation:proceduresSpin 16s linear infinite}
    @keyframes proceduresDash{to{stroke-dashoffset:-26}}@keyframes proceduresBlink{50%{opacity:.25}}
    @keyframes proceduresScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes proceduresSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.procedures-dash,.procedures-blink,.procedures-blink2,.procedures-scan,.procedures-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="procedures-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="procedures-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="procedures-gb" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="procedures-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="procedures-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="procedures-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#34d399"/><stop offset=".7" stop-color="#fbbf24"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="procedures-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="procedures-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#procedures-plate)" stroke="url(#procedures-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="procedures-blink" cx="100" cy="42" r="2.2" fill="#fbbf24" filter="url(#procedures-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#34d399" font-size="4">[09] APRENDIZAJE // PROCEDURE_STORE</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">PATTERN RECOGNITION</text>
    </g>

    <!-- Left: Pattern Recognition / Memory Extractor -->
    <g filter="url(#procedures-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#041a14" stroke="#34d399" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#procedures-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#a7f3d0" font-size="2.9">EPISODIC_SCAN</text>
    </g>

    <!-- Scanning visualization -->
    <g stroke-width="1" fill="none">
      <!-- Activity traces -->
      <path d="M44 80 L90 80" stroke="#0f766e" stroke-dasharray="2 2"/>
      <path d="M44 95 L90 95" stroke="#0f766e" stroke-dasharray="2 2"/>
      <path d="M44 110 L90 110" stroke="#0f766e" stroke-dasharray="2 2"/>
      
      <!-- Pattern matches (pulses) -->
      <circle cx="56" cy="80" r="3" fill="#34d399" class="procedures-blink"/>
      <circle cx="68" cy="95" r="3" fill="#34d399"/>
      <circle cx="80" cy="110" r="3" fill="#34d399" class="procedures-blink"/>

      <!-- Connecting pattern -->
      <path d="M56 80 L68 95 L80 110" stroke="#34d399" stroke-width="1.2" class="procedures-dash"/>
    </g>
    
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="119" fill="#6ee7b7" font-size="2.4">PATTERN MATCHED</text>
      <text x="90" y="119" fill="#0f766e" font-size="2.4" text-anchor="end">3 OCC</text>
    </g>

    <!-- Right: Pipeline Promotion -->
    <g filter="url(#procedures-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#1f1402" stroke="#fbbf24" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#130b02"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#fde68a" font-size="2.9">PROMOTION_PIPELINE</text>
    </g>

    <!-- Pipeline steps -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <rect x="108" y="72" width="48" height="9" rx="1.5" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
      <text x="112" y="78.5" fill="#a7f3d0">1. CANDIDATE</text>
      <text x="152" y="78.5" fill="#34d399" text-anchor="end">R3</text>

      <path d="M132 81v4" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="1 1"/>
      <path d="M131 84l1 1 1-1" stroke="#94a3b8" fill="none" stroke-width="0.8"/>

      <rect x="108" y="85" width="48" height="9" rx="1.5" fill="#422006" stroke="#fbbf24" stroke-width="0.8"/>
      <text x="112" y="91.5" fill="#fef3c7">2. R4_DRAFT</text>
      <text x="152" y="91.5" fill="#fbbf24" text-anchor="end">R4</text>

      <path d="M132 94v4" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="1 1"/>
      <path d="M131 97l1 1 1-1" stroke="#94a3b8" fill="none" stroke-width="0.8"/>

      <rect x="108" y="98" width="48" height="9" rx="1.5" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
      <text x="112" y="104.5" fill="#94a3b8">3. EXEC_PROC</text>
      <text x="152" y="104.5" fill="#475569" text-anchor="end">R5</text>
    </g>

    <!-- Status indicator for promotion -->
    <g font-family="Consolas,monospace" font-weight="900">
      <circle cx="112" cy="116" r="2" fill="#fbbf24" class="procedures-blink"/>
      <text x="118" y="117.5" fill="#fcd34d" font-size="2.4">AWAITING REVIEW</text>
    </g>

    <!-- Bottom Governance & Safety Banner -->
    <g filter="url(#procedures-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#041a14" stroke="#34d399" stroke-width="1.1"/>
    </g>
    <!-- Safety Monogram -->
    <circle cx="48" cy="134.5" r="4.5" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <path d="M46 134.5l1.5 1.5 3-3.5" fill="none" stroke="#a7f3d0" stroke-width="1.2"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#a7f3d0" font-size="3.5">POLICY: NEVER EXECUTE R4/R5</text>
      <text x="157" y="136" fill="#fbbf24" font-size="3.2" text-anchor="end">HUMAN_IN_LOOP</text>
      <text x="42" y="148" fill="#64748b" font-size="3">PROCEDURE SANDBOX</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">ZERO AUTONOMY [PASS]</text>
    </g>
  <g aria-label="Máquina de estados procedural" font-family="Consolas,monospace" font-weight="900">
    <g fill="#041a14" stroke="#34d399" stroke-width=".7"><rect x="42" y="150" width="18" height="7" rx="1"/><rect x="70" y="150" width="18" height="7" rx="1"/><rect x="98" y="150" width="18" height="7" rx="1"/><rect x="126" y="150" width="18" height="7" rx="1"/></g>
    <path d="M60 153.5h10m18 0h10m18 0h10m18 0h14" stroke="#fbbf24" stroke-width=".8"/><text x="51" y="155" fill="#a7f3d0" font-size="2" text-anchor="middle">OBS</text><text x="79" y="155" fill="#a7f3d0" font-size="2" text-anchor="middle">REVIEW</text><text x="107" y="155" fill="#a7f3d0" font-size="2" text-anchor="middle">DRAFT</text><text x="135" y="155" fill="#a7f3d0" font-size="2" text-anchor="middle">BLOCK</text>
  </g>
  <rect class="procedures-scan" x="40" y="50" width="120" height="1.4" fill="#34d399"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#34d399"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-PROCEDURES</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">LEARNING</text></g>
</svg>
