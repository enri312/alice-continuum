<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Procedimientos">
  <title>Procedimientos</title>
  <style>
    .procedures-orbit{animation:proceduresOrbit 4s linear infinite}.procedures-pulse{animation:proceduresPulse 1.8s ease-in-out infinite}.procedures-scan{animation:proceduresScan 3s ease-in-out infinite}
    @keyframes proceduresOrbit{to{stroke-dashoffset:-42}}@keyframes proceduresPulse{50%{opacity:.3}}@keyframes proceduresScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.procedures-orbit,.procedures-pulse,.procedures-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="procedures-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="procedures-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="procedures-accent" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <radialGradient id="procedures-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#34d399"/><stop offset=".68" stop-color="#fbbf24"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="procedures-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#34d399" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="procedures-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="procedures-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="procedures-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#procedures-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#procedures-grid)" stroke="#34d399" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#procedures-beam)"/>
  <circle class="procedures-orbit" cx="100" cy="100" r="71" fill="none" stroke="#34d399" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="procedures-orbit" cx="100" cy="100" r="62" fill="none" stroke="#fbbf24" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#34d399" stroke-width="1" opacity=".65"/>
  <g fill="url(#procedures-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#34d399" filter="url(#procedures-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#fbbf24"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#34d399" font-size="7" text-anchor="middle" letter-spacing="1.5">PROCEDURES · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#34d399" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#34d399"/><circle class="procedures-pulse" cx="19" cy="27" r="2" fill="#fbbf24" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#fbbf24" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#fbbf24"/><circle class="procedures-pulse" cx="8" cy="27" r="2" fill="#34d399" stroke="none"/></g>
  <g transform="translate(100 89)" filter="url(#procedures-shadow)">
      <path d="M-50-53 45-45 50 54-45 46z" fill="#0d1f22" stroke="#34d399" stroke-width="2"/><path d="M-40-42 35-36 39 43-36 37z" fill="#101923" stroke="#64748b"/>
      <g fill="#071318" stroke-width="1.5"><rect x="-28" y="-26" width="18" height="18" rx="3" stroke="#34d399"/><rect x="-28" y="1" width="18" height="18" rx="3" stroke="#34d399"/><rect x="-28" y="28" width="18" height="18" rx="3" stroke="#fbbf24"/></g>
      <path d="m-24-17 4 4 8-10m-12 33 4 4 8-10" fill="none" stroke="#ecfdf5" stroke-width="2.5"/>
      <circle cx="-19" cy="37" r="4" fill="#fbbf24" filter="url(#procedures-glow)"/>
      <path d="M1-20h27M1-11h20M1 7h30M1 16h24M1 34h28M1 43h18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <path d="M-19-8V1m0 18v9" stroke="#64748b"/>
    </g>
  <g font-family="Consolas,monospace" font-size="5" font-weight="900"><g transform="translate(33 125)"><rect width="134" height="32" rx="3" fill="#071713" stroke="#34d399"/><g fill="#052e2b" stroke="#34d399"><rect x="5" y="6" width="30" height="19"/><rect x="52" y="6" width="30" height="19"/></g><rect x="99" y="6" width="30" height="19" fill="#422006" stroke="#fbbf24"/><text x="20" y="14" fill="#34d399" text-anchor="middle">R3 × 3</text><text x="67" y="14" fill="#34d399" text-anchor="middle">CANDIDATE</text><text x="114" y="14" fill="#fbbf24" text-anchor="middle">R4 DRAFT</text><path d="M35 15h17m30 0h17" stroke="#e2e8f0"/><path d="m47 11 5 4-5 4m47-8 5 4-5 4" fill="none" stroke="#e2e8f0"/><text x="67" y="23" fill="#94a3b8" text-anchor="middle">REVIEW REQUIRED</text></g><text x="100" y="164" fill="#fca5a5" text-anchor="middle">DETECT · RETAIN · NEVER EXECUTE</text></g>
  <g class="procedures-scan" stroke="#fbbf24" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#34d399" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#34d399"/><circle cx="58" cy="2.5" r="1.5" fill="#fbbf24"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
