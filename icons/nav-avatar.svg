<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Avatar">
  <title>Avatar</title>
  <style>
    .avatar-dash{animation:avatarDash 2.8s linear infinite}.avatar-blink{animation:avatarBlink 1.6s steps(2,end) infinite}.avatar-blink2{animation:avatarBlink 2.3s steps(2,end) .5s infinite}.avatar-scan{animation:avatarScan 4.2s ease-in-out infinite}.avatar-spin{transform-box:fill-box;transform-origin:50% 50%;animation:avatarSpin 16s linear infinite}
    @keyframes avatarDash{to{stroke-dashoffset:-26}}@keyframes avatarBlink{50%{opacity:.25}}
    @keyframes avatarScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes avatarSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.avatar-dash,.avatar-blink,.avatar-blink2,.avatar-scan,.avatar-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="avatar-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="avatar-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="avatar-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="avatar-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="avatar-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f472b6"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="avatar-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="avatar-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#avatar-plate)" stroke="url(#avatar-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#f472b6" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="avatar-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#avatar-glow)"/>
  <g filter="url(#avatar-shadow)"><rect x="40" y="56" width="70" height="64" rx="3" fill="#0d0a14" stroke="#f472b6" stroke-width="1.2"/></g>
    <circle cx="46" cy="62" r="1.6" fill="#4ade80" class="avatar-blink" filter="url(#avatar-glow)"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="51" y="64" fill="#4ade80" font-size="3.6">MODELO CARGADO</text><text x="106" y="64" fill="#64748b" font-size="3.2" text-anchor="end">ALICE · AVATAR</text></g>
    <g><circle cx="75" cy="82" r="5" fill="url(#avatar-halo)" stroke="#cbd5e1" stroke-width=".9"/>
      <path d="M70 88h10l2 12-3 9h-8l-3-9Z" fill="#1f2937" stroke="#64748b" stroke-width=".9"/>
      <path d="M70 89l-5 3-1 9M80 89l5 3 1 9" fill="none" stroke="#273448" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M72 109l-1 6M78 109l1 6" fill="none" stroke="#101722" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M68 90c-3 6-3 12-1 18M82 90c3 6 3 12 1 18" fill="none" stroke="#f472b6" stroke-width=".8" opacity=".8" stroke-dasharray="4 3" class="avatar-dash"/>
    </g>
    <g fill="#fff" stroke="#38bdf8" stroke-width=".6"><circle cx="70" cy="89" r=".9"/><circle cx="80" cy="89" r=".9"/><circle cx="64" cy="101" r=".9"/><circle cx="86" cy="101" r=".9"/><circle cx="71" cy="109" r=".9"/><circle cx="79" cy="109" r=".9"/></g>
    <ellipse cx="75" cy="117" rx="16" ry="3.4" fill="none" stroke="#38bdf8" stroke-width=".8" stroke-dasharray="5 4" class="avatar-dash"/>
    <g transform="translate(94 116) scale(.8)" fill="#172536" stroke="#93c5fd" stroke-width=".9"><path d="M0 0c1.5-4 5.5-5 9-2.5l2.5 2.5h9l2.5-2.5c3.5-2.5 7.5-1.5 9 2.5l-3 4-5-1.5h-14l-5 1.5z"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="108" y="106" fill="#64748b" font-size="3.2" text-anchor="end">TEST 10s</text><text x="108" y="112" fill="#64748b" font-size="3.2" text-anchor="end">MANUAL · R3</text></g>
    <g filter="url(#avatar-shadow)"><path d="M114 56h46v64h-46l-4-6V62Z" fill="#100d1c" stroke="#38bdf8"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="118" y="63" fill="#c4b5fd" font-size="3.8">INSPECTOR VRM</text></g>
    <path d="M118 66h38" stroke="#312e81" stroke-width=".7"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <text x="118" y="72" fill="#64748b">HUESOS</text><rect x="144" y="69.6" width="12" height="2.4" fill="#164e63"/><rect x="144" y="69.6" width="8" height="2.4" fill="#38bdf8" class="avatar-blink2"/>
      <text x="118" y="79" fill="#64748b">EXPR</text><text x="156" y="79" fill="#e0f2fe" text-anchor="end">14</text>
      <text x="118" y="86" fill="#64748b">SPRINGS</text><rect x="144" y="83.6" width="12" height="2.4" fill="#3b0764"/><rect x="144" y="83.6" width="6" height="2.4" fill="#f472b6" class="avatar-blink2"/>
      <text x="118" y="93" fill="#64748b">CLIPS</text><text x="156" y="93" fill="#e0f2fe" text-anchor="end">12</text>
    </g>
    <path d="M118 97h38" stroke="#312e81" stroke-width=".7"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.8"><text x="118" y="102" fill="#64748b">FACIAL · SOLO LECTURA</text><text x="118" y="107" fill="#475569">LICENCIA · PRIVADA</text></g>
    <path d="M150 103h5v4.5h-5Zm1-.9v-1.4a1.6 1.6 0 0 1 3.2 0v1.4" fill="none" stroke="#94a3b8" stroke-width=".7"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <rect x="40" y="126" width="29" height="10" rx="2" fill="#052e2b" stroke="#4ade80" stroke-width=".7"/><circle cx="45" cy="131" r="1.4" fill="#4ade80" class="avatar-blink2"/><text x="49" y="133" fill="#a7f3d0">01 RENDER</text>
      <rect x="71" y="126" width="29" height="10" rx="2" fill="#0b1320" stroke="#475569" stroke-width=".7"/><text x="76" y="133" fill="#64748b">02 EXPR</text>
      <rect x="102" y="126" width="29" height="10" rx="2" fill="#0b1320" stroke="#475569" stroke-width=".7"/><text x="107" y="133" fill="#64748b">03 VOZ</text>
      <rect x="133" y="126" width="27" height="10" rx="2" fill="#0b1320" stroke="#475569" stroke-width=".7"/><text x="137" y="133" fill="#64748b">04 RAGDOLL</text>
    </g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="146" fill="#64748b" font-size="3.6" text-anchor="middle">ALICE.VRM · LOCAL · PRIVATE</text></g>
  <rect class="avatar-scan" x="40" y="50" width="120" height="1.4" fill="#f472b6"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f472b6"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-AVATAR</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">AVATAR</text></g>
</svg>
