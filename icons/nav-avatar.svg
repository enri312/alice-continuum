<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Avatar">
  <title>Avatar</title>
  <style>
    .av-ring{animation:avRing 4s linear infinite}.av-joint{animation:avJoint 1.8s ease-in-out infinite}.av-scan{animation:avScan 3.2s ease-in-out infinite}.av-data{animation:avData 2.3s ease-in-out infinite}
    @keyframes avRing{to{stroke-dashoffset:-48}}@keyframes avJoint{50%{opacity:.3}}@keyframes avScan{0%,100%{transform:translateY(-20px);opacity:.15}50%{transform:translateY(45px);opacity:.85}}@keyframes avData{50%{transform:translateX(4px);opacity:.4}}
    @media (prefers-reduced-motion:reduce){.av-ring,.av-joint,.av-scan,.av-data{animation:none}}
  </style>
  <defs>
    <linearGradient id="av-arch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset=".28" stop-color="#1e293b"/><stop offset=".7" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="av-glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0ea5e9" stop-opacity=".3"/><stop offset=".48" stop-color="#312e81" stop-opacity=".16"/><stop offset="1" stop-color="#020617" stop-opacity=".8"/></linearGradient>
    <linearGradient id="av-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset=".33" stop-color="#94a3b8"/><stop offset=".68" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="av-coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#475569"/><stop offset=".5" stop-color="#172033"/><stop offset="1" stop-color="#060914"/></linearGradient>
    <radialGradient id="av-field"><stop stop-color="#38bdf8" stop-opacity=".35"/><stop offset=".55" stop-color="#a855f7" stop-opacity=".12"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <filter id="av-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="av-shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".9"/></filter>
    <pattern id="av-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0v10" fill="none" stroke="#38bdf8" stroke-width=".45" opacity=".2"/></pattern>
    <clipPath id="av-capsule"><path d="M46 158V63C46 27 65 11 100 11s54 16 54 52v95l-54 31z"/></clipPath>
  </defs>

  <!-- Silueta propia: portal vertical, no insignia squircle -->
  <path d="M42 161V61C42 22 62 6 100 6s58 16 58 55v100l-58 34z" fill="#03060c" stroke="#020617" stroke-width="3"/>
  <path d="M48 157V64c0-34 17-49 52-49s52 15 52 49v93l-52 30z" fill="url(#av-arch)" stroke="#94a3b8" stroke-width="2"/>
  <path d="M56 151V66c0-28 14-40 44-40s44 12 44 40v85l-44 25z" fill="url(#av-glass)" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M56 151V66c0-28 14-40 44-40s44 12 44 40v85l-44 25z" fill="url(#av-grid)"/>
  <circle cx="100" cy="96" r="52" fill="url(#av-field)"/>

  <!-- Rieles y módulos laterales -->
  <g fill="#0b1320" stroke="#64748b" filter="url(#av-shadow)">
    <path d="M30 47h21v99H30l-8-10V58z"/><path d="M149 47h21l8 11v78l-8 10h-21z"/>
  </g>
  <g fill="#071521" stroke="#38bdf8"><rect x="27" y="59" width="18" height="23" rx="3"/><rect x="27" y="91" width="18" height="23" rx="3"/><rect x="27" y="123" width="18" height="13" rx="3"/></g>
  <g fill="#150b20" stroke="#f472b6"><rect x="155" y="59" width="18" height="23" rx="3"/><rect x="155" y="91" width="18" height="23" rx="3"/><rect x="155" y="123" width="18" height="13" rx="3"/></g>
  <g stroke-width="1.3"><g stroke="#38bdf8"><path d="M31 65h10m-10 5h7m-7 5h10M31 97h10m-10 5h7m-7 5h10M31 129h10"/></g><g stroke="#f472b6"><path d="M159 65h10m-7 5h7m-10 5h10M159 97h10m-7 5h7m-10 5h10M159 129h10"/></g></g>
  <g class="av-data" fill="#fff" filter="url(#av-glow)"><circle cx="36" cy="86" r="2"/><circle cx="164" cy="86" r="2"/></g>

  <!-- Figura VRM completa -->
  <g transform="translate(100 99)" filter="url(#av-shadow)">
    <path d="M-24-38C-21-57-12-66 0-66s21 9 24 28v22c0 18-10 29-24 29s-24-11-24-29z" fill="url(#av-body)" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M-19-31c6-9 32-9 38 0v16C12-6-12-6-19-15z" fill="#06111c" stroke="#67e8f9"/>
    <path d="M-13-22h9m8 0h9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#av-glow)"/>
    <path d="M-9 1q9 5 18 0" fill="none" stroke="#fce7f3"/>
    <path d="M-27 9-38 49l15 25H23l15-25L27 9 13 4 0 17-13 4z" fill="url(#av-coat)" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M-13 4 0 17 13 4 8 35H-8z" fill="#e2e8f0" opacity=".85"/><path d="M0 17v31" stroke="#f472b6" stroke-width="2"/>
    <path d="M-27 15-45 45l9 8 25-27M27 15l45 30-9 8-25-27" fill="none" stroke="url(#av-body)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-17 72-14 101h11L0 76l3 25h11l3-29" fill="url(#av-body)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M-17 72h34M-13 101h12m2 0h12" stroke="#38bdf8" stroke-width="2"/>
    <g class="av-joint" fill="#fff" stroke="#f472b6"><circle cy="17" r="3"/><circle cx="-27" cy="15" r="3"/><circle cx="27" cy="15" r="3"/><circle cx="-45" cy="45" r="3"/><circle cx="45" cy="45" r="3"/><circle cx="-17" cy="72" r="3"/><circle cx="17" cy="72" r="3"/><circle cx="-14" cy="101" r="3"/><circle cx="14" cy="101" r="3"/></g>
  </g>

  <!-- Escáner y anillos de encarnación -->
  <ellipse class="av-ring" cx="100" cy="160" rx="49" ry="15" fill="#07111e" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" filter="url(#av-glow)"/>
  <ellipse cx="100" cy="160" rx="35" ry="9" fill="none" stroke="#f472b6" stroke-dasharray="3 3"/>
  <g class="av-scan" clip-path="url(#av-capsule)"><rect x="52" y="58" width="96" height="3" fill="#67e8f9" filter="url(#av-glow)"/><path d="M54 61h92l-10 18H64z" fill="#38bdf8" opacity=".12"/></g>

  <!-- Cabecera y telemetría específica -->
  <path d="M68 16h64l10 13-10 12H68L58 29z" fill="#07111e" stroke="#38bdf8"/>
  <text x="100" y="27" fill="#7dd3fc" font-family="Consolas,monospace" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1.2">AVATAR · VRM PRIVATE</text>
  <text x="100" y="35" fill="#f9a8d4" font-family="Consolas,monospace" font-size="5" font-weight="900" text-anchor="middle">EMBODIMENT CORE</text>
  <g transform="translate(17 154)" font-family="Consolas,monospace" font-size="5" font-weight="900"><rect width="50" height="29" rx="4" fill="#07111e" stroke="#38bdf8"/><text x="6" y="9" fill="#94a3b8">STATE</text><text x="28" y="9" fill="#4ade80">IDLE</text><text x="6" y="17" fill="#94a3b8">CLIPS</text><text x="28" y="17" fill="#38bdf8">8</text><text x="6" y="25" fill="#94a3b8">RIG</text><text x="28" y="25" fill="#e2e8f0">HUMANOID</text></g>
  <g transform="translate(133 154)" font-family="Consolas,monospace" font-size="5" font-weight="900"><rect width="50" height="29" rx="4" fill="#150b20" stroke="#f472b6"/><text x="6" y="9" fill="#94a3b8">INPUT</text><text x="27" y="9" fill="#f9a8d4">PS5</text><text x="6" y="17" fill="#94a3b8">MOTOR</text><text x="30" y="17" fill="#4ade80">READY</text><text x="6" y="25" fill="#94a3b8">SAFE</text><text x="27" y="25" fill="#e2e8f0">LOCAL</text></g>
  <g fill="#475569" stroke="#020617"><circle cx="21" cy="40" r="4"/><circle cx="179" cy="40" r="4"/></g><g stroke="#cbd5e1"><path d="m18 37 6 6m152-6 6 6"/></g>
</svg>
