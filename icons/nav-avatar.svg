<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Avatar">
  <title>Avatar</title>
  <style>
    .avatar-dash{animation:avatarDash 2.8s linear infinite}.avatar-blink{animation:avatarBlink 1.6s steps(2,end) infinite}.avatar-blink2{animation:avatarBlink 2.3s steps(2,end) .5s infinite}.avatar-scan{animation:avatarScan 4.2s ease-in-out infinite}.avatar-spin{transform-box:fill-box;transform-origin:50% 50%;animation:avatarSpin 16s linear infinite}
    @keyframes avatarDash{to{stroke-dashoffset:-26}}@keyframes avatarBlink{50%{opacity:.25}}
    @keyframes avatarScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes avatarSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.avatar-dash,.avatar-blink,.avatar-blink2,.avatar-scan,.avatar-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="avatar-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="avatar-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="avatar-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="avatar-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="avatar-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="avatar-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#f472b6"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="avatar-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="avatar-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#avatar-plate)" stroke="url(#avatar-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="avatar-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#avatar-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#f472b6" font-size="4">[04] NEURAL_PROJECTION // KINEMATIC_CORE</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">VRM BIOMETRIC ENGINE</text>
    </g>

    <!-- Left: Holographic 3D Mesh Viewport -->
    <g filter="url(#avatar-shadow)">
      <rect x="38" y="56" width="70" height="68" rx="4" fill="#0d0a14" stroke="#f472b6" stroke-width="1.3"/>
      <rect x="40" y="58" width="66" height="64" rx="3" fill="url(#avatar-screen-bg)"/>
    </g>
    <!-- Viewport HUD & Labels -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#a7f3d0" font-size="2.6">ALICE_MESH_V3</text>
      <text x="102" y="66" fill="#38bdf8" font-size="2.6" text-anchor="end">SYNC: OPTIMAL</text>
    </g>
    
    <!-- Concentric Radar/Targeting Background -->
    <g stroke="#1e293b" fill="none" stroke-width="0.8">
      <circle cx="73" cy="90" r="26" stroke-dasharray="2 4"/>
      <circle cx="73" cy="90" r="18"/>
      <circle cx="73" cy="90" r="10" stroke-dasharray="1 2"/>
      <path d="M47 90h52 M73 64v52" opacity="0.5"/>
    </g>

    <!-- High-Fidelity Topographic/Wireframe Head -->
    <g stroke="#f472b6" stroke-width="0.6" fill="none" opacity="0.85">
      <!-- Cranium/Dome -->
      <path d="M63 76 C63 68, 83 68, 83 76" stroke-dasharray="2 1"/>
      <path d="M60 80 C60 66, 86 66, 86 80"/>
      <path d="M57 85 C57 65, 89 65, 89 85"/>
      <!-- Cheekbones & Jawline -->
      <path d="M57 85 L62 98 L68 106 L73 108 L78 106 L84 98 L89 85" stroke-width="0.9" fill="#172554" fill-opacity="0.3"/>
      <!-- Inner facial structure (Nose, Brow, Eyes) -->
      <path d="M64 86 L68 85 L73 87 L78 85 L82 86"/>
      <path d="M73 87 L71 96 L75 96 Z"/> <!-- Nose -->
      <path d="M68 101 L73 100 L78 101 L76 103 L70 103 Z"/> <!-- Mouth -->
      <!-- Sagittal & Coronal Contours -->
      <path d="M73 68 V108"/>
      <path d="M68 70 C68 80, 68 90, 68 106"/>
      <path d="M78 70 C78 80, 78 90, 78 106"/>
      <!-- Connective Mesh Lines -->
      <path d="M60 80 L64 86 L62 98 Z" opacity="0.5"/>
      <path d="M86 80 L82 86 L84 98 Z" opacity="0.5"/>
      <path d="M68 85 L71 96 L68 101 M78 85 L75 96 L78 101"/>
    </g>
    
    <!-- Active Facial Tracking Nodes (74 points simulation) -->
    <g fill="#38bdf8">
      <circle cx="64" cy="86" r="1"/><circle cx="68" cy="85" r="1"/>
      <circle cx="73" cy="87" r="1.5" fill="#4ade80" class="avatar-blink"/> <!-- Root Node -->
      <circle cx="78" cy="85" r="1"/><circle cx="82" cy="86" r="1"/>
      <circle cx="71" cy="96" r="1"/><circle cx="75" cy="96" r="1"/>
      <circle cx="68" cy="101" r="1"/><circle cx="73" cy="100" r="1"/>
      <circle cx="78" cy="101" r="1"/><circle cx="76" cy="103" r="1"/><circle cx="70" cy="103" r="1"/>
      <circle cx="62" cy="98" r="1"/><circle cx="84" cy="98" r="1"/>
      <circle cx="68" cy="106" r="1"/><circle cx="78" cy="106" r="1"/>
      <circle cx="73" cy="108" r="1.5" fill="#f472b6"/> <!-- Chin Node -->
    </g>
    
    <!-- Biometric Overlay Data -->
    <path d="M86 80 L96 74" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M84 98 L96 104" stroke="#38bdf8" stroke-width="0.8"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2">
      <text x="98" y="75" fill="#38bdf8">EYE_L: 0.94</text>
      <text x="98" y="105" fill="#38bdf8">JAW_O: 0.12</text>
      <!-- Telemetry overlay left -->
      <text x="44" y="112" fill="#64748b">Z-DEPTH: 14.2cm</text>
      <text x="44" y="116" fill="#64748b">PITCH: -2.4°</text>
      <text x="44" y="120" fill="#64748b">YAW: +0.8°</text>
    </g>
    
    <!-- Moving Scanner Bar -->
    <rect x="42" y="90" width="62" height="1" fill="#4ade80" opacity="0.6" class="avatar-scan"/>

    <!-- Right: Advanced VRM Kinematics & Subsystems -->
    <g filter="url(#avatar-shadow)">
      <rect x="112" y="56" width="50" height="68" rx="4" fill="#06121f" stroke="#38bdf8" stroke-width="1.3"/>
      <rect x="114" y="58" width="46" height="64" rx="3" fill="#040a12"/>
    </g>
    
    <!-- Right HUD Header -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="118" y="66" fill="#bfdbfe" font-size="2.6">NEURAL BLENDSHAPES</text>
    </g>
    <path d="M118 69h38" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Blendshape Activity Bars -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#94a3b8">
      <!-- Row 1 -->
      <text x="118" y="76">A</text>
      <rect x="124" y="73" width="30" height="3" fill="#1e293b"/>
      <rect x="124" y="73" width="22" height="3" fill="#38bdf8" class="avatar-blink2"/>
      <!-- Row 2 -->
      <text x="118" y="81">I</text>
      <rect x="124" y="78" width="30" height="3" fill="#1e293b"/>
      <rect x="124" y="78" width="14" height="3" fill="#38bdf8"/>
      <!-- Row 3 -->
      <text x="118" y="86">U</text>
      <rect x="124" y="83" width="30" height="3" fill="#1e293b"/>
      <rect x="124" y="83" width="8" height="3" fill="#38bdf8"/>
      <!-- Row 4 -->
      <text x="118" y="91">E</text>
      <rect x="124" y="88" width="30" height="3" fill="#1e293b"/>
      <rect x="124" y="88" width="26" height="3" fill="#38bdf8"/>
      <!-- Row 5 -->
      <text x="118" y="96">O</text>
      <rect x="124" y="93" width="30" height="3" fill="#1e293b"/>
      <rect x="124" y="93" width="18" height="3" fill="#38bdf8"/>
    </g>
    
    <!-- Audio Spectrum Subsystem -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2">
      <text x="118" y="105" fill="#4ade80">MIC_IN</text>
      <text x="156" y="105" fill="#64748b" text-anchor="end">44.1kHz</text>
    </g>
    <!-- Detailed Audio Waveform -->
    <g stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M118 114v-2 M122 114v-5 M126 114v-8 M130 114v-4 M134 114v-10 M138 114v-3 M142 114v-7 M146 114v-2 M150 114v-6 M154 114v-3"/>
    </g>
    <!-- Waveform reflection -->
    <g stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3">
      <path d="M118 115v1 M122 115v2 M126 115v4 M130 115v2 M134 115v5 M138 115v1 M142 115v3 M146 115v1 M150 115v3 M154 115v1"/>
    </g>
    
    <!-- Latency / Processing Monitor -->
    <rect x="118" y="122" width="36" height="1" fill="#1e3a8a"/>
    <rect x="118" y="121" width="15" height="3" fill="#f472b6" class="avatar-blink"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2">
      <text x="156" y="124" fill="#f472b6" text-anchor="end">12ms</text>
    </g>

    <!-- Bottom Matrix Databank & Output Tabs -->
    <g filter="url(#avatar-shadow)">
      <rect x="38" y="127" width="124" height="18" rx="3" fill="#170b12" stroke="#f472b6" stroke-width="1.1"/>
    </g>
    
    <!-- Hex Dump Terminal -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#64748b">
      <text x="42" y="133">0x00A1: 4F 70 74 69 6D 61 6C 20</text>
      <text x="42" y="137">0x00B2: 42 69 6F 6D 65 74 72 79</text>
      <text x="42" y="141">0x00C3: 53 79 6E 63 20 4F 4B 21</text>
    </g>
    
    <path d="M96 128 V144" stroke="#f472b6" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Security & Status Badges -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <!-- Subsystem 1 -->
      <rect x="100" y="130" width="28" height="6" fill="#052e2b"/>
      <text x="102" y="135" fill="#4ade80" font-size="2.4">FACIAL: SECURE</text>
      <!-- Subsystem 2 -->
      <rect x="100" y="137" width="28" height="6" fill="#1e1b4b"/>
      <text x="102" y="142" fill="#818cf8" font-size="2.4">VOICE: ACTIVE</text>
      <!-- Core Status -->
      <rect x="131" y="130" width="28" height="13" fill="#f472b6" opacity="0.1"/>
      <rect x="131" y="130" width="28" height="13" fill="none" stroke="#f472b6" stroke-width="0.8"/>
      <circle cx="145" cy="134" r="1.5" fill="#f472b6" class="avatar-blink2"/>
      <text x="145" y="140" fill="#fbcfe8" font-size="2.6" text-anchor="middle">LIVE FEED</text>
    </g>
  <rect class="avatar-scan" x="40" y="50" width="120" height="1.4" fill="#f472b6"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#f472b6"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-AVATAR</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">AVATAR</text></g>
</svg>
