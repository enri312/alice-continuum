<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Estación de personalización del avatar VRM de Alice">
  <title>Avatar de Alice · estación de personalización VRM</title>
  <style>
    .av-led-a{animation:avLedA 3.8s ease-in-out infinite}.av-led-b{animation:avLedB 4.6s ease-in-out infinite}
    @keyframes avLedA{0%,100%{opacity:.95}50%{opacity:.38}}@keyframes avLedB{0%,100%{opacity:.35}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.av-led-a,.av-led-b{animation:none}}
  </style>
  <defs>
    <linearGradient id="av-chassis" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27364a"/><stop offset=".32" stop-color="#111c2b"/><stop offset=".72" stop-color="#07101a"/><stop offset="1" stop-color="#02050a"/></linearGradient>
    <linearGradient id="av-screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490" stop-opacity=".28"/><stop offset=".45" stop-color="#0b1725" stop-opacity=".9"/><stop offset="1" stop-color="#6d28d9" stop-opacity=".18"/></linearGradient>
    <linearGradient id="av-cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="av-violet" x1="0" x2="1"><stop stop-color="#818cf8"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
    <linearGradient id="av-hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#dbeafe"/><stop offset=".76" stop-color="#94a3b8"/><stop offset="1" stop-color="#536274"/></linearGradient>
    <linearGradient id="av-coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset=".25" stop-color="#273448"/><stop offset=".64" stop-color="#101722"/><stop offset="1" stop-color="#030509"/></linearGradient>
    <linearGradient id="av-fabric" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff6ff"/><stop offset=".55" stop-color="#a8b7c8"/><stop offset="1" stop-color="#64748b"/></linearGradient>
    <linearGradient id="av-deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#060b12"/></linearGradient>
    <radialGradient id="av-halo"><stop stop-color="#bae6fd" stop-opacity=".75"/><stop offset=".3" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <pattern id="av-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0v10" fill="none" stroke="#38bdf8" stroke-width=".35" opacity=".18"/></pattern>
    <filter id="av-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".86"/></filter>
    <filter id="av-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Consola de loadout: todo permanece fijo -->
  <path d="M15 31 38 10h124l23 21v126l-24 28H39l-24-22Z" fill="#02050a" stroke="#020617" stroke-width="3"/>
  <path d="M21 35 42 17h116l20 18v119l-21 24H43l-22-19Z" fill="url(#av-chassis)" stroke="#64748b" stroke-width="1.5"/>
  <path d="M29 43h142v108l-18 18H47l-18-16Z" fill="url(#av-screen)" stroke="#38bdf8" stroke-width=".9"/>
  <path d="M29 43h142v108l-18 18H47l-18-16Z" fill="url(#av-grid)"/>
  <path d="M29 43h142v18H29Z" fill="#07111c" stroke="#475569"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="38" y="54" fill="#7dd3fc" font-size="6.2" letter-spacing="1">ALICE · AVATAR LOADOUT</text><text x="164" y="54" fill="#c4b5fd" font-size="5" text-anchor="end">VRM 1.0</text></g>

  <!-- Tres compartimentos de personalización -->
  <g filter="url(#av-shadow)">
    <path d="M35 69 52 62h28l10 9v61l-12 10H49l-14-10Z" fill="#07121e" stroke="#22d3ee"/>
    <path d="M92 68 101 62h39l10 9v61l-10 10h-39l-9-10Z" fill="#0d1020" stroke="#818cf8"/>
    <path d="M152 71 160 65h12v65l-8 9h-12Z" fill="#0b1420" stroke="#38bdf8"/>
  </g>

  <!-- Módulo 1: cabello de Alice como activo, sin cara -->
  <g transform="translate(62 99)">
    <ellipse cy="32" rx="21" ry="7" fill="url(#av-halo)"/>
    <path d="M-18-12c1-25 10-38 20-38 12 0 22 14 21 38l-2 35-10 9-2-40H-8l-2 40-10-9Z" fill="url(#av-hair)" stroke="#e0f2fe" stroke-width="1.2"/>
    <path d="M-13-13c3-20 9-29 16-29 8 0 15 10 17 29-8-4-14-11-17-20-3 9-8 15-16 20Z" fill="#f8fafc" opacity=".85"/>
    <path d="M1-50c-5-11 7-15 9-6-7-4-7 3-4 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-12-28v25M-6-39v30M2-44v31M10-39v30M17-27v24" stroke="#8393a5" stroke-width=".8" opacity=".65"/>
    <path d="M-5 8h13" stroke="#38bdf8" stroke-width="2" filter="url(#av-glow)"/>
  </g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="76" fill="#7dd3fc" font-size="4.5">HAIR ASSET</text><text x="42" y="137" fill="#4ade80" font-size="4.3">BOUND</text></g>

  <!-- Módulo 2: vestuario real de Alice sin figura humana -->
  <g transform="translate(121 101)">
    <ellipse cy="32" rx="25" ry="7" fill="url(#av-halo)"/>
    <!-- chaqueta abierta -->
    <path d="M-12-32c-16 2-24 11-26 27l8 31 11-4-4-26 9-12 8 14 6-30Z" fill="url(#av-coat)" stroke="#64748b" stroke-width="1.2"/>
    <path d="M12-32c16 2 24 11 26 27l-8 31-11-4 4-26-9-12-8 14-6-30Z" fill="url(#av-coat)" stroke="#64748b" stroke-width="1.2"/>
    <path d="M-31-16h12m-14 9h12m-11 9h10M31-16H19m14 9H21m11 9H22" stroke="#94a3b8" stroke-width="1" opacity=".58"/>
    <!-- vestido, corbata y arnés suspendidos -->
    <path d="M-11-29-17 27H17L11-29Z" fill="url(#av-fabric)" stroke="#dbeafe"/>
    <path d="M-2-30h4l4 9-6 7-6-7Z" fill="#030509" stroke="#94a3b8"/><path d="M0-14v38" stroke="#030509" stroke-width="2.5"/>
    <path d="M-16-16 14 1M-13 16 17 2" stroke="#070a0f" stroke-width="3"/><rect x="-16" y="20" width="32" height="6" rx="2" fill="#070a0f" stroke="#64748b"/><rect x="-3" y="19" width="7" height="8" rx="1" fill="#334155" stroke="#cbd5e1"/>
    <!-- botas como conjunto -->
    <path d="m-14 28-3 9 4 5h11l2-11-7-3Zm28 0 3 9-4 5H2L0 31l7-3Z" fill="url(#av-coat)" stroke="#94a3b8"/>
  </g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="76" fill="#c4b5fd" font-size="4.5">TECHWEAR SET</text><text x="100" y="137" fill="#4ade80" font-size="4.3">6 PARTS</text></g>

  <!-- Módulo 3: canales del rig -->
  <g transform="translate(162 96)" fill="none" stroke="url(#av-cyan)"><circle cy="-17" r="4"/><path d="M0-13v22m0-13-7 8m7-8 7 8M0 9l-6 13m6-13 6 13"/></g>
  <g fill="#fff" stroke="#38bdf8"><circle cx="162" cy="83" r="1.4"/><circle cx="162" cy="105" r="1.4"/><circle cx="155" cy="100" r="1.4"/><circle cx="169" cy="100" r="1.4"/><circle cx="156" cy="118" r="1.4"/><circle cx="168" cy="118" r="1.4"/></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="162" y="130" fill="#7dd3fc" font-size="4" text-anchor="middle">RIG</text><text x="162" y="136" fill="#4ade80" font-size="4" text-anchor="middle">OK</text></g>

  <!-- Biblioteca motora y control humano -->
  <path d="M40 145h119l10 10-14 18H47l-16-17Z" fill="url(#av-deck)" stroke="#64748b"/>
  <path d="M47 150h103l9 7-8 10H49l-9-10Z" fill="#06101a" stroke="url(#av-violet)" stroke-width=".8"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="51" y="158" fill="#94a3b8" font-size="4.6">MOTOR CLIPS</text><text x="92" y="158" fill="#fff" font-size="5">12</text><text x="51" y="165" fill="#7dd3fc" font-size="4">IDLE · WALK · SIT · JUMP</text></g>
  <g transform="translate(124 157)" fill="#172536" stroke="#93c5fd"><path d="M0 0c2-5 7-6 11-3l3 3h12l3-3c4-3 9-2 11 3l-4 5-6-2H10L4 5Z"/><path d="M8-1v4M6 1h4" stroke="#fff"/><circle cx="31" cy="0" r="1.3" fill="#a78bfa"/><circle cx="34" cy="3" r="1.3" fill="#38bdf8"/></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="44" y="181" fill="#7dd3fc" font-size="4.8">ALICE.VRM</text><text x="157" y="181" fill="#c4b5fd" font-size="4.8" text-anchor="end">LOCAL · PRIVATE</text></g>

  <!-- Movimiento limitado a intensidad de LEDs -->
  <g class="av-led-a" fill="#22d3ee" filter="url(#av-glow)"><circle cx="30" cy="31" r="2"/><circle cx="170" cy="31" r="2"/><rect x="36" y="63" width="2" height="26" rx="1"/></g>
  <g class="av-led-b" fill="#a78bfa" filter="url(#av-glow)"><circle cx="31" cy="165" r="2"/><circle cx="169" cy="162" r="2"/><rect x="148" y="72" width="2" height="25" rx="1"/></g>
  <g fill="url(#av-chassis)" stroke="#94a3b8"><circle cx="30" cy="31" r="4"/><circle cx="170" cy="31" r="4"/><circle cx="31" cy="165" r="4"/><circle cx="169" cy="162" r="4"/></g><g fill="#22d3ee"><circle cx="30" cy="31" r="1.4"/><circle cx="170" cy="31" r="1.4"/></g><g fill="#a78bfa"><circle cx="31" cy="165" r="1.4"/><circle cx="169" cy="162" r="1.4"/></g>
</svg>
