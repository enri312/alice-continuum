  <g transform="translate(100 87)" filter="url(#activity-shadow)">
      <path d="M-61-48H49l12 12v80H-61z" fill="#06160f" stroke="#84cc16" stroke-width="2"/>
      <path d="M49-48v12h12" fill="#16351f" stroke="#84cc16"/><path d="M-52-34h91" stroke="#285139"/>
      <g fill="#0b2418" stroke="#285139"><rect x="-52" y="-25" width="104" height="16" rx="2"/><rect x="-52" y="-3" width="104" height="16" rx="2"/><rect x="-52" y="19" width="104" height="16" rx="2"/></g>
      <g fill="#22d3ee"><circle cx="-43" cy="-17" r="3"/><circle cx="-43" cy="5" r="3"/><circle cx="-43" cy="27" r="3"/></g>
      <path d="M-34-17h13l6-7 9 14 9-22 11 25 8-10h21M-34 5h18l7-5 8 9 11-15 10 11h23M-34 27h12l8-8 10 13 8-9 9 4h30" fill="none" stroke="#84cc16" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#activity-glow)"/>
      <g fill="#d9f99d" font-family="Consolas,monospace" font-size="5" font-weight="900"><text x="-49" y="-37">LIVE EVENT WINDOW</text><text x="30" y="-37">R3</text></g>
      <circle cx="46" cy="-38" r="5" fill="none" stroke="#22d3ee"/><path d="M46-38v-3m0 3 3 2" stroke="#22d3ee" stroke-linecap="round"/>
    </g><g transform="translate(54 143)"><path d="M0 8h92" stroke="#173d28" stroke-width="8"/><path d="M0 8h64" stroke="#84cc16" stroke-width="5"/><circle cx="64" cy="8" r="7" fill="#ecfccb" stroke="#84cc16"/><path d="m75 8 5-5 5 5 7-7" fill="none" stroke="#22d3ee" stroke-width="2"/></g>
  <g font-family="Consolas,monospace" font-size="5" font-weight="900"><g transform="translate(36 128)"><rect width="128" height="25" rx="3" fill="#07110b" stroke="#84cc16"/><path d="M5 8h118M5 16h118" stroke="#1f3b24"/><g fill="#22d3ee"><circle cx="14" cy="8" r="2"/><circle cx="43" cy="16" r="2"/><circle cx="76" cy="8" r="2"/><circle cx="111" cy="16" r="2"/></g><path d="M14 8 43 16 76 8l35 8" fill="none" stroke="#84cc16"/><text x="8" y="23" fill="#94a3b8">SEQ</text><text x="47" y="23" fill="#94a3b8">MODULE</text><text x="94" y="23" fill="#94a3b8">PAYLOAD</text></g><text x="100" y="160" fill="#84cc16" text-anchor="middle">TIMELINE · EVENT STREAM · R3</text></g>
  <g class="activity-scan" stroke="#22d3ee" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#84cc16" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#84cc16"/><circle cx="58" cy="2.5" r="1.5" fill="#22d3ee"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
