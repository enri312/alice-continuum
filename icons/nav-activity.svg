<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Actividad" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <title>Actividad</title>
  <style>
    .activity-dash{animation:activityDash 2.8s linear infinite}.activity-blink{animation:activityBlink 1.6s steps(2,end) infinite}.activity-blink2{animation:activityBlink 2.3s steps(2,end) .5s infinite}.activity-scan{animation:activityScan 4.2s ease-in-out infinite}.activity-spin{transform-box:fill-box;transform-origin:50% 50%;animation:activitySpin 16s linear infinite}
    @keyframes activityDash{to{stroke-dashoffset:-26}}@keyframes activityBlink{50%{opacity:.25}}
    @keyframes activityScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes activitySpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.activity-dash,.activity-blink,.activity-blink2,.activity-scan,.activity-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="activity-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="activity-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84cc16"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="activity-gb" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#84cc16"/></linearGradient>
    <linearGradient id="activity-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="activity-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="activity-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#84cc16"/><stop offset=".7" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="activity-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="activity-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#activity-plate)" stroke="url(#activity-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="activity-blink" cx="100" cy="42" r="2.2" fill="#38bdf8" filter="url(#activity-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#84cc16" font-size="4">[02] LIVE EVENT WINDOW // TASK MONITOR</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">TIMELINE · EVENT STREAM · R3</text>
    </g>

    <!-- Left: Execution Process Timeline (DAG/Log) -->
    <g filter="url(#activity-shadow)">
      <rect x="38" y="56" width="70" height="68" rx="4" fill="#06160f" stroke="#84cc16" stroke-width="1.3"/>
      <rect x="40" y="58" width="66" height="64" rx="3" fill="url(#activity-screen-bg)"/>
    </g>
    
    <!-- Timeline Event Nodes & Paths -->
    <g stroke-width="1.2" fill="none">
      <path d="M48 68v14" stroke="#4ade80" opacity=".6"/>
      <path class="activity-dash" d="M48 82v14" stroke="#84cc16" stroke-dasharray="3 3"/>
      <path d="M48 96v14" stroke="#475569" stroke-dasharray="2 2"/>
    </g>
    
    <!-- Step 1: Completed -->
    <circle cx="48" cy="68" r="3" fill="#022c22" stroke="#4ade80" stroke-width="1.2"/>
    <path d="M46.5 68l1.5 1.5 2.5-3" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="55" y="65" width="45" height="6" rx="1.5" fill="#022c22" stroke="#065f46" stroke-width=".6"/>
    <text x="58" y="69.5" fill="#a7f3d0" font-family="Consolas,monospace" font-weight="900" font-size="2.6">PERCEPTION_SYNC</text>

    <!-- Step 2: Running (Active) -->
    <circle cx="48" cy="82" r="3.5" fill="#131108" stroke="#84cc16" stroke-width="1.5"/>
    <circle cx="48" cy="82" r="1.5" fill="#84cc16" class="activity-blink"/>
    <g filter="url(#activity-glow)">
      <rect x="55" y="78" width="45" height="8" rx="1.5" fill="#152011" stroke="#84cc16" stroke-width="1"/>
    </g>
    <text x="58" y="83.5" fill="#d9f99d" font-family="Consolas,monospace" font-weight="900" font-size="2.8">INFERENCE_CORE</text>
    <rect x="58" y="86" width="39" height="1.5" rx=".5" fill="#365314"/>
    <rect class="activity-scan" x="58" y="86" width="24" height="1.5" rx=".5" fill="#84cc16"/>

    <!-- Step 3: Pending -->
    <circle cx="48" cy="96" r="3" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <rect x="55" y="93" width="45" height="6" rx="1.5" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
    <text x="58" y="97.5" fill="#94a3b8" font-family="Consolas,monospace" font-weight="900" font-size="2.6">MOTOR_ACTUATION</text>

    <!-- Step 4: Pending -->
    <circle cx="48" cy="110" r="3" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <rect x="55" y="107" width="45" height="6" rx="1.5" fill="#0b1320" stroke="#334155" stroke-width=".6"/>
    <text x="58" y="111.5" fill="#64748b" font-family="Consolas,monospace" font-weight="900" font-size="2.6">MEMORY_COMMIT</text>

    <!-- Right: Detailed Telemetry Metrics -->
    <g filter="url(#activity-shadow)">
      <rect x="112" y="56" width="50" height="68" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
      <rect x="114" y="58" width="46" height="64" rx="3" fill="#020617"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="118" y="64" fill="#93c5fd" font-size="2.8">METRICS LOG</text>
      
      <!-- Metric: Token Rate -->
      <text x="118" y="74" fill="#cbd5e1" font-size="2.6">TOKENS/S</text>
      <text x="156" y="74" fill="#38bdf8" font-size="2.6" text-anchor="end">NO SAMPLE</text>
      <rect x="118" y="76" width="38" height="2" rx="1" fill="#0f172a"/>
      <rect x="118" y="76" width="32" height="2" rx="1" fill="#38bdf8"/>
      
      <!-- Metric: CPU Load -->
      <text x="118" y="85" fill="#cbd5e1" font-size="2.6">CORE LOAD</text>
      <text x="156" y="85" fill="#38bdf8" font-size="2.6" text-anchor="end">—</text>
      <rect x="118" y="87" width="38" height="2" rx="1" fill="#0f172a"/>
      <rect x="118" y="87" width="28" height="2" rx="1" fill="#38bdf8"/>

      <!-- Metric: RAM Alloc -->
      <text x="118" y="96" fill="#cbd5e1" font-size="2.6">RAM ALLOC</text>
      <text x="156" y="96" fill="#fde68a" font-size="2.6" text-anchor="end">—</text>
      <rect x="118" y="98" width="38" height="2" rx="1" fill="#0f172a"/>
      <rect x="118" y="98" width="18" height="2" rx="1" fill="#fde68a"/>
    </g>
    
    <!-- Mini Live Waveform / Heartbeat -->
    <path class="activity-dash" d="M118 112h6l2-4 3 8 2-6 3 5 2-3h6" fill="none" stroke="#84cc16" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="145" cy="112" r="1.5" fill="#84cc16" class="activity-blink"/>
    <text x="156" y="114" fill="#84cc16" font-size="2.8" font-family="Consolas,monospace" font-weight="900" text-anchor="end">OK</text>

    <!-- Bottom Status Footer -->
    <g filter="url(#activity-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#051f1b" stroke="#84cc16" stroke-width="1.1"/>
    </g>
    <!-- Live Running Spinner/Icon -->
    <circle cx="48" cy="134.5" r="4.5" fill="#022c22" stroke="#84cc16" stroke-width="1" stroke-dasharray="4 2" class="activity-dash"/>
    <circle cx="48" cy="134.5" r="1.5" fill="#84cc16"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#d9f99d" font-size="3.5">WINDOW: LAST 5 MIN · EVIDENCE ONLY</text>
      <text x="157" y="136" fill="#38bdf8" font-size="3.2" text-anchor="end">R3 JSONL</text>
      <text x="42" y="148" fill="#64748b" font-size="3">NO EVENT · NO ACTIVITY CLAIM</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">WAITING FOR AUDIT</text>
    </g>
  <g aria-label="Ventana temporal R3" fill="none" stroke="#84cc16" stroke-width=".65"><path d="M42 153h18l5-3 6 5 8-7 7 5 9-2 8 4 8-6 9 4h38"/><path d="M42 156h116" opacity=".25"/></g>
  <g fill="#38bdf8"><circle cx="65" cy="150" r="1.3"/><circle cx="86" cy="153" r="1.3"/><circle cx="120" cy="149" r="1.3"/></g>
  <rect class="activity-scan" x="40" y="50" width="120" height="1.4" fill="#84cc16"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#84cc16"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-ACTIVITY</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">R3 LIVE</text></g>
</svg>
