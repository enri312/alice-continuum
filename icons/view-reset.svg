<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Restablecer vista">
  <title>Restablecer vista</title>
  <style>
    .reset-orbit{animation:resetOrbit 4s linear infinite}.reset-pulse{animation:resetPulse 1.8s ease-in-out infinite}.reset-scan{animation:resetScan 3s ease-in-out infinite}
    @keyframes resetOrbit{to{stroke-dashoffset:-42}}@keyframes resetPulse{50%{opacity:.3}}@keyframes resetScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.reset-orbit,.reset-pulse,.reset-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="reset-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="reset-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="reset-accent" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="reset-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#a78bfa"/><stop offset=".68" stop-color="#f472b6"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="reset-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#a78bfa" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="reset-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="reset-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="reset-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#reset-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#reset-grid)" stroke="#a78bfa" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#reset-beam)"/>
  <circle class="reset-orbit" cx="100" cy="100" r="71" fill="none" stroke="#a78bfa" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="reset-orbit" cx="100" cy="100" r="62" fill="none" stroke="#f472b6" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".65"/>
  <g fill="url(#reset-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#a78bfa" filter="url(#reset-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#f472b6"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#a78bfa" font-size="7" text-anchor="middle" letter-spacing="1.5">RESET · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#a78bfa" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#a78bfa"/><circle class="reset-pulse" cx="19" cy="27" r="2" fill="#f472b6" stroke="none"/></g>
