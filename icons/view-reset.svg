<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Restablecer vista">
  <title>Restablecer vista</title>
  <style>
    .reset-dash{animation:resetDash 2.8s linear infinite}.reset-blink{animation:resetBlink 1.6s steps(2,end) infinite}.reset-blink2{animation:resetBlink 2.3s steps(2,end) .5s infinite}.reset-scan{animation:resetScan 4.2s ease-in-out infinite}.reset-spin{transform-box:fill-box;transform-origin:50% 50%;animation:resetSpin 16s linear infinite}
    @keyframes resetDash{to{stroke-dashoffset:-26}}@keyframes resetBlink{50%{opacity:.25}}
    @keyframes resetScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes resetSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.reset-dash,.reset-blink,.reset-blink2,.reset-scan,.reset-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="reset-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="reset-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="reset-gb" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="reset-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="reset-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="reset-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#a78bfa"/><stop offset=".7" stop-color="#f472b6"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="reset-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="reset-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#reset-plate)" stroke="url(#reset-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="reset-blink" cx="100" cy="42" r="2.2" fill="#f472b6" filter="url(#reset-glow)"/>
  <!-- Return Arc Path & Recalibration Home Glyph -->
    <path class="reset-dash" d="M136 74a43 43 0 1 0 8 42" fill="none" stroke="#a78bfa" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="19 8" filter="url(#reset-glow)"/>
    <path d="m134 56 6 29-29-6z" fill="#a78bfa"/>
    <!-- Home Fortress Icon -->
    <path d="M85 99l15-13 15 13v15H85z" fill="#f472b6"/><rect x="95.5" y="103.5" width="9" height="10.5" fill="#0b1420"/>
    <circle class="reset-blink" cx="100" cy="68" r="3.2" fill="#e0f2fe"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="154" fill="#64748b" font-size="3.5" text-anchor="middle">POS 0 · ROT 0</text></g>
  <rect class="reset-scan" x="40" y="50" width="120" height="1.4" fill="#a78bfa"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#a78bfa"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-RESET</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">HOME</text></g>
</svg>
