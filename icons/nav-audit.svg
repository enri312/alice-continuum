<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Auditoría y diagnóstico">
  <title>Auditoría y diagnóstico</title>
  <style>
    .audit-dash{animation:auditDash 2.8s linear infinite}.audit-blink{animation:auditBlink 1.6s steps(2,end) infinite}.audit-blink2{animation:auditBlink 2.3s steps(2,end) .5s infinite}.audit-scan{animation:auditScan 4.2s ease-in-out infinite}.audit-spin{transform-box:fill-box;transform-origin:50% 50%;animation:auditSpin 16s linear infinite}
    @keyframes auditDash{to{stroke-dashoffset:-26}}@keyframes auditBlink{50%{opacity:.25}}
    @keyframes auditScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes auditSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.audit-dash,.audit-blink,.audit-blink2,.audit-scan,.audit-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="audit-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="audit-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="audit-gb" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="audit-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="audit-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="audit-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#fb7185"/><stop offset=".7" stop-color="#60a5fa"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="audit-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="audit-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#audit-plate)" stroke="url(#audit-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="audit-blink" cx="100" cy="42" r="2.2" fill="#60a5fa" filter="url(#audit-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#fb7185" font-size="4">[07] AUDITORÍA Y DIAGNÓSTICO // FORENSIC</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">VERIFY · TRACE · DIAGNOSE</text>
    </g>

    <!-- Left: Integrity Log (Event Ledger) -->
    <g filter="url(#audit-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#1c0b11" stroke="#fb7185" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#audit-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#fda4af" font-size="2.9">EVENT_LEDGER</text>
      <text x="92" y="66" fill="#4ade80" font-size="2.9" text-anchor="end">SECURE</text>
    </g>

    <!-- Table Header -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#94a3b8">
      <text x="44" y="74">ID</text>
      <text x="60" y="74">OP_HASH</text>
      <text x="92" y="74" text-anchor="end">STAT</text>
    </g>

    <!-- Row 1 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <text x="44" y="82" fill="#64748b">01</text>
      <text x="60" y="82" fill="#cbd5e1">0x8F..A1</text>
      <text x="92" y="82" fill="#4ade80" text-anchor="end">OK</text>
    </g>
    <!-- Row 2 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <text x="44" y="90" fill="#64748b">02</text>
      <text x="60" y="90" fill="#cbd5e1">0x4C..9B</text>
      <text x="92" y="90" fill="#4ade80" text-anchor="end">OK</text>
    </g>
    <!-- Row 3 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <text x="44" y="98" fill="#64748b">03</text>
      <text x="60" y="98" fill="#cbd5e1">0x2D..E4</text>
      <text x="92" y="98" fill="#4ade80" text-anchor="end">OK</text>
    </g>
    <!-- Row 4 (Scanning/Checking) -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <rect x="42" y="100" width="52" height="8" fill="#fb7185" opacity="0.15"/>
      <text x="44" y="106" fill="#fb7185">04</text>
      <text x="60" y="106" fill="#fecdd3">0x91..F2</text>
      <text x="92" y="106" fill="#fb7185" text-anchor="end" class="audit-blink">CHK</text>
    </g>
    <!-- Integrity Block -->
    <g font-family="Consolas,monospace" font-weight="900">
      <rect x="44" y="114" width="48" height="6" fill="#1c0b11" stroke="#fb7185" stroke-width="0.8"/>
      <text x="68" y="118.5" fill="#fecdd3" font-size="2.2" text-anchor="middle">SHA-256 OK</text>
    </g>

    <!-- Right: Forensic Trace & Diagnostic -->
    <g filter="url(#audit-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#081c2f" stroke="#60a5fa" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#040e18"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#bfdbfe" font-size="2.9">DIAGNOSTIC_TRACE</text>
    </g>

    <!-- Radar / Shield Abstract -->
    <g stroke-width="1" fill="none">
       <!-- Concentric forensic analysis rings -->
       <circle cx="132" cy="85" r="14" stroke="#1e3a8a" stroke-dasharray="4 2"/>
       <circle cx="132" cy="85" r="9" stroke="#60a5fa" class="audit-dash"/>
       <!-- Target cross -->
       <path d="M132 67v36M114 85h36" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
       <!-- Pulse/Blink -->
       <circle cx="132" cy="85" r="3" fill="#60a5fa" class="audit-blink"/>
       <!-- Sector Highlights -->
       <path d="M132 85L142 75A14 14 0 0 1 145 85Z" fill="#60a5fa" opacity="0.3"/>
       <path d="M132 85L122 95A14 14 0 0 1 119 85Z" fill="#3b82f6" opacity="0.2"/>
    </g>

    <!-- System Vital Stats under the radar -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="108" y="111" fill="#94a3b8">MEM_LEAK</text>
      <text x="156" y="111" fill="#4ade80" text-anchor="end">NONE</text>
      <text x="108" y="119" fill="#94a3b8">ERR_RATE</text>
      <text x="156" y="119" fill="#4ade80" text-anchor="end">0.0%</text>
      <rect x="108" y="113" width="48" height="1" fill="#1e3a8a"/>
    </g>

    <!-- Bottom Audit Assurance Banner -->
    <g filter="url(#audit-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#170b12" stroke="#fb7185" stroke-width="1.1"/>
    </g>
    <!-- Checkmark Badge -->
    <circle cx="48" cy="134.5" r="4.5" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
    <path d="M46 134.5l1.5 1.5 3-3.5" fill="none" stroke="#fda4af" stroke-width="1.2"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#fecdd3" font-size="3.5">AUDIT: VERIFY ON READ</text>
      <text x="157" y="136" fill="#fb7185" font-size="3.2" text-anchor="end">DIGEST ONLY</text>
      <text x="42" y="148" fill="#64748b" font-size="3">DIAGNOSTIC SNAPSHOT</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">NO LIVE CLAIM</text>
    </g>
  <g aria-label="Cadena de evidencia" font-family="Consolas,monospace" font-weight="900">
    <path d="M42 153h18l4-4h16l4 4h16l4-4h16l4 4h34" fill="none" stroke="#fb7185" stroke-width=".7"/>
    <g fill="#4ade80" stroke="#052e2b" stroke-width=".5"><rect x="61" y="147" width="5" height="5" rx="1"/><rect x="81" y="151" width="5" height="5" rx="1"/><rect x="101" y="147" width="5" height="5" rx="1"/><rect x="121" y="151" width="5" height="5" rx="1"/></g>
    <text x="158" y="158" fill="#94a3b8" font-size="2.2" text-anchor="end">HASH CHAIN · RECEIPT · RESTORE</text>
  </g>
  <rect class="audit-scan" x="40" y="50" width="120" height="1.4" fill="#fb7185"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#fb7185"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-AUDIT</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">FORENSIC</text></g>
</svg>
