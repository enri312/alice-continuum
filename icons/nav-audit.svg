<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Auditoría y diagnóstico">
  <title>Auditoría y diagnóstico</title>
  <style>
    .audit-dash{animation:auditDash 2.8s linear infinite}.audit-blink{animation:auditBlink 1.6s steps(2,end) infinite}.audit-blink2{animation:auditBlink 2.3s steps(2,end) .5s infinite}.audit-scan{animation:auditScan 4.2s ease-in-out infinite}.audit-spin{transform-box:fill-box;transform-origin:50% 50%;animation:auditSpin 16s linear infinite}
    @keyframes auditDash{to{stroke-dashoffset:-26}}@keyframes auditBlink{50%{opacity:.25}}
    @keyframes auditScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes auditSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.audit-dash,.audit-blink,.audit-blink2,.audit-scan,.audit-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="audit-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="audit-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="audit-gb" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="audit-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="audit-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#fb7185"/><stop offset=".7" stop-color="#60a5fa"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="audit-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="audit-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#audit-plate)" stroke="url(#audit-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#fb7185" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="audit-blink" cx="100" cy="42" r="2.2" fill="#60a5fa" filter="url(#audit-glow)"/>
  <circle cx="100" cy="90" r="38" fill="none" stroke="#60a5fa" stroke-width=".9" stroke-dasharray="4 5" class="audit-dash" opacity=".55"/>
    <g stroke="#475569" stroke-width=".8"><path d="M100 48v5M142 90h-5M100 132v-5M58 90h5"/></g>
    <g filter="url(#audit-shadow)"><path d="M100 56l28 9v20c0 19-12 30-28 37-16-7-28-18-28-37V65Z" fill="#170b12" stroke="#fb7185" stroke-width="2.4" stroke-linejoin="round"/></g>
    <path d="m88 88 8 8 16-18" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#audit-glow)"/>
    <rect class="audit-scan" x="74" y="60" width="52" height="1.2" fill="#fb7185" opacity=".5"/>
    <g fill="#475569"><rect x="80" y="116" width="6" height="2"/><rect x="88" y="116" width="4" height="2"/><rect x="94" y="116" width="7" height="2"/><rect x="103" y="116" width="4" height="2"/><rect x="109" y="116" width="6" height="2"/></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4">
      <text x="40" y="70" fill="#94a3b8">INTEGRITY</text><circle cx="66" cy="68" r="2" fill="#4ade80" class="audit-blink"/>
      <text x="40" y="82" fill="#94a3b8">DIAGNOSTIC</text><circle cx="66" cy="80" r="2" fill="#60a5fa"/>
      <text x="40" y="94" fill="#94a3b8">EFFECTS</text><circle cx="66" cy="92" r="2" fill="#64748b"/>
    </g>
    <g><circle cx="136" cy="68" r="2.2" fill="#4ade80"/><path d="M140 68h18" stroke="#2d3b4b" stroke-width="1.6"/>
      <circle cx="136" cy="80" r="2.2" fill="#38bdf8" class="audit-blink"/><path d="M140 80h18" stroke="#2d3b4b" stroke-width="1.6"/>
      <circle cx="136" cy="92" r="2.2" fill="#fbbf24"/><path d="M140 92h18" stroke="#2d3b4b" stroke-width="1.6"/>
      <circle cx="136" cy="104" r="2.2" fill="#f87171"/><path d="M140 104h18" stroke="#2d3b4b" stroke-width="1.6"/></g>
    <path d="M132 68v36m0 0h-2m2 0h2" stroke="#64748b" stroke-width=".8" fill="none"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2" fill="#64748b"><text x="136" y="114">OP-ID LINK</text><text x="136" y="119">×4 OP</text></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4">
      <rect x="40" y="124" width="38" height="9" rx="2" fill="#07111e" stroke="#4ade80" stroke-width=".7"/><text x="59" y="130.5" fill="#a7f3d0" text-anchor="middle">HEALTHY</text>
      <rect x="81" y="124" width="38" height="9" rx="2" fill="#07111e" stroke="#60a5fa" stroke-width=".7"/><text x="100" y="130.5" fill="#bfdbfe" text-anchor="middle">PASSIVE</text>
      <rect x="122" y="124" width="38" height="9" rx="2" fill="#07111e" stroke="#fb7185" stroke-width=".7"/><text x="141" y="130.5" fill="#fda4af" text-anchor="middle">5 MiB · 1 ROT</text>
    </g>
    <g font-family="Consolas,monospace" font-weight="900"><path d="m40 139 3 3 6-7" fill="none" stroke="#4ade80" stroke-width="1.8"/><text x="52" y="142" fill="#bfdbfe" font-size="3.8">SHA-256 OK</text><text x="160" y="142" fill="#64748b" font-size="3.2" text-anchor="end">8A4F…91C2</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="149" fill="#475569" font-size="3">228 EV</text><text x="100" y="149" fill="#fb7185" font-size="3.8" text-anchor="middle">VERIFY · TRACE · DIAGNOSE</text></g>
  <rect class="audit-scan" x="40" y="50" width="120" height="1.4" fill="#fb7185"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#fb7185"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-AUDIT</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">FORENSIC</text></g>
</svg>
