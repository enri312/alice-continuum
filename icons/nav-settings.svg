    <g font-family="Consolas,monospace" font-weight="900"><rect x="40" y="121" width="52" height="14" rx="2.4" fill="#111318" stroke="#cbd5e1" stroke-width=".9"/><path d="M48 127v-2a2.4 2.4 0 0 1 4.8 0v2" fill="none" stroke="#e2e8f0" stroke-width=".9"/><rect x="46.6" y="127" width="7.6" height="5.5" rx="1.2" fill="#1f2937" stroke="#e2e8f0" stroke-width=".7"/><text x="58" y="130.5" fill="#e2e8f0" font-size="3.8">KEYS HIDDEN</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><rect x="100" y="122" width="60" height="12" rx="2" fill="#111318" stroke="#64748b" stroke-width=".9"/><text x="130" y="130" fill="#94a3b8" font-size="3.8" text-anchor="middle">GOVERNANCE</text></g>
