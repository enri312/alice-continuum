      <path d="M124 77h34" stroke="#334155" stroke-width="2.4"/><circle cx="152" cy="77" r="3.4" fill="#4ade80"/>
      <path d="M124 95h34" stroke="#334155" stroke-width="2.4"/><circle cx="128" cy="95" r="3.4" fill="#ef4444"/></g>
