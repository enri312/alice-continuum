<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Configuración">
  <title>Configuración</title>
  <style>
    .settings-orbit{animation:settingsOrbit 4s linear infinite}.settings-pulse{animation:settingsPulse 1.8s ease-in-out infinite}.settings-scan{animation:settingsScan 3s ease-in-out infinite}
    @keyframes settingsOrbit{to{stroke-dashoffset:-42}}@keyframes settingsPulse{50%{opacity:.3}}@keyframes settingsScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.settings-orbit,.settings-pulse,.settings-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="settings-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="settings-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="settings-accent" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <radialGradient id="settings-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#f59e0b"/><stop offset=".68" stop-color="#38bdf8"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="settings-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#f59e0b" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="settings-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="settings-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="settings-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f59e0b" stop-opacity=".28"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#settings-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#settings-grid)" stroke="#f59e0b" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#settings-beam)"/>
  <circle class="settings-orbit" cx="100" cy="100" r="71" fill="none" stroke="#f59e0b" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="settings-orbit" cx="100" cy="100" r="62" fill="none" stroke="#38bdf8" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#f59e0b" stroke-width="1" opacity=".65"/>
  <g fill="url(#settings-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#f59e0b" filter="url(#settings-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#38bdf8"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#f59e0b" font-size="7" text-anchor="middle" letter-spacing="1.5">SETTINGS · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#f59e0b" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#f59e0b"/><circle class="settings-pulse" cx="19" cy="27" r="2" fill="#38bdf8" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#38bdf8" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#38bdf8"/><circle class="settings-pulse" cx="8" cy="27" r="2" fill="#f59e0b" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#settings-shadow)">
      <circle r="49" fill="#111827" stroke="#64748b"/><circle r="37" fill="none" stroke="#f59e0b" stroke-width="7" stroke-dasharray="10 8"/>
      <path d="m0-56 7 12h-14zm56 56-12 7V-7zM0 56l-7-12H7zM-56 0l12-7V7z" fill="#d1d5db" stroke="#f59e0b"/>
      <circle r="24" fill="#0c2634" stroke="#38bdf8" stroke-width="2"/><circle r="10" fill="#f59e0b" stroke="#fff4" filter="url(#settings-glow)"/>
      <path d="M0-22V-9M22 0H9M0 22V9M-22 0h13" stroke="#e0f2fe" stroke-width="2"/>
    </g><g transform="translate(48 145)"><path d="M0 0h104" stroke="#334155" stroke-width="5"/><circle cx="25" r="7" fill="#38bdf8"/><circle cx="79" r="7" fill="#f59e0b"/></g>
  <g font-family="Consolas,monospace" font-size="5" font-weight="900"><g transform="translate(36 126)"><rect width="128" height="29" rx="3" fill="#11100a" stroke="#f59e0b"/><g fill="#1e293b" stroke="#64748b"><rect x="5" y="5" width="36" height="19"/><rect x="46" y="5" width="36" height="19"/><rect x="87" y="5" width="36" height="19"/></g><text x="23" y="12" fill="#f59e0b" text-anchor="middle">PROVIDER</text><text x="64" y="12" fill="#38bdf8" text-anchor="middle">PRIVACY</text><text x="105" y="12" fill="#4ade80" text-anchor="middle">HARDWARE</text><path d="M10 18h26M51 18h26M92 18h26" stroke="#64748b"/><circle cx="33" cy="18" r="2" fill="#f59e0b"/><circle cx="74" cy="18" r="2" fill="#38bdf8"/><circle cx="95" cy="18" r="2" fill="#ef4444"/></g><text x="100" y="162" fill="#fef3c7" text-anchor="middle">KEYS HIDDEN · BODY SAFE OFF</text></g>
  <g class="settings-scan" stroke="#38bdf8" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#f59e0b" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#f59e0b"/><circle cx="58" cy="2.5" r="1.5" fill="#38bdf8"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
