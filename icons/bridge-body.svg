<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Puente corporal">
  <title>Puente corporal</title>
  <style>
    .body-orbit{animation:bodyOrbit 4s linear infinite}.body-pulse{animation:bodyPulse 1.8s ease-in-out infinite}.body-scan{animation:bodyScan 3s ease-in-out infinite}
    @keyframes bodyOrbit{to{stroke-dashoffset:-42}}@keyframes bodyPulse{50%{opacity:.3}}@keyframes bodyScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.body-orbit,.body-pulse,.body-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="body-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="body-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="body-accent" x1="0" x2="1"><stop stop-color="#facc15"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <radialGradient id="body-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#facc15"/><stop offset=".68" stop-color="#4ade80"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="body-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#facc15" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="body-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="body-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="body-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#facc15" stop-opacity=".28"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#body-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#body-grid)" stroke="#facc15" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#body-beam)"/>
  <circle class="body-orbit" cx="100" cy="100" r="71" fill="none" stroke="#facc15" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="body-orbit" cx="100" cy="100" r="62" fill="none" stroke="#4ade80" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#facc15" stroke-width="1" opacity=".65"/>
  <g fill="url(#body-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#facc15" filter="url(#body-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#4ade80"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#facc15" font-size="7" text-anchor="middle" letter-spacing="1.5">BODY · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#facc15" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#facc15"/><circle class="body-pulse" cx="19" cy="27" r="2" fill="#4ade80" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#4ade80" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#4ade80"/><circle class="body-pulse" cx="8" cy="27" r="2" fill="#facc15" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#body-shadow)"><ellipse cy="54" rx="51" ry="13" fill="#302507" stroke="#facc15" opacity=".55"/>
      <g fill="none" stroke="#d7b733" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-39v50M0-23-32-6-51-20M0-23l32-6 51-20M0 11-21 49M0 11l21 49"/></g>
      <g fill="#fff7b2" stroke="#facc15" stroke-width="2"><circle cy="-54" r="13"/><circle cy="-23" r="6"/><circle cx="-32" cy="-29" r="6"/><circle cx="32" cy="-29" r="6"/><circle cy="11" r="6"/><circle cx="-21" cy="49" r="6"/><circle cx="21" cy="49" r="6"/></g>
      <g fill="#4ade80" filter="url(#body-glow)"><circle cy="-23" r="2"/><circle cx="-32" cy="-29" r="2"/><circle cx="32" cy="-29" r="2"/><circle cy="11" r="2"/></g>
      <path d="M-51-20-55-4m106-16 4 16M-21 49l-7 8m49-8 7 8" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    </g>
  <g class="body-scan" stroke="#4ade80" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#facc15" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#facc15"/><circle cx="58" cy="2.5" r="1.5" fill="#4ade80"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
