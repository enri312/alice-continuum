<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Puente corporal">
  <title>Puente corporal</title>
  <style>
    .body-dash{animation:bodyDash 2.8s linear infinite}.body-blink{animation:bodyBlink 1.6s steps(2,end) infinite}.body-blink2{animation:bodyBlink 2.3s steps(2,end) .5s infinite}.body-scan{animation:bodyScan 4.2s ease-in-out infinite}.body-spin{transform-box:fill-box;transform-origin:50% 50%;animation:bodySpin 16s linear infinite}
    @keyframes bodyDash{to{stroke-dashoffset:-26}}@keyframes bodyBlink{50%{opacity:.25}}
    @keyframes bodyScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes bodySpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.body-dash,.body-blink,.body-blink2,.body-scan,.body-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="body-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="body-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#facc15"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="body-gb" x1="0" x2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="body-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="body-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="body-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#facc15"/><stop offset=".7" stop-color="#4ade80"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="body-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="body-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#body-plate)" stroke="url(#body-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="body-blink" cx="100" cy="42" r="2.2" fill="#4ade80" filter="url(#body-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#facc15" font-size="4">[BRIDGE] CINETICA CORPORAL // IK_SOLVER</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">LOCOMOTION FSM ENGINE</text>
    </g>

    <!-- Left: Skeletal Tracking Viewport -->
    <g filter="url(#body-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#0c0a00" stroke="#facc15" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#body-screen-bg)"/>
    </g>
    <!-- Viewport HUD & Labels -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#fde047" font-size="2.6">SKELETON_TRACK</text>
      <circle cx="92" cy="65" r="1.5" fill="#4ade80" class="body-blink"/>
    </g>
    
    <!-- 3D Grid Floor Projection -->
    <g stroke="#334155" stroke-width="0.8" opacity="0.6">
      <path d="M42 114h52 M46 109h44 M50 104h36 M54 99h28"/>
      <path d="M68 99L42 114 M68 99L94 114 M68 99V114 M61 99L51 114 M75 99L85 114"/>
    </g>

    <!-- Advanced Biomechanical Skeleton Wireframe -->
    <g stroke="#facc15" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Head & Spine -->
      <circle cx="68" cy="74" r="3.5"/>
      <path d="M68 77.5 V96" stroke-width="1.8"/> <!-- Spine -->
      <circle cx="68" cy="84" r="1"/> <!-- Chest Node -->
      <!-- Shoulders & Arms -->
      <path d="M58 84 L78 84" stroke-width="1.5"/> <!-- Collarbone -->
      <path d="M58 84 L52 93 L54 102"/> <!-- Left Arm -->
      <path d="M78 84 L84 93 L82 102"/> <!-- Right Arm -->
      <!-- Pelvis & Legs -->
      <path d="M62 96 L74 96" stroke-width="1.5"/> <!-- Pelvis -->
      <path d="M62 96 L58 106 L60 115 L63 115"/> <!-- Left Leg & Foot -->
      <path d="M74 96 L78 106 L76 115 L73 115"/> <!-- Right Leg & Foot -->
    </g>
    
    <!-- Articulation & IK Effector Nodes -->
    <g fill="#fef08a">
      <circle cx="68" cy="77.5" r="1.5"/> <!-- Neck -->
      <circle cx="58" cy="84" r="1.5"/><circle cx="78" cy="84" r="1.5"/> <!-- Shoulders -->
      <circle cx="62" cy="96" r="1.5"/><circle cx="74" cy="96" r="1.5"/> <!-- Hips -->
    </g>
    <!-- Active IK Targets (Hands & Feet) -->
    <g fill="#4ade80" class="body-blink" filter="url(#body-glow)">
      <circle cx="54" cy="102" r="2"/><circle cx="82" cy="102" r="2"/> <!-- Hands -->
      <circle cx="61.5" cy="115" r="2"/><circle cx="74.5" cy="115" r="2"/> <!-- Feet -->
    </g>
    
    <!-- Center of Mass (CoM) Projection -->
    <path d="M68 90v25" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="68" cy="90" r="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
    <path d="M65 90h6 M68 87v6" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="68" cy="115" rx="8" ry="2.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>

    <!-- Right: Locomotion FSM & Matrix Telemetry -->
    <g filter="url(#body-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#031109" stroke="#4ade80" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#010603"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#86efac" font-size="2.6">LOCOMOTION FSM</text>
    </g>
    <path d="M108 69h48" stroke="#14532d" stroke-width="1"/>
    
    <!-- State Machine Graph -->
    <g transform="translate(132 86)">
      <!-- Connections -->
      <path d="M-14 -8 L14 -8 L0 9 Z" fill="none" stroke="#166534" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M-14 -8 C-20 -15 -5 -20 0 -22 C5 -20 20 -15 14 -8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
      <path d="M0 9 C-5 16 5 16 0 9" fill="none" stroke="#22c55e" stroke-width="1"/>
      
      <!-- State Nodes -->
      <circle cx="0" cy="-22" r="3" fill="#14532d" stroke="#22c55e"/> <!-- Fall/Jump -->
      <circle cx="-14" cy="-8" r="4.5" fill="#4ade80" filter="url(#body-glow)"/> <!-- Idle (Active) -->
      <circle cx="14" cy="-8" r="3.5" fill="#14532d" stroke="#22c55e"/> <!-- Walk -->
      <circle cx="0" cy="9" r="3.5" fill="#14532d" stroke="#22c55e"/> <!-- Run -->
      <circle cx="-14" cy="-8" r="2" fill="#000" class="body-blink2"/>
    </g>
    
    <!-- FSM Labels -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#a3e635">
      <text x="117" y="74" text-anchor="middle">IDLE</text>
      <text x="146" y="74" text-anchor="middle">WALK</text>
      <text x="132" y="100" text-anchor="middle">RUN/SPRINT</text>
    </g>

    <!-- Gait Cycle & Kinematic Matrix -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2">
      <text x="108" y="109" fill="#86efac">GAIT CYCLE</text>
      <text x="156" y="109" fill="#fde047" text-anchor="end">PHASE: 0.0</text>
    </g>
    <!-- Waveform/Sine graph for gait cycle -->
    <g stroke="#facc15" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M108 116 Q 114 110 120 116 T 132 116 T 144 116 T 156 116" stroke-dasharray="2 3"/>
      <path d="M108 116 Q 114 110 120 116" stroke-width="2" stroke="#facc15"/>
      <circle cx="120" cy="116" r="1.5" fill="#4ade80" class="body-blink"/>
    </g>
    
    <!-- Root Motion Data -->
    <rect x="108" y="122" width="30" height="2" fill="#14532d"/>
    <rect x="108" y="122" width="12" height="2" fill="#22c55e"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="2">
      <text x="156" y="124" fill="#a3e635" text-anchor="end">VEL: 0.0m/s</text>
    </g>

    <!-- Bottom Module Output Tabs & Terminal -->
    <g filter="url(#body-shadow)">
      <rect x="38" y="127" width="124" height="18" rx="3" fill="#0c0a00" stroke="#facc15" stroke-width="1.1"/>
    </g>
    
    <!-- Matrix Hex Dump & Logs -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.2" fill="#64748b">
      <text x="42" y="133">> IK_SOLVER: FABRIK converged (4 iter)</text>
      <text x="42" y="137">> RETARGETING: Active (12 mapped clips)</text>
      <text x="42" y="141">> RIG_MAP: Humanoid standard (52 bones)</text>
    </g>
    
    <!-- Status Badges & Gamepad Vector -->
    <path d="M116 128 V144" stroke="#facc15" stroke-width="0.8" opacity="0.5"/>
    
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.4">
      <rect x="120" y="130" width="38" height="6" fill="#14532d"/>
      <text x="122" y="134.5" fill="#4ade80">IK CONSTRAINT: ON</text>
      
      <rect x="120" y="137" width="38" height="6" fill="#422006"/>
      <text x="122" y="141.5" fill="#facc15">MANUAL CTRL: PAD</text>
    </g>
  <g aria-label="Cadena cinemática" font-family="Consolas,monospace" font-weight="900">
    <path d="M42 151h20l5-4 8 8 8-8 8 8 8-8 8 8 6-4h45" fill="none" stroke="#facc15" stroke-width=".75" opacity=".72"/>
    <g fill="#020617" stroke="#fb923c" stroke-width=".7"><circle cx="67" cy="147" r="2"/><circle cx="75" cy="155" r="2"/><circle cx="83" cy="147" r="2"/><circle cx="91" cy="155" r="2"/><circle cx="99" cy="147" r="2"/><circle cx="107" cy="155" r="2"/></g>
    <text x="42" y="157" fill="#94a3b8" font-size="2.35">ROOT</text><text x="158" y="157" fill="#94a3b8" font-size="2.35" text-anchor="end">HIP · KNEE · FOOT · ACK</text>
  </g>
  <rect class="body-scan" x="40" y="50" width="120" height="1.4" fill="#facc15"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#facc15"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-BODY</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">SOLVER</text></g>
</svg>
