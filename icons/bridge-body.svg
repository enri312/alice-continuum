  </g>

  <g class="bb-retarget" transform="translate(96 98)" filter="url(#bb-glow)"><path class="bb-dash" d="M-6 0h20" fill="none" stroke="url(#bb-arrow)" stroke-width="2.2" stroke-dasharray="4 3"/><path d="m8-5 7 5-7 5" fill="none" stroke="#fbbf24" stroke-width="2"/></g>

