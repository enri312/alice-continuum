  <path d="M28 44h144l7 7v96l-7 7H28l-7-7V51Z" fill="#030a14" stroke="#155e75" stroke-width="2" filter="url(#bb-shadow)"/>
  <path d="M96 44v110" stroke="#164e63"/><path d="M22 64h157M22 137h157" stroke="#0f2f3e"/>
  <g font-family="Consolas,monospace" font-size="4.6" font-weight="900"><text x="30" y="57" fill="#38bdf8">MOCAP INPUT</text><text x="106" y="57" fill="#5eead4">ALICE OUTPUT</text><text x="169" y="57" fill="#fbbf24" text-anchor="end">SAFE OFF</text></g>

