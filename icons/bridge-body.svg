<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .bb-scan{animation:bbScan 3.4s ease-in-out infinite}.bb-dash{animation:bbDash 2.8s linear infinite}.bb-joint{animation:bbJoint 1.8s steps(2,end) infinite}.bb-joint.b{animation-delay:-.9s}.bb-retarget{animation:bbRetarget 2.6s ease-in-out infinite}
    @keyframes bbScan{0%,100%{transform:translateY(-35px);opacity:.08}50%{transform:translateY(44px);opacity:.86}}@keyframes bbDash{to{stroke-dashoffset:-34}}@keyframes bbJoint{50%{opacity:.28}}@keyframes bbRetarget{0%,100%{opacity:.25;transform:translateX(-4px)}50%{opacity:1;transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){.bb-scan,.bb-dash,.bb-joint,.bb-retarget{animation:none}}
  </style>
  <defs>
    <linearGradient id="bb-frame" x1="10" y1="8" x2="190" y2="192"><stop stop-color="#314156"/><stop offset=".48" stop-color="#0a1726"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="bb-body" x1="121" y1="56" x2="162" y2="145"><stop stop-color="#ccfbf1" stop-opacity=".8"/><stop offset=".45" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset="1" stop-color="#0f766e" stop-opacity=".3"/></linearGradient>
    <linearGradient id="bb-arrow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="bb-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bb-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".86"/></filter>
    <pattern id="bb-grid" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M11 0H0v11" fill="none" stroke="#164e63" stroke-width=".55" opacity=".5"/></pattern>
  </defs>
  <path d="M100 7c79 0 93 14 93 93s-14 93-93 93S7 179 7 100 21 7 100 7Z" fill="url(#bb-frame)" stroke="#0e7490" stroke-width="3"/>
  <path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="url(#bb-grid)" opacity=".5" stroke="#67e8f9"/>
  <g fill="#475569" stroke="#111827" stroke-width="2"><circle cx="28" cy="28" r="5"/><circle cx="172" cy="28" r="5"/><circle cx="28" cy="172" r="5"/><circle cx="172" cy="172" r="5"/></g>
