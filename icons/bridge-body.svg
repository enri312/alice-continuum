  </g>
  <path class="bb-scan" d="M105 99h68" stroke="url(#bb-arrow)" stroke-width="2" filter="url(#bb-glow)"/>

  <g transform="translate(29 142)" font-family="Consolas,monospace" font-size="4.2" font-weight="900"><rect width="142" height="7" fill="#04101a" stroke="#164e63"/><text x="4" y="5" fill="#64748b">TRACKERS 0/0</text><text x="70" y="5" fill="#64748b" text-anchor="middle">IK OFF</text><text x="138" y="5" fill="#fbbf24" text-anchor="end">OUTPUT BLOCKED</text></g>
  <g transform="translate(38 162)" font-family="Consolas,monospace" font-size="4.3" font-weight="900"><rect width="124" height="14" rx="3" fill="#020617" stroke="#334155"/><circle cx="8" cy="7" r="2.5" fill="#64748b"/><text x="15" y="8.6" fill="#94a3b8">FOOT LOCK</text><path d="M56 7h27" stroke="#164e63"/><circle cx="69" cy="7" r="3" fill="#38bdf8"/><text x="91" y="8.6" fill="#5eead4">COM</text><rect x="106" y="4" width="12" height="6" fill="#071722" stroke="#155e75"/></g>
  <g fill="none" stroke="#38bdf8" stroke-width="1" opacity=".7"><path d="M15 69h8v-8m-8 69h8v8m162-69h-8v-8m8 69h-8v8"/></g>
</svg>
