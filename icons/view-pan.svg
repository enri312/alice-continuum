<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Desplazar vista">
  <title>Desplazar vista</title>
  <style>
    .pan-dash{animation:panDash 2.8s linear infinite}.pan-blink{animation:panBlink 1.6s steps(2,end) infinite}.pan-blink2{animation:panBlink 2.3s steps(2,end) .5s infinite}.pan-scan{animation:panScan 4.2s ease-in-out infinite}.pan-spin{transform-box:fill-box;transform-origin:50% 50%;animation:panSpin 16s linear infinite}
    @keyframes panDash{to{stroke-dashoffset:-26}}@keyframes panBlink{50%{opacity:.25}}
    @keyframes panScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes panSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.pan-dash,.pan-blink,.pan-blink2,.pan-scan,.pan-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="pan-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="pan-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="pan-gb" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="pan-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="pan-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#38bdf8"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="pan-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="pan-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#pan-plate)" stroke="url(#pan-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="pan-blink" cx="100" cy="42" r="2.2" fill="#22d3ee" filter="url(#pan-glow)"/>
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#pan-glow)"><path d="M100 62v72M64 98h72"/></g>
    <g fill="#38bdf8"><path d="M100 50l-12 16h24zM100 146l12-16H88zM52 98l16-12v24zM148 98l-16 12v-24z"/></g>
    <circle cx="100" cy="98" r="10" fill="#e0f2fe"/><circle class="pan-blink" cx="100" cy="98" r="4" fill="#22d3ee"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="154" fill="#64748b" font-size="3.5" text-anchor="middle">X 0.00 · Y 0.00</text></g>
  <rect class="pan-scan" x="40" y="50" width="120" height="1.4" fill="#38bdf8"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#38bdf8"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-PAN</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">PAN</text></g>
</svg>
