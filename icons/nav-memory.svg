<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .m-read-live{animation:mRead 2.6s ease-in-out infinite}.m-orbit-live{animation:mOrbit 3.2s linear infinite}.m-packet-live{animation:mPacket 2s ease-in-out infinite}.m-led-live{animation:mLed 1.3s steps(2,end) infinite}.m-scan-live{animation:mScan 2.7s ease-in-out infinite}
    @keyframes mRead{50%{opacity:.35;transform:translateY(3px)}}@keyframes mOrbit{to{stroke-dashoffset:-36}}@keyframes mPacket{0%,100%{transform:translateY(-8px);opacity:.15}50%{transform:translateY(12px);opacity:1}}@keyframes mLed{50%{opacity:.25}}@keyframes mScan{0%,100%{transform:translateX(-10px);opacity:.15}50%{transform:translateX(15px);opacity:.95}}
    @media (prefers-reduced-motion:reduce){.m-read-live,.m-orbit-live,.m-packet-live,.m-led-live,.m-scan-live{animation:none}}
  </style>
  <defs>
    <linearGradient id="m-frame" x1="12" y1="8" x2="188" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#334155"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="m-disc" x1="40" y1="0" x2="155" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0369a1"/><stop offset=".32" stop-color="#7dd3fc"/><stop offset=".72" stop-color="#0284c7"/><stop offset="1" stop-color="#075985"/></linearGradient>
    <linearGradient id="m-card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="m-field"><stop stop-color="#38bdf8" stop-opacity=".3"/><stop offset="1" stop-color="#0369a1" stop-opacity="0"/></radialGradient>
    <filter id="m-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="m-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".85"/></filter>
    <pattern id="m-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#164e63" stroke-width=".6" opacity=".5"/></pattern>
  </defs>
  <path d="M100 7c79 0 93 14 93 93s-14 93-93 93S7 179 7 100 21 7 100 7Z" fill="url(#m-frame)" stroke="#0284c7" stroke-width="3"/><path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity=".55"/>
  <circle cx="100" cy="103" r="76" fill="url(#m-field)"/><circle cx="100" cy="103" r="70" fill="url(#m-grid)" opacity=".4"/>
  <g fill="#475569" stroke="#111827" stroke-width="2"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g><g stroke="#020617" stroke-width="2"><path d="m27 27 6 6m134-6 6 6M27 167l6 6m134-6 6 6"/></g>
  <text x="100" y="27" fill="#7dd3fc" font-family="Consolas,monospace" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="2">MEM-03 · VAULT</text>
  <ellipse cx="100" cy="161" rx="68" ry="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#m-shadow)"/><ellipse cx="100" cy="161" rx="50" ry="14" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 4"/>
  <path d="m60 153 18-105h44l18 105Z" fill="#38bdf8" opacity=".1"/>
  <g filter="url(#m-shadow)">
    <g transform="translate(100 129)"><path d="M-42 0v23c0 18 84 18 84 0V0Z" fill="url(#m-disc)" stroke="#0284c7" stroke-width="2"/><ellipse rx="42" ry="14" fill="#38bdf8" stroke="#a5f3fc" stroke-width="2"/><path d="M-28 5h17m7 0h8" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="5" r="4" fill="#34d399" filter="url(#m-glow)"/><circle cx="34" cy="5" r="3" fill="#22d3ee"/></g>
    <g transform="translate(100 96)"><path d="M-42 0v23c0 18 84 18 84 0V0Z" fill="url(#m-disc)" stroke="#0284c7" stroke-width="2"/><ellipse rx="42" ry="14" fill="#38bdf8" stroke="#a5f3fc" stroke-width="2"/><path d="M-28 5h25m7 0h9" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="5" r="4" fill="#22d3ee" filter="url(#m-glow)"/><circle cx="34" cy="5" r="3" fill="#34d399"/></g>
    <g transform="translate(100 63)"><path d="M-42 0v23c0 18 84 18 84 0V0Z" fill="url(#m-disc)" stroke="#0284c7" stroke-width="2"/><ellipse rx="42" ry="14" fill="#7dd3fc" stroke="#fff" stroke-width="2" filter="url(#m-glow)"/><path d="M-28 5h12m7 0h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="5" r="4" fill="#34d399" filter="url(#m-glow)"/><circle cx="34" cy="5" r="3" fill="#22d3ee"/></g>
  </g>
  <circle cx="100" cy="39" r="9" fill="#34d399" stroke="#d1fae5" stroke-width="2" filter="url(#m-glow)"/><circle cx="100" cy="39" r="4" fill="#fff"/><path d="M100 48v9" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>
  <ellipse class="m-orbit-live" cx="100" cy="103" rx="66" ry="25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55"/>
  <g transform="translate(29 72) rotate(-8)" filter="url(#m-shadow)"><rect width="35" height="48" rx="4" fill="url(#m-card)" stroke="#67e8f9" stroke-width="2"/><rect x="5" y="6" width="25" height="7" rx="2" fill="#0c4a6e"/><path d="M6 20h23M6 27h18M6 34h21" stroke="#94a3b8" stroke-width="2"/><circle cx="27" cy="42" r="3" fill="#34d399"/></g>
  <g transform="translate(143 91) rotate(8)" filter="url(#m-shadow)"><rect width="31" height="42" rx="4" fill="url(#m-card)" stroke="#34d399" stroke-width="2"/><path d="M5 8h21M5 15h15M5 22h19" stroke="#94a3b8" stroke-width="2"/><path d="m17 32 4 4 7-9" fill="none" stroke="#34d399" stroke-width="3"/></g>
  <g transform="translate(34 134)"><rect width="34" height="13" rx="3" fill="#07111e" stroke="#38bdf8"/><text x="17" y="9" fill="#a5f3fc" font-family="Consolas,monospace" font-size="6" font-weight="900" text-anchor="middle">SHA-256</text></g>
  <g class="m-packet-live" fill="#a5f3fc" filter="url(#m-glow)"><rect x="96" y="50" width="8" height="4" rx="2"/><rect x="96" y="76" width="8" height="4" rx="2"/></g>
  <g class="m-scan-live" stroke="#34d399" stroke-width="1.5" opacity=".8"><path d="M69 69h62M69 102h62M69 135h62"/></g>
  <g fill="#071521" stroke="#38bdf8" stroke-width="1.3" font-family="Consolas,monospace" font-size="5" font-weight="900">
    <path d="M16 45h23v29H16l-4-5V50Z"/><text x="27" y="55" fill="#67e8f9" stroke="none" text-anchor="middle">INDEX</text><path d="M20 62h15m-15 6h10" stroke="#34d399"/>
    <path d="M161 44h23l4 5v20l-4 5h-23Z"/><text x="173" y="55" fill="#67e8f9" stroke="none" text-anchor="middle">VEC</text><path d="M165 62h15m-10 6h10" stroke="#fbbf24"/><circle class="m-led-live" cx="181" cy="49" r="2" fill="#34d399" stroke="none"/>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="1.2" opacity=".8"><path d="M18 83v20l12 8v14"/><path d="M182 83v20l-12 8v14"/><path d="M43 35h16l7 8m91-8h-16l-7 8"/></g>
  <g transform="translate(143 145)" font-family="Consolas,monospace" font-size="5" font-weight="900"><rect width="40" height="11" rx="2" fill="#052e2b" stroke="#34d399"/><circle cx="7" cy="5.5" r="2" fill="#34d399"/><text x="24" y="7.5" fill="#a7f3d0" text-anchor="middle">RAG READY</text></g>
  <g fill="none" stroke="#67e8f9" stroke-width="1" opacity=".72"><path d="M14 96h8v-8m-8 35h8v8m164-35h-8v-8m8 35h-8v8"/><path class="m-orbit-live" d="M82 33h36" stroke-dasharray="3 4"/></g>
  <g transform="translate(65 176)"><rect width="70" height="8" rx="4" fill="#020617" stroke="#334155"/><rect x="3" y="2.5" width="45" height="3" rx="1.5" fill="#38bdf8" filter="url(#m-glow)"/><circle cx="58" cy="4" r="2" fill="#34d399"/><circle cx="65" cy="4" r="2" fill="#fbbf24"/></g>
</svg>
