<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Memoria">
  <title>Memoria</title>
  <style>
    .memory-dash{animation:memoryDash 2.8s linear infinite}.memory-blink{animation:memoryBlink 1.6s steps(2,end) infinite}.memory-blink2{animation:memoryBlink 2.3s steps(2,end) .5s infinite}.memory-scan{animation:memoryScan 4.2s ease-in-out infinite}.memory-spin{transform-box:fill-box;transform-origin:50% 50%;animation:memorySpin 16s linear infinite}
    @keyframes memoryDash{to{stroke-dashoffset:-26}}@keyframes memoryBlink{50%{opacity:.25}}
    @keyframes memoryScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes memorySpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.memory-dash,.memory-blink,.memory-blink2,.memory-scan,.memory-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="memory-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="memory-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="memory-gb" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="memory-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="memory-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#60a5fa"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="memory-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="memory-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#memory-plate)" stroke="url(#memory-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#60a5fa" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="memory-blink" cx="100" cy="42" r="2.2" fill="#a78bfa" filter="url(#memory-glow)"/>
  <g filter="url(#memory-shadow)"><circle cx="68" cy="94" r="30" fill="#0b1420" stroke="#60a5fa" stroke-width="2.6"/></g>
    <circle cx="68" cy="94" r="22" fill="#16202e" stroke="#cbd5e1" stroke-width="1.4"/>
    <g stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"><path d="M68 94V79M68 94l13 7.5M68 94l-13 7.5"/></g>
    <circle cx="68" cy="94" r="4.5" fill="#1f2937" stroke="#cbd5e1" stroke-width="1.6"/>
    <g fill="#334155" stroke="#94a3b8" stroke-width=".8"><circle cx="68" cy="70" r="2"/><circle cx="85" cy="77" r="2"/><circle cx="92" cy="94" r="2"/><circle cx="85" cy="111" r="2"/><circle cx="68" cy="118" r="2"/><circle cx="51" cy="111" r="2"/><circle cx="44" cy="94" r="2"/><circle cx="51" cy="77" r="2"/></g>
    <g filter="url(#memory-shadow)"><rect x="106" y="58" width="54" height="13" rx="2" fill="#101c2b" stroke="#60a5fa"/><rect x="106" y="75" width="54" height="13" rx="2" fill="#101c2b" stroke="#60a5fa"/><rect x="106" y="92" width="54" height="13" rx="2" fill="#101c2b" stroke="#a78bfa"/></g>
    <path d="M110 64h34M110 68h26M110 81h34M110 85h26M110 98h34M110 102h26" stroke="#64748b" stroke-width="1.2"/>
    <circle class="memory-blink" cx="154" cy="64" r="1.8" fill="#a78bfa"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4"><rect x="106" y="110" width="54" height="10" rx="2" fill="#0b1320" stroke="#a78bfa" stroke-width=".8"/><text x="133" y="117" fill="#c4b5fd" text-anchor="middle">RAM 3/6 · TTL 30'</text></g>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4"><text x="42" y="132" fill="#93c5fd">EPI 9</text><text x="58" y="132" fill="#c4b5fd">SEM 0</text><text x="74" y="132" fill="#a7f3d0">PROC 1</text><text x="92" y="132" fill="#94a3b8">WORK 0</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><rect x="106" y="124" width="54" height="12" rx="2" fill="#07111e" stroke="#60a5fa" stroke-width=".8"/><text x="133" y="132" fill="#93c5fd" font-size="3.6" text-anchor="middle">10 REC · SHA OK</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="146" fill="#475569" font-size="3">BAK OK</text><text x="100" y="146" fill="#64748b" font-size="3.6" text-anchor="middle">KEEP SEPARATE · LAYER INDEX v2</text></g>
  <rect class="memory-scan" x="40" y="50" width="120" height="1.4" fill="#60a5fa"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#60a5fa"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-MEMORY</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">VAULT</text></g>
</svg>
