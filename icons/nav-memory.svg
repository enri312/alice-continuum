<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Memoria">
  <title>Memoria</title>
  <style>
    .memory-dash{animation:memoryDash 2.8s linear infinite}.memory-blink{animation:memoryBlink 1.6s steps(2,end) infinite}.memory-blink2{animation:memoryBlink 2.3s steps(2,end) .5s infinite}.memory-scan{animation:memoryScan 4.2s ease-in-out infinite}.memory-spin{transform-box:fill-box;transform-origin:50% 50%;animation:memorySpin 16s linear infinite}
    @keyframes memoryDash{to{stroke-dashoffset:-26}}@keyframes memoryBlink{50%{opacity:.25}}
    @keyframes memoryScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes memorySpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.memory-dash,.memory-blink,.memory-blink2,.memory-scan,.memory-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="memory-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="memory-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="memory-gb" x1="0" x2="1"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="memory-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="memory-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="memory-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#60a5fa"/><stop offset=".7" stop-color="#c084fc"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="memory-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="memory-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#memory-plate)" stroke="url(#memory-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="memory-blink" cx="100" cy="42" r="2.2" fill="#c084fc" filter="url(#memory-glow)"/>
  <!-- Top System Header: Layered Memory Context -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#60a5fa" font-size="4">MEMORIA POR CAPAS · R6.1</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">DISCO LOCAL · PERSISTENTE</text>
    </g>

    <!-- Heavy Circular Memory Vault Mechanism (Consolidation & Core Index Engine) -->
    <g filter="url(#memory-shadow)">
      <!-- Outer Armored Vault Casing -->
      <circle cx="68" cy="88" r="30" fill="#0b1424" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="68" cy="88" r="23" fill="#111c30" stroke="#94a3b8" stroke-width="1.2"/>
    </g>
    <!-- Spaced Consolidation Decay Arc -->
    <path d="M68 65a23 23 0 0 1 21 14" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" filter="url(#memory-glow)"/>
    <!-- Rotating Vault Lock Spindles & Cryptographic Rotor -->
    <g stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round">
      <path d="M68 88V74M68 88l12 7M68 88l-12 7"/>
    </g>
    <circle cx="68" cy="88" r="5" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.4"/>
    <circle class="memory-blink" cx="68" cy="88" r="1.8" fill="#60a5fa"/>
    <!-- Vault Perimeter Locking Studs -->
    <g fill="#334155" stroke="#94a3b8" stroke-width=".7">
      <circle cx="68" cy="65" r="1.8"/><circle cx="84" cy="72" r="1.8"/>
      <circle cx="91" cy="88" r="1.8"/><circle cx="84" cy="104" r="1.8"/>
      <circle cx="68" cy="111" r="1.8"/><circle cx="52" cy="104" r="1.8"/>
      <circle cx="45" cy="88" r="1.8"/><circle cx="52" cy="72" r="1.8"/>
    </g>
    <!-- Spaced Review / Recall Reinforcement Readout -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.9">
      <text x="68" y="103" fill="#a7f3d0" text-anchor="middle">REINFORCE +1</text>
      <text x="68" y="118" fill="#94a3b8" text-anchor="middle">REPASO ESPACIADO</text>
    </g>

    <!-- Right Layered Memory Cartridge Stack -->
    <!-- Cartridge 1: Episodic & Conversation Memory -->
    <g filter="url(#memory-shadow)">
      <rect x="105" y="56" width="58" height="15" rx="2.5" fill="#0c1a2e" stroke="#60a5fa" stroke-width="1.1"/>
    </g>
    <path d="M109 61h26M109 66h18" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="156" cy="63.5" r="2" fill="#38bdf8" class="memory-blink"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <text x="138" y="63.5" fill="#bae6fd">01 EPI</text>
      <text x="151" y="68.5" fill="#64748b" font-size="2.6" text-anchor="end">CONVERSACIONES</text>
    </g>

    <!-- Cartridge 2: Semantic Memory & Obsidian / Markdown Notes Vault -->
    <g filter="url(#memory-shadow)">
      <rect x="105" y="74" width="58" height="15" rx="2.5" fill="#14112e" stroke="#c084fc" stroke-width="1.1"/>
    </g>
    <!-- Micro Knowledge Graph Links -->
    <g stroke="#c084fc" stroke-width=".9" fill="none">
      <circle cx="111" cy="81.5" r="1.6" fill="#c084fc"/>
      <circle cx="119" cy="78.5" r="1.6" fill="#c084fc"/>
      <circle cx="119" cy="84.5" r="1.6" fill="#c084fc"/>
      <path d="M111 81.5l8-3m-8 3l8 3"/>
    </g>
    <circle cx="156" cy="81.5" r="2" fill="#c084fc" class="memory-blink2"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <text x="124" y="81.5" fill="#e9d5ff">02 SEM</text>
      <text x="151" y="86.5" fill="#64748b" font-size="2.6" text-anchor="end">HECHOS · VAULT .MD</text>
    </g>

    <!-- Cartridge 3: Governed Procedural Memory -->
    <g filter="url(#memory-shadow)">
      <rect x="105" y="92" width="58" height="15" rx="2.5" fill="#0c231e" stroke="#34d399" stroke-width="1.1"/>
    </g>
    <path d="M109 97h8l3-3 4 6 3-3h10" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="156" cy="99.5" r="2" fill="#34d399"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.2">
      <text x="139" y="99.5" fill="#a7f3d0">03 PROC</text>
      <text x="151" y="104.5" fill="#64748b" font-size="2.6" text-anchor="end">R5 HABILIDADES</text>
    </g>

    <!-- Volatile Working Memory Buffer (RAM with TTL) -->
    <g filter="url(#memory-shadow)">
      <rect x="105" y="110" width="58" height="13" rx="2" fill="#111827" stroke="#fbbf24" stroke-width="1"/>
    </g>
    <circle cx="111" cy="116.5" r="2.2" fill="none" stroke="#fbbf24" stroke-width=".8"/>
    <path d="M111 116.5v-1.4m0 1.4 1 1" stroke="#fbbf24" stroke-width=".8" stroke-linecap="round"/>
    <!-- Working RAM Gauge -->
    <rect x="116" y="115" width="22" height="3" rx="1.5" fill="#050811" stroke="#475569" stroke-width=".6"/>
    <rect x="117" y="115.5" width="12" height="2" rx="1" fill="#fbbf24"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3">
      <text x="141" y="117.5" fill="#fde68a">RAM 3/6</text>
      <text x="160" y="121" fill="#94a3b8" font-size="2.5" text-anchor="end">TTL 30m · VOLÁTIL</text>
    </g>

    <!-- Bottom Forensic Checksums & Safe Storage Footprint -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.3">
      <rect x="38" y="127" width="58" height="10" rx="2" fill="#07111e" stroke="#4ade80" stroke-width=".9"/>
      <path d="m42 132 2 2 4-4" fill="none" stroke="#4ade80" stroke-width="1.3"/>
      <text x="50" y="134" fill="#a7f3d0">SHA-256 OK · BAK</text>
      <rect x="105" y="127" width="58" height="10" rx="2" fill="#07111e" stroke="#60a5fa" stroke-width=".9"/>
      <text x="134" y="134" fill="#93c5fd" text-anchor="middle">LAYER-INDEX-V2</text>
    </g>

    <!-- Bottom Architectural Guarantee -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="100" y="146" fill="#64748b" font-size="3.5" text-anchor="middle">RECORDS.JSON · KEEP SEPARATE · ZERO LOSS</text>
      <text x="40" y="146" fill="#475569" font-size="2.9">R6.1</text>
      <text x="162" y="146" fill="#475569" font-size="2.9" text-anchor="end">ATOMIC REPLACE</text>
    </g>
  <g aria-label="Ciclo de memoria gobernado" font-family="Consolas,monospace" font-weight="900">
    <path d="M42 153h15l4-4h14l4 4h14l4-4h14l4 4h14l4-4h25" fill="none" stroke="#60a5fa" stroke-width=".75"/>
    <g fill="#0f1d36" stroke="#a78bfa" stroke-width=".6"><circle cx="61" cy="149" r="2"/><circle cx="79" cy="153" r="2"/><circle cx="97" cy="149" r="2"/><circle cx="115" cy="153" r="2"/><circle cx="133" cy="149" r="2"/></g>
    <text x="42" y="158" fill="#94a3b8" font-size="2.15">ENCODE</text><text x="158" y="158" fill="#94a3b8" font-size="2.15" text-anchor="end">RECALL · ARCHIVE · RETAIN · DELETE</text>
  </g>
  <rect class="memory-scan" x="40" y="50" width="120" height="1.4" fill="#60a5fa"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#60a5fa"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-MEMORY</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">LAYERED MEMORY</text></g>
</svg>
