<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Volumen neuronal 3D">
  <title>Volumen neuronal 3D</title>
  <style>
    .volume-orbit{animation:volumeOrbit 4s linear infinite}.volume-pulse{animation:volumePulse 1.8s ease-in-out infinite}.volume-scan{animation:volumeScan 3s ease-in-out infinite}
    @keyframes volumeOrbit{to{stroke-dashoffset:-42}}@keyframes volumePulse{50%{opacity:.3}}@keyframes volumeScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.volume-orbit,.volume-pulse,.volume-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="volume-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="volume-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="volume-accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <radialGradient id="volume-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".68" stop-color="#fbbf24"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="volume-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#22d3ee" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="volume-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="volume-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="volume-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#volume-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#volume-grid)" stroke="#22d3ee" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#volume-beam)"/>
  <circle class="volume-orbit" cx="100" cy="100" r="71" fill="none" stroke="#22d3ee" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="volume-orbit" cx="100" cy="100" r="62" fill="none" stroke="#fbbf24" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".65"/>
  <g fill="url(#volume-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#22d3ee" filter="url(#volume-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#fbbf24"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#22d3ee" font-size="7" text-anchor="middle" letter-spacing="1.5">VOLUME · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#22d3ee" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#22d3ee"/><circle class="volume-pulse" cx="19" cy="27" r="2" fill="#fbbf24" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#fbbf24" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#fbbf24"/><circle class="volume-pulse" cx="8" cy="27" r="2" fill="#22d3ee" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#volume-shadow)"><ellipse cy="50" rx="59" ry="15" fill="#082f49" stroke="#22d3ee" opacity=".5"/>
      <g fill="none"><ellipse rx="61" ry="33" stroke="#22d3ee" stroke-width="1.4"/><ellipse rx="61" ry="33" stroke="#fbbf24" transform="rotate(60)"/><ellipse rx="61" ry="33" stroke="#f472b6" transform="rotate(120)"/></g>
      <g stroke="#477081" stroke-width=".8"><path d="m-48-18 21 14 15-31L8-8l22-30 17 20M-52 18l25-22 17 33L8-8l22 34 22-8" fill="none"/><path d="M-27-4 30 26M-12-35-10 29M8-8 47-18"/></g>
      <circle r="25" fill="url(#volume-holo)" stroke="#cffafe" stroke-width="2" filter="url(#volume-glow)"/>
      <g fill="#fff"><circle cx="-48" cy="-18" r="4"/><circle cx="-12" cy="-35" r="4"/><circle cx="47" cy="-18" r="4"/><circle cx="-52" cy="18" r="4"/><circle cx="-10" cy="29" r="4"/><circle cx="52" cy="18" r="4"/></g><g fill="#fbbf24"><circle cx="-48" cy="-18" r="2"/><circle cx="47" cy="-18" r="2"/><circle cx="-10" cy="29" r="2"/></g>
    </g>
  <g class="volume-scan" stroke="#fbbf24" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#22d3ee" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#22d3ee"/><circle cx="58" cy="2.5" r="1.5" fill="#fbbf24"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
