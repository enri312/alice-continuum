<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Emblema de Alice Continuum" data-refinement="subtle" data-motion="static" data-palette="graphite-cyan-violet" data-detail-pass="precision-finish-v16" data-component-refinement="precision-components-v16" data-material-finish="micro-etched-v16" data-mounting-grammar="framed-emblem" data-screw-style="layered-hex-socket" shape-rendering="geometricPrecision">
  <title>Alice Continuum</title>
  <defs>
    <linearGradient id="monogram-metal" x1="220" y1="148" x2="286" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".38" stop-color="#e8f1fa"/><stop offset=".64" stop-color="#b1c9dd"/><stop offset=".8" stop-color="#f1f8ff"/><stop offset="1" stop-color="#86a5bd"/>
