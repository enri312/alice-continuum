<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .b-packet{animation:bPacket 2.5s ease-in-out infinite}.b-packet.two{animation-delay:-1.25s}.b-hub{transform-box:fill-box;transform-origin:center;animation:bHub 2.1s ease-in-out infinite}.b-dash{animation:bDash 2.8s linear infinite}.b-scan{animation:bScan 3.1s ease-in-out infinite}.b-led{animation:bLed 1.2s steps(2,end) infinite}
    @keyframes bPacket{0%,100%{opacity:.08;transform:translateX(-18px)}50%{opacity:1;transform:translateX(20px)}}@keyframes bHub{50%{transform:scale(1.12);opacity:.78}}@keyframes bDash{to{stroke-dashoffset:-44}}@keyframes bScan{0%,100%{transform:translateY(-20px);opacity:.08}50%{transform:translateY(29px);opacity:.85}}@keyframes bLed{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.b-packet,.b-hub,.b-dash,.b-scan,.b-led{animation:none}}
  </style>
  <defs>
    <linearGradient id="b-frame" x1="12" y1="8" x2="188" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#334155"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="b-core"><stop stop-color="#fff"/><stop offset=".22" stop-color="#5eead4"/><stop offset=".62" stop-color="#0f766e"/><stop offset="1" stop-color="#042f2e"/></radialGradient>
    <filter id="b-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="b-shadow"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity=".8"/></filter>
    <pattern id="b-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#134e4a" stroke-width=".65"/></pattern>
  </defs>
  <path d="M100 7c79 0 93 14 93 93s-14 93-93 93S7 179 7 100 21 7 100 7Z" fill="url(#b-frame)" stroke="#0f766e" stroke-width="3"/><path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="url(#b-grid)" opacity=".42" stroke="#5eead4"/>
  <text x="100" y="27" fill="#5eead4" font-family="Consolas,monospace" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="1.4">BRIDGE · I/O</text>
  <g fill="#475569" stroke="#111827" stroke-width="2"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g filter="url(#b-shadow)"><rect x="42" y="46" width="116" height="103" rx="9" fill="#020617" stroke="#134e4a" stroke-width="7" transform="translate(6 7)"/><rect x="42" y="46" width="116" height="103" rx="9" fill="#071521" stroke="#5eead4" stroke-width="2.5"/><rect x="49" y="53" width="102" height="15" rx="3" fill="#134e4a"/><circle cx="58" cy="60.5" r="3" fill="#f87171"/><circle cx="68" cy="60.5" r="3" fill="#fbbf24"/><circle class="b-led" cx="78" cy="60.5" r="3" fill="#34d399"/><text x="143" y="63" fill="#ccfbf1" font-family="Consolas,monospace" font-size="5.5" text-anchor="end">OUTPUT_BUS</text>
    <path class="b-scan" d="M50 78h100" stroke="#34d399" stroke-width="1.4" filter="url(#b-glow)"/>
  </g>
  <g fill="none" stroke="#2dd4bf" stroke-width="2.2"><path class="b-dash" d="M100 88H65v18H51M100 88h35v18h14M100 102H64v22H51M100 102h36v22h13M100 116v18" stroke-dasharray="7 4"/></g>
  <circle class="b-hub" cx="100" cy="102" r="21" fill="url(#b-core)" stroke="#fff" stroke-width="2" filter="url(#b-glow)"/><path d="M92 102h16M100 94v16" stroke="#fff" stroke-width="2"/><circle cx="100" cy="102" r="7" fill="#042f2e" stroke="#99f6e4"/>
  <g fill="#071521" stroke="#5eead4" stroke-width="2"><rect x="27" y="96" width="25" height="20" rx="4"/><rect x="148" y="96" width="25" height="20" rx="4"/><rect x="27" y="119" width="25" height="20" rx="4"/><rect x="148" y="119" width="25" height="20" rx="4"/><rect x="87" y="133" width="26" height="18" rx="4"/></g>
  <g fill="#99f6e4" font-family="Consolas,monospace" font-size="6" font-weight="900" text-anchor="middle"><text x="39.5" y="109">TXT</text><text x="160.5" y="109">VOC</text><text x="39.5" y="132">FCE</text><text x="160.5" y="132">BDY</text><text x="100" y="145">EXT</text></g>
  <g class="b-packet" fill="#fff" filter="url(#b-glow)"><rect x="66" y="84" width="9" height="4" rx="2"/><rect x="122" y="112" width="8" height="4" rx="2"/></g><g class="b-packet two" fill="#34d399" filter="url(#b-glow)"><rect x="72" y="98" width="7" height="4" rx="2"/><rect x="112" y="130" width="8" height="4" rx="2"/></g>
  <g fill="#071521" stroke="#2dd4bf" stroke-width="1.2" font-family="Consolas,monospace" font-size="5" font-weight="900"><path d="M17 53h18v29H17Z"/><text x="26" y="62" fill="#99f6e4" stroke="none" text-anchor="middle">TX</text><path d="M21 69h10m-10 6h7" stroke="#34d399"/><path d="M165 53h18v29h-18Z"/><text x="174" y="62" fill="#99f6e4" stroke="none" text-anchor="middle">ACK</text><path d="M169 69h10m-7 6h7" stroke="#fbbf24"/></g>
  <g transform="translate(64 176)"><rect width="72" height="8" rx="4" fill="#020617" stroke="#334155"/><rect x="3" y="2.5" width="42" height="3" rx="1.5" fill="#2dd4bf" filter="url(#b-glow)"/><circle cx="59" cy="4" r="2" fill="#64748b"/><circle cx="67" cy="4" r="2" fill="#fbbf24"/></g>
</svg>
