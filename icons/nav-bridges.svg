<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Puentes corporales">
  <title>Puentes corporales</title>
  <style>
    .bridges-dash{animation:bridgesDash 2.8s linear infinite}.bridges-blink{animation:bridgesBlink 1.6s steps(2,end) infinite}.bridges-blink2{animation:bridgesBlink 2.3s steps(2,end) .5s infinite}.bridges-scan{animation:bridgesScan 4.2s ease-in-out infinite}.bridges-spin{transform-box:fill-box;transform-origin:50% 50%;animation:bridgesSpin 16s linear infinite}
    @keyframes bridgesDash{to{stroke-dashoffset:-26}}@keyframes bridgesBlink{50%{opacity:.25}}
    @keyframes bridgesScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes bridgesSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.bridges-dash,.bridges-blink,.bridges-blink2,.bridges-scan,.bridges-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="bridges-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="bridges-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="bridges-gb" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="bridges-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="bridges-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#38bdf8"/><stop offset=".7" stop-color="#fb923c"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="bridges-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="bridges-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#bridges-plate)" stroke="url(#bridges-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="bridges-blink" cx="100" cy="42" r="2.2" fill="#fb923c" filter="url(#bridges-glow)"/>
  <g filter="url(#bridges-shadow)">
      <g transform="translate(58 84)"><path d="M-14-8 0-15l14 7L0-1z" fill="#164e63" stroke="#38bdf8"/><path d="M-14-8 0-1v21l-14-7z" fill="#082f49"/><path d="M14-8 0-1v21l14-7z" fill="#0c4a6e"/><circle cy="-10" r="2.6" fill="#38bdf8"/></g>
      <g transform="translate(142 84)"><path d="M-14-8 0-15l14 7L0-1z" fill="#7c2d12" stroke="#fb923c"/><path d="M-14-8 0-1v21l-14-7z" fill="#431407"/><path d="M14-8 0-1v21l14-7z" fill="#7c2d12"/><circle cy="-10" r="2.6" fill="#fb923c"/></g>
    </g>
    <path class="bridges-dash" d="M66 70Q100 54 134 70" fill="none" stroke="url(#bridges-ga)" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#bridges-glow)"/>
    <circle class="bridges-blink" cx="100" cy="62" r="3" fill="#fff"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6"><text x="58" y="104" fill="#38bdf8" text-anchor="middle">MENTE</text><text x="142" y="104" fill="#fb923c" text-anchor="middle">CUERPO</text></g>
    <path d="M46 108h4l2-3 3 5 2-4 3 3h4" stroke="#38bdf8" stroke-width=".8" fill="none" opacity=".7"/><path d="M130 108h4l2-3 3 5 2-4 3 3h4" stroke="#fb923c" stroke-width=".8" fill="none" opacity=".7"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4">
      <g fill="#0b1320" stroke="#475569"><rect x="42" y="112" width="116" height="9" rx="2"/><rect x="42" y="124" width="116" height="9" rx="2"/></g>
      <circle cx="48" cy="116.5" r="1.8" fill="#fbbf24" class="bridges-blink2"/><text x="54" y="119" fill="#94a3b8">CAM / MIC · PARTIAL</text><text x="152" y="119" fill="#fde68a" text-anchor="end">LEASE 60s</text>
      <circle cx="48" cy="128.5" r="1.8" fill="#64748b"/><text x="54" y="131" fill="#64748b">VOZ · ROSTRO · CUERPO</text><text x="152" y="131" fill="#64748b" text-anchor="end">PLANNED</text>
    </g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="142" fill="#475569" font-size="3">25 CAPS</text><text x="100" y="142" fill="#fca5a5" font-size="3.8" text-anchor="middle">REGISTRY · PROBES · SAFE OFF</text></g>
  <rect class="bridges-scan" x="40" y="50" width="120" height="1.4" fill="#38bdf8"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#38bdf8"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-BRIDGES</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">BRIDGES</text></g>
</svg>
