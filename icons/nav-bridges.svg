<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Capacidades y permisos">
  <title>Capacidades y permisos</title>
  <style>
    .bridges-dash{animation:bridgesDash 2.8s linear infinite}.bridges-blink{animation:bridgesBlink 1.6s steps(2,end) infinite}.bridges-blink2{animation:bridgesBlink 2.3s steps(2,end) .5s infinite}.bridges-scan{animation:bridgesScan 4.2s ease-in-out infinite}.bridges-spin{transform-box:fill-box;transform-origin:50% 50%;animation:bridgesSpin 16s linear infinite}
    @keyframes bridgesDash{to{stroke-dashoffset:-26}}@keyframes bridgesBlink{50%{opacity:.25}}
    @keyframes bridgesScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes bridgesSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.bridges-dash,.bridges-blink,.bridges-blink2,.bridges-scan,.bridges-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="bridges-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="bridges-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="bridges-gb" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="bridges-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="bridges-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="bridges-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#38bdf8"/><stop offset=".7" stop-color="#fb923c"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="bridges-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="bridges-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#bridges-plate)" stroke="url(#bridges-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="bridges-blink" cx="100" cy="42" r="2.2" fill="#fb923c" filter="url(#bridges-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#38bdf8" font-size="4">[06] CAPACIDADES Y PERMISOS // I/O MATRIX</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">R1/R2 ZERO-TRUST POLICIES</text>
    </g>

    <!-- Left: Hardware Capability Slots (Sensors & Actuators) -->
    <g filter="url(#bridges-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#061924" stroke="#38bdf8" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#bridges-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#7dd3fc" font-size="2.9">HARDWARE MAPPING</text>
    </g>

    <!-- Device 1: MIC_ARRAY -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <rect x="44" y="72" width="48" height="9" rx="1.5" fill="#082f49" stroke="#0ea5e9" stroke-width=".8"/>
      <circle cx="49" cy="76.5" r="2" fill="#38bdf8" class="bridges-blink"/>
      <text x="54" y="79" fill="#e0f2fe">MIC_ARRAY</text>
      <text x="88" y="79" fill="#38bdf8" text-anchor="end">ON</text>
    </g>

    <!-- Device 2: SPEAKER_OUT -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <rect x="44" y="85" width="48" height="9" rx="1.5" fill="#082f49" stroke="#0ea5e9" stroke-width=".8"/>
      <circle cx="49" cy="89.5" r="2" fill="#38bdf8"/>
      <text x="54" y="92" fill="#e0f2fe">SYS_AUDIO</text>
      <text x="88" y="92" fill="#38bdf8" text-anchor="end">ON</text>
    </g>

    <!-- Device 3: CAMERA_01 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <rect x="44" y="98" width="48" height="9" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width=".8"/>
      <circle cx="49" cy="102.5" r="2" fill="#475569"/>
      <text x="54" y="105" fill="#64748b">VISION_CAM</text>
      <text x="88" y="105" fill="#64748b" text-anchor="end">OFF</text>
    </g>

    <!-- Device 4: MOTOR_RIG -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <rect x="44" y="111" width="48" height="9" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width=".8"/>
      <circle cx="49" cy="115.5" r="2" fill="#475569"/>
      <text x="54" y="118" fill="#64748b">MOTOR_RIG</text>
      <text x="88" y="118" fill="#64748b" text-anchor="end">OFF</text>
    </g>

    <!-- Right: Access Control List (ACL) -->
    <g filter="url(#bridges-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#1e1107" stroke="#fb923c" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#0a0502"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#fdba74" font-size="2.9">ACCESS_CONTROL_LIST</text>
    </g>

    <!-- Policy 1 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="108" y="78" fill="#cbd5e1">AUDIO_READ</text>
      <text x="156" y="78" fill="#10b981" text-anchor="end">GRANTED</text>
      <path class="bridges-dash" d="M108 81h48" stroke="#10b981" stroke-dasharray="2 2" stroke-width=".8"/>
    </g>

    <!-- Policy 2 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="108" y="91" fill="#cbd5e1">AUDIO_WRITE</text>
      <text x="156" y="91" fill="#10b981" text-anchor="end">GRANTED</text>
      <path class="bridges-dash" d="M108 94h48" stroke="#10b981" stroke-dasharray="2 2" stroke-width=".8"/>
    </g>

    <!-- Policy 3 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="108" y="104" fill="#94a3b8">VIDEO_READ</text>
      <text x="156" y="104" fill="#ef4444" text-anchor="end">DENIED</text>
      <path d="M108 107h48" stroke="#ef4444" stroke-width=".8"/>
    </g>

    <!-- Policy 4 -->
    <g font-family="Consolas,monospace" font-weight="900" font-size="2.6">
      <text x="108" y="117" fill="#94a3b8">KINECTIC_OUT</text>
      <text x="156" y="117" fill="#ef4444" text-anchor="end">DENIED</text>
      <path d="M108 120h48" stroke="#ef4444" stroke-width=".8"/>
    </g>

    <!-- Bottom Security Footer -->
    <g filter="url(#bridges-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#1e1107" stroke="#fb923c" stroke-width="1.1"/>
    </g>
    <!-- Lock Monogram -->
    <path d="M49 132v-1.5a2 2 0 0 0-4 0V132m-1 0h6v4.5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1Z" fill="#7c2d12" stroke="#fb923c" stroke-width=".8"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#fed7aa" font-size="3.5">POLICY: EXPLICIT CONSENT REQUIRED</text>
      <text x="157" y="136" fill="#38bdf8" font-size="3.2" text-anchor="end">I/O SECURE</text>
      <text x="42" y="148" fill="#64748b" font-size="3">R1/R2 COMPLIANCE MODE</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">STRICT_ENFORCEMENT ON</text>
    </g>
  <g aria-label="Puertos gobernados" font-family="Consolas,monospace" font-weight="900">
    <path d="M42 153h18m8 0h18m8 0h18m8 0h18m8 0h12" stroke="#38bdf8" stroke-width=".8"/>
    <g fill="#1e1107" stroke="#fb923c" stroke-width=".7"><rect x="60" y="149" width="8" height="8" rx="1"/><rect x="86" y="149" width="8" height="8" rx="1"/><rect x="112" y="149" width="8" height="8" rx="1"/><rect x="138" y="149" width="8" height="8" rx="1"/></g>
    <text x="64" y="154.5" fill="#fdba74" font-size="2" text-anchor="middle">P</text><text x="90" y="154.5" fill="#fdba74" font-size="2" text-anchor="middle">G</text><text x="116" y="154.5" fill="#fdba74" font-size="2" text-anchor="middle">X</text><text x="142" y="154.5" fill="#fdba74" font-size="2" text-anchor="middle">R</text>
  </g>
  <rect class="bridges-scan" x="40" y="50" width="120" height="1.4" fill="#38bdf8"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#38bdf8"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-BRIDGES</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">CAPABILITIES</text></g>
</svg>
