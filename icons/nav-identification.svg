<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Identificación">
  <title>Identificación</title>
  <style>
    .identification-dash{animation:identificationDash 2.8s linear infinite}.identification-blink{animation:identificationBlink 1.6s steps(2,end) infinite}.identification-blink2{animation:identificationBlink 2.3s steps(2,end) .5s infinite}.identification-scan{animation:identificationScan 4.2s ease-in-out infinite}.identification-spin{transform-box:fill-box;transform-origin:50% 50%;animation:identificationSpin 16s linear infinite}
    @keyframes identificationDash{to{stroke-dashoffset:-26}}@keyframes identificationBlink{50%{opacity:.25}}
    @keyframes identificationScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes identificationSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.identification-dash,.identification-blink,.identification-blink2,.identification-scan,.identification-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="identification-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="identification-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="identification-gb" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="identification-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="identification-screen-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06121d"/><stop offset="1" stop-color="#02070e"/></linearGradient>
    <radialGradient id="identification-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#0ea5e9"/><stop offset=".7" stop-color="#10b981"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="identification-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="identification-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#identification-plate)" stroke="url(#identification-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="identification-blink" cx="100" cy="42" r="2.2" fill="#10b981" filter="url(#identification-glow)"/>
  <!-- Top System Header Bar -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="38" y="52" fill="#0ea5e9" font-size="4">[01] ENTRADA E IDENTIFICACIÓN // INPUT</text>
      <text x="162" y="52" fill="#94a3b8" font-size="3.2" text-anchor="end">PERCEPTION V3 · MULTIMODAL</text>
    </g>

    <!-- Left: Biometric Owner Profile -->
    <g filter="url(#identification-shadow)">
      <rect x="38" y="56" width="60" height="68" rx="4" fill="#082332" stroke="#0ea5e9" stroke-width="1.3"/>
      <rect x="40" y="58" width="56" height="64" rx="3" fill="url(#identification-screen-bg)"/>
    </g>
    <!-- Section Title -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="44" y="66" fill="#7dd3fc" font-size="2.9">SPEAKER_ID</text>
      <text x="92" y="66" fill="#10b981" font-size="2.9" text-anchor="end">VERIFIED</text>
    </g>
    <!-- Portrait Vector -->
    <circle cx="68" cy="85" r="10" fill="#0c3444" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle cx="68" cy="81" r="4.5" fill="#bae6fd"/>
    <path d="M58 95q5-8 10-8t10 8" fill="#38bdf8" stroke="none" opacity=".8"/>
    
    <!-- ID Match Score -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="68" y="103" fill="#e2e8f0" font-size="3.4" text-anchor="middle">OWNER_PROFILE</text>
      <text x="68" y="111" fill="#10b981" font-size="2.8" text-anchor="middle">CONFIDENCE: 99.8%</text>
      <!-- Confidence Bar -->
      <rect x="48" y="114" width="40" height="2.5" rx="1.2" fill="#020617"/>
      <rect x="48" y="114" width="38" height="2.5" rx="1.2" fill="#10b981" filter="url(#identification-glow)"/>
    </g>

    <!-- Right: Perception Stream & Tokenizer -->
    <g filter="url(#identification-shadow)">
      <rect x="102" y="56" width="60" height="68" rx="4" fill="#021612" stroke="#10b981" stroke-width="1.3"/>
      <rect x="104" y="58" width="56" height="64" rx="3" fill="#04231b"/>
    </g>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="66" fill="#6ee7b7" font-size="2.9">STREAM BUFFER</text>
      <circle cx="156" cy="64.5" r="1.5" fill="#10b981" class="identification-blink"/>
    </g>
    
    <!-- Audio Waveform -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="76" fill="#94a3b8" font-size="2.6">AUDIO [MIC_1]</text>
    </g>
    <path class="identification-dash" d="M108 82h4l2-3 3 6 3-8 3 10 3-8 3 4 3-2 3 5 2-4h4" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Tokenization Sequence -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="94" fill="#94a3b8" font-size="2.6">VECTOR TOKENS</text>
      <text x="156" y="94" fill="#0ea5e9" font-size="2.6" text-anchor="end">48 TOK</text>
    </g>
    <!-- Token blocks -->
    <g fill="#0c4a6e" stroke="#38bdf8" stroke-width=".6">
      <rect x="108" y="98" width="8" height="6" rx="1"/>
      <rect x="118" y="98" width="12" height="6" rx="1"/>
      <rect x="132" y="98" width="6" height="6" rx="1"/>
      <rect x="140" y="98" width="10" height="6" rx="1"/>
    </g>
    <g fill="#bae6fd" font-family="Consolas,monospace" font-size="2" font-weight="900" text-anchor="middle">
      <text x="112" y="102.2">1A</text>
      <text x="124" y="102.2">F3</text>
      <text x="135" y="102.2">08</text>
      <text x="145" y="102.2">E2</text>
    </g>

    <!-- Context Injection -->
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="108" y="114" fill="#94a3b8" font-size="2.6">CONTEXT INJECT</text>
      <text x="156" y="114" fill="#64748b" text-anchor="end" font-size="2.6">OK</text>
      <rect x="108" y="117" width="48" height="2" rx="1" fill="#020617"/>
      <rect class="identification-scan" x="108" y="117" width="18" height="2" rx="1" fill="#38bdf8"/>
    </g>

    <!-- Bottom Synchronization Banner -->
    <g filter="url(#identification-shadow)">
      <rect x="38" y="127" width="124" height="15" rx="3" fill="#04231b" stroke="#10b981" stroke-width="1.1"/>
    </g>
    <!-- Checkmark Badge -->
    <circle cx="48" cy="134.5" r="4.5" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <path d="M46 134.5l1.5 1.5 3-3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2"/>
    <g font-family="Consolas,monospace" font-weight="900">
      <text x="56" y="136" fill="#a7f3d0" font-size="3.5">PERCEPTION INPUT: WAITING</text>
      <text x="157" y="136" fill="#0ea5e9" font-size="3.2" text-anchor="end">LOCAL INPUT</text>
      <text x="42" y="148" fill="#64748b" font-size="3">SOURCE: NONE · 0 TOKENS</text>
      <text x="158" y="148" fill="#64748b" font-size="3" text-anchor="end">NO ANALYSIS CLAIM</text>
    </g>
  <g aria-label="Segmentación de entrada" font-family="Consolas,monospace" font-weight="900">
    <g fill="#04231b" stroke="#10b981" stroke-width=".65"><rect x="42" y="151" width="18" height="6" rx="1"/><rect x="63" y="151" width="12" height="6" rx="1"/><rect x="78" y="151" width="25" height="6" rx="1"/><rect x="106" y="151" width="16" height="6" rx="1"/></g>
    <path d="M125 154h33" stroke="#0ea5e9" stroke-width=".8" stroke-dasharray="2 2"/><text x="51" y="155.2" fill="#6ee7b7" font-size="1.9" text-anchor="middle">TOKEN</text><text x="158" y="157" fill="#64748b" font-size="2.1" text-anchor="end">INTENT · SOURCE · SPEAKER</text>
  </g>
  <rect class="identification-scan" x="40" y="50" width="120" height="1.4" fill="#0ea5e9"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#0ea5e9"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-IDENTIFICATION</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">INPUT</text></g>
</svg>
