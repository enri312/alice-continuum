<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Identificación">
  <title>Identificación</title>
  <style>
    .identification-dash{animation:identificationDash 2.8s linear infinite}.identification-blink{animation:identificationBlink 1.6s steps(2,end) infinite}.identification-blink2{animation:identificationBlink 2.3s steps(2,end) .5s infinite}.identification-scan{animation:identificationScan 4.2s ease-in-out infinite}.identification-spin{transform-box:fill-box;transform-origin:50% 50%;animation:identificationSpin 16s linear infinite}
    @keyframes identificationDash{to{stroke-dashoffset:-26}}@keyframes identificationBlink{50%{opacity:.25}}
    @keyframes identificationScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes identificationSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.identification-dash,.identification-blink,.identification-blink2,.identification-scan,.identification-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="identification-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="identification-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="identification-gb" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="identification-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="identification-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#0ea5e9"/><stop offset=".7" stop-color="#10b981"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="identification-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="identification-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#identification-plate)" stroke="url(#identification-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#0ea5e9" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="identification-blink" cx="100" cy="42" r="2.2" fill="#10b981" filter="url(#identification-glow)"/>
  <g filter="url(#identification-shadow)"><rect x="42" y="58" width="72" height="52" rx="4" fill="#082332" stroke="#0ea5e9" stroke-width="1.3"/><rect x="46" y="62" width="64" height="44" rx="2" fill="#0c3444" stroke="#7dd3fc" stroke-width=".6"/></g>
    <circle cx="58" cy="76" r="8" fill="#24475a" stroke="#bae6fd"/><path d="M50 92q2-8 8-8t8 8" fill="#17394a" stroke="#0ea5e9"/>
    <path d="M72 70h34M72 77h26M72 84h32M72 91h24" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M46 62v6m0-6h6M110 62h-6m6 0v6M46 106v-6m0 6h6M110 106h-6m6 0v-6" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.4">
      <text x="120" y="64" fill="#94a3b8">SOURCE</text><text x="158" y="64" fill="#10b981" text-anchor="end">LOCAL</text>
      <text x="120" y="73" fill="#94a3b8">SPEAKER</text><text x="158" y="73" fill="#e2e8f0" text-anchor="end">OWNER</text>
      <text x="120" y="82" fill="#94a3b8">INTENT</text><text x="158" y="82" fill="#0ea5e9" text-anchor="end">PENDING</text>
    </g>
    <rect x="120" y="88" width="38" height="6" rx="3" fill="#020617" stroke="#334155"/><rect x="122" y="90" width="24" height="2" rx="1" fill="url(#identification-ga)"/><circle class="identification-blink" cx="148" cy="91" r="1.8" fill="#10b981"/>
    <g font-family="Consolas,monospace" font-weight="900"><text x="120" y="103" fill="#64748b" font-size="3.4">CONF 0.00</text><circle cx="152" cy="100" r="4.4" fill="#10b981" filter="url(#identification-glow)"/><path d="m150 100 1.6 1.6 3.4-3.8" fill="none" stroke="#052e25" stroke-width="1.4"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><rect x="42" y="118" width="116" height="12" rx="2" fill="#07111e" stroke="#0ea5e9" stroke-width=".8"/><text x="100" y="126" fill="#7dd3fc" font-size="3.8" text-anchor="middle">TOKENS · VECTOR · [00] PERCEPTION</text></g>
    <g fill="#334155"><rect x="42" y="134" width="1.4" height="6"/><rect x="45" y="134" width=".8" height="6"/><rect x="47.4" y="134" width="1.8" height="6"/><rect x="51" y="134" width=".8" height="6"/><rect x="53.4" y="134" width="1.4" height="6"/></g><text x="60" y="139" fill="#64748b" font-size="3" font-family="Consolas,monospace" font-weight="900">0 TOKENS</text><text x="42" y="145" fill="#475569" font-size="3" font-family="Consolas,monospace" font-weight="900">OWNER PROFILE</text>
  <rect class="identification-scan" x="40" y="50" width="120" height="1.4" fill="#0ea5e9"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#0ea5e9"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-IDENTIFICATION</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">INPUT</text></g>
</svg>
