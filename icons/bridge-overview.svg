<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Registro de capacidades">
  <title>Registro de capacidades</title>
  <style>
    .overview-dash{animation:overviewDash 2.8s linear infinite}.overview-blink{animation:overviewBlink 1.6s steps(2,end) infinite}.overview-blink2{animation:overviewBlink 2.3s steps(2,end) .5s infinite}.overview-scan{animation:overviewScan 4.2s ease-in-out infinite}.overview-spin{transform-box:fill-box;transform-origin:50% 50%;animation:overviewSpin 16s linear infinite}
    @keyframes overviewDash{to{stroke-dashoffset:-26}}@keyframes overviewBlink{50%{opacity:.25}}
    @keyframes overviewScan{0%,100%{y:50px;opacity:.06}50%{y:140px;opacity:.4}}
    @keyframes overviewSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.overview-dash,.overview-blink,.overview-blink2,.overview-scan,.overview-spin{animation:none}}
  </style>
  <defs>
    <radialGradient id="overview-plate" cx="38%" cy="30%" r="80%"><stop stop-color="#1b2836"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#04080d"/></radialGradient>
    <linearGradient id="overview-ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="overview-gb" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="overview-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="overview-halo"><stop stop-color="#fff"/><stop offset=".2" stop-color="#2dd4bf"/><stop offset=".7" stop-color="#fb923c"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <filter id="overview-shadow" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="2.6" flood-color="#000" flood-opacity=".85"/></filter>
    <filter id="overview-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#02050a"/>
  <rect x="25" y="25" width="150" height="150" rx="27" fill="url(#overview-plate)" stroke="url(#overview-ga)" stroke-width="2.4"/>
  <rect x="34" y="34" width="132" height="132" rx="21" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M42 54v-8q0-4 4-4h8M158 54v-8q0-4-4-4h-8M42 146v8q0 4 4 4h8M158 146v8q0 4-4 4h-8" fill="none" stroke="#2dd4bf" stroke-width="1.6" opacity=".5"/>
  <g fill="#1e293b" stroke="#475569" stroke-width=".6"><circle cx="31" cy="31" r="1.6"/><circle cx="169" cy="31" r="1.6"/><circle cx="31" cy="169" r="1.6"/><circle cx="169" cy="169" r="1.6"/></g>
  <path d="M88 40h6M106 40h6" stroke="#1e293b" stroke-width="1.4"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="58" y="50" fill="#475569" font-size="3">ALICE // LOCAL-FIRST</text><text x="142" y="50" fill="#475569" font-size="3" text-anchor="end">v0.1.0</text></g>
  <path d="M36 62v76M164 62v76" stroke="#1e293b" stroke-width=".7"/>
  <path d="M36 68h2.5M36 80h1.8M36 92h2.5M36 104h1.8M36 116h2.5M36 128h1.8M164 68h-2.5M164 80h-1.8M164 92h-2.5M164 104h-1.8M164 116h-2.5M164 128h-1.8" stroke="#475569" stroke-width=".6"/>
  <circle class="overview-blink" cx="100" cy="42" r="2.2" fill="#fb923c" filter="url(#overview-glow)"/>
  <g filter="url(#overview-shadow)"><circle cx="100" cy="92" r="34" fill="#071c22" stroke="#2dd4bf" stroke-width="1.3"/></g>
    <path d="M100 126a34 34 0 1 1 34-34" fill="none" stroke="#1e293b" stroke-width="5.4"/>
    <path d="M100 58a34 34 0 0 1 31 48" fill="none" stroke="#2dd4bf" stroke-width="5.4" stroke-linecap="round" filter="url(#overview-glow)"/>
    <circle cx="100" cy="92" r="21" fill="none" stroke="#1f5e62" stroke-dasharray="3 4" class="overview-dash"/>
    <g stroke="#475569" stroke-width=".7"><path d="M138 92h-4M100 130v-4M62 92h4M127 119l-3-3M73 119l3-3"/></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="96" fill="#fff" font-size="11" text-anchor="middle">15</text><text x="100" y="105" fill="#64748b" font-size="4" text-anchor="middle">/ 25 LIVE</text></g>
    <circle class="overview-blink" cx="131" cy="105" r="3" fill="#fb923c"/>
    <g font-family="Consolas,monospace" font-weight="900" font-size="3.6">
      <rect x="42" y="116" width="54" height="11" rx="2" fill="#052e2b" stroke="#2dd4bf" stroke-width=".8"/><text x="69" y="123.5" fill="#2dd4bf" text-anchor="middle">LIVE · 15</text>
      <rect x="104" y="116" width="54" height="11" rx="2" fill="#2a170a" stroke="#fb923c" stroke-width=".8"/><text x="131" y="123.5" fill="#fb923c" text-anchor="middle">PLANNED · 10</text>
    </g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="140" fill="#64748b" font-size="3.6" text-anchor="middle">SNAPSHOT v1 · NATIVE · PROBES</text></g>
    <g font-family="Consolas,monospace" font-weight="900"><text x="42" y="146" fill="#475569" font-size="3">R1</text><text x="100" y="146" fill="#475569" font-size="3" text-anchor="middle">perception.* · memory.* · cloud.*</text></g>
  <rect class="overview-scan" x="40" y="50" width="120" height="1.4" fill="#2dd4bf"/>
  <g fill="#334155"><rect x="40" y="166" width="1.4" height="6"/><rect x="43" y="166" width=".8" height="6"/><rect x="45.2" y="166" width="1.8" height="6"/><rect x="48.6" y="166" width=".8" height="6"/><rect x="51" y="166" width="1.3" height="6"/><rect x="54" y="166" width=".8" height="6"/></g><rect x="46.6" y="166" width="1" height="6" fill="#2dd4bf"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="160" y="171" fill="#475569" font-size="3.2" text-anchor="end">SN-OVERVIEW</text></g>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="163" fill="#64748b" font-size="7" text-anchor="middle" letter-spacing="2">REGISTRY</text></g>
</svg>
