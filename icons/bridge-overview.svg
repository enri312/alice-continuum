<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .bo-ring{transform-box:fill-box;transform-origin:center;animation:boRing 12s linear infinite}.bo-dash{animation:boDash 2.8s linear infinite}.bo-packet{animation:boPacket 2.6s ease-in-out infinite}.bo-packet.b{animation-delay:-.85s}.bo-packet.c{animation-delay:-1.7s}.bo-led{animation:boLed 1.5s steps(2,end) infinite}
    @keyframes boRing{to{transform:rotate(360deg)}}@keyframes boDash{to{stroke-dashoffset:-34}}@keyframes boPacket{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}@keyframes boLed{50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.bo-ring,.bo-dash,.bo-packet,.bo-led{animation:none}}
  </style>
  <defs>
    <linearGradient id="bo-frame" x1="10" y1="8" x2="190" y2="192"><stop stop-color="#2c4054"/><stop offset=".5" stop-color="#091625"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="bo-core"><stop stop-color="#ecfeff"/><stop offset=".18" stop-color="#5eead4"/><stop offset=".52" stop-color="#0d9488"/><stop offset="1" stop-color="#134e4a"/></radialGradient>
    <linearGradient id="bo-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".55" stop-color="#67e8f9"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="bo-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bo-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".85"/></filter>
    <pattern id="bo-grid" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M11 0H0v11" fill="none" stroke="#164e63" stroke-width=".55" opacity=".55"/></pattern>
  </defs>
  <path d="M100 7c79 0 93 14 93 93s-14 93-93 93S7 179 7 100 21 7 100 7Z" fill="url(#bo-frame)" stroke="#0f766e" stroke-width="3"/>
  <path d="M100 13c73 0 87 14 87 87s-14 87-87 87-87-14-87-87 14-87 87-87Z" fill="url(#bo-grid)" opacity=".55" stroke="#5eead4" stroke-width="1"/>
  <g fill="#475569" stroke="#111827" stroke-width="2"><circle cx="28" cy="28" r="5"/><circle cx="172" cy="28" r="5"/><circle cx="28" cy="172" r="5"/><circle cx="172" cy="172" r="5"/></g>
  <text x="100" y="27" fill="#99f6e4" font-family="Consolas,monospace" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="1.4">OUTPUT BRIDGE HUB</text>

  <path d="M30 45h140l7 7v94l-7 7H30l-7-7V52Z" fill="#040c16" stroke="#155e75" stroke-width="2" filter="url(#bo-shadow)"/>
  <path d="M100 61v78M61 100h78" stroke="#164e63"/><circle class="bo-ring" cx="100" cy="100" r="36" fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="5 7" opacity=".65"/>

  <g fill="none" stroke="url(#bo-line)" stroke-width="2" stroke-linecap="round">
    <path class="bo-dash" d="M100 100 55 64M100 100h-59M100 100l-45 36M100 100l45-36M100 100h59M100 100l45 36" stroke-dasharray="5 4"/>
  </g>
  <g class="bo-packet" fill="#67e8f9" filter="url(#bo-glow)"><circle cx="77" cy="82" r="3"/><circle class="b" cx="69" cy="100" r="3"/><circle class="c" cx="78" cy="118" r="3"/></g>
  <g class="bo-packet b" fill="#fbbf24" filter="url(#bo-glow)"><circle cx="123" cy="82" r="3"/><circle class="b" cx="131" cy="100" r="3"/><circle class="c" cx="122" cy="118" r="3"/></g>

  <g transform="translate(100 100)" filter="url(#bo-glow)"><circle r="25" fill="#03111b" stroke="#67e8f9" stroke-width="2"/><circle r="18" fill="url(#bo-core)" stroke="#ecfeff" stroke-width="1.5"/><path d="M-8 6 0-10 8 6H3v6h-6V6Z" fill="#042f2e" stroke="#ecfeff" stroke-width="1"/><circle class="bo-led" r="4" fill="#fff"/></g>

  <g font-family="Consolas,monospace" font-size="5.2" font-weight="900" text-anchor="middle">
    <g transform="translate(43 53)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#2dd4bf"/><text x="15" y="9" fill="#99f6e4">TXT</text><text x="15" y="16" fill="#475569" font-size="3.8">TEXT</text></g>
    <g transform="translate(26 90)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#38bdf8"/><text x="15" y="9" fill="#bae6fd">VOC</text><text x="15" y="16" fill="#475569" font-size="3.8">VOICE</text></g>
    <g transform="translate(43 127)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#c084fc"/><text x="15" y="9" fill="#e9d5ff">FCE</text><text x="15" y="16" fill="#475569" font-size="3.8">FACE</text></g>
    <g transform="translate(127 53)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#fbbf24"/><text x="15" y="9" fill="#fef3c7">GAZ</text><text x="15" y="16" fill="#475569" font-size="3.8">GAZE</text></g>
    <g transform="translate(144 90)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#5eead4"/><text x="15" y="9" fill="#ccfbf1">BDY</text><text x="15" y="16" fill="#475569" font-size="3.8">BODY</text></g>
    <g transform="translate(127 127)"><rect width="30" height="20" rx="3" fill="#071722" stroke="#f87171"/><text x="15" y="9" fill="#fecaca">EXT</text><text x="15" y="16" fill="#475569" font-size="3.8">EXTERNAL</text></g>
  </g>

  <g transform="translate(42 160)" font-family="Consolas,monospace" font-size="4.4" font-weight="900"><rect width="116" height="14" rx="3" fill="#020617" stroke="#334155"/><circle cx="8" cy="7" r="2.5" fill="#34d399" filter="url(#bo-glow)"/><text x="15" y="8.8" fill="#5eead4">PERMISSION GATE</text><rect x="69" y="4" width="31" height="6" fill="#1c1210" stroke="#713f12"/><text x="84.5" y="8.7" fill="#fbbf24" text-anchor="middle">BLOCKED</text><circle class="bo-led" cx="108" cy="7" r="2.5" fill="#64748b"/></g>
  <g fill="none" stroke="#2dd4bf" stroke-width="1" opacity=".7"><path d="M15 69h8v-8m-8 69h8v8m162-69h-8v-8m8 69h-8v8"/></g>
</svg>
