<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Resumen de puentes">
  <title>Resumen de puentes</title>
  <style>
    .overview-orbit{animation:overviewOrbit 4s linear infinite}.overview-pulse{animation:overviewPulse 1.8s ease-in-out infinite}.overview-scan{animation:overviewScan 3s ease-in-out infinite}
    @keyframes overviewOrbit{to{stroke-dashoffset:-42}}@keyframes overviewPulse{50%{opacity:.3}}@keyframes overviewScan{0%,100%{transform:translateX(-7px);opacity:.18}50%{transform:translateX(7px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.overview-orbit,.overview-pulse,.overview-scan{animation:none}}
  </style>
  <defs>
    <radialGradient id="overview-base" cx="42%" cy="32%" r="75%"><stop stop-color="#263442"/><stop offset=".48" stop-color="#101923"/><stop offset="1" stop-color="#03070b"/></radialGradient>
    <linearGradient id="overview-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94a3b8"/><stop offset=".35" stop-color="#334155"/><stop offset=".7" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="overview-accent" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset=".52" stop-color="#f8fafc"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <radialGradient id="overview-holo"><stop stop-color="#fff"/><stop offset=".18" stop-color="#2dd4bf"/><stop offset=".68" stop-color="#fb923c"/><stop offset="1" stop-color="#07111d"/></radialGradient>
    <pattern id="overview-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0v12" fill="none" stroke="#2dd4bf" stroke-width=".45" opacity=".22"/></pattern>
    <filter id="overview-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="overview-shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".8"/></filter>
    <linearGradient id="overview-beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2dd4bf" stop-opacity=".28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M100 8C178 8 192 22 192 100S178 192 100 192 8 178 8 100 22 8 100 8Z" fill="#070a0f"/>
  <path d="M100 13c72 0 82 15 82 87s-10 87-82 87-82-15-82-87 10-87 82-87Z" fill="url(#overview-base)" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 19c66 0 76 14 76 81s-10 81-76 81-76-14-76-81 10-81 76-81Z" fill="url(#overview-grid)" stroke="#2dd4bf" stroke-width=".8" opacity=".78"/>
  <path d="M100 24c57 0 71 10 75 57L25 81c4-47 18-57 75-57Z" fill="url(#overview-beam)"/>
  <circle class="overview-orbit" cx="100" cy="100" r="71" fill="none" stroke="#2dd4bf" stroke-width=".7" stroke-dasharray="7 5" opacity=".45"/><circle class="overview-orbit" cx="100" cy="100" r="62" fill="none" stroke="#fb923c" stroke-width=".6" stroke-dasharray="2 6" opacity=".38"/>
  <path d="M48 34h18l7 7m79-7h-18l-7 7M48 166h18l7-7m79 7h-18l-7-7" fill="none" stroke="#2dd4bf" stroke-width="1" opacity=".65"/>
  <g fill="url(#overview-metal)" stroke="#020617"><circle cx="30" cy="30" r="5"/><circle cx="170" cy="30" r="5"/><circle cx="30" cy="170" r="5"/><circle cx="170" cy="170" r="5"/></g>
  <g stroke="#cbd5e1" stroke-width=".8" opacity=".75"><path d="M27 30h6m-3-3v6M167 30h6m-3-3v6M27 170h6m-3-3v6M167 170h6m-3-3v6"/></g>
  <g fill="#2dd4bf" filter="url(#overview-glow)"><circle cx="48" cy="28" r="2"/><circle cx="152" cy="172" r="2"/></g><g fill="#fb923c"><circle cx="152" cy="28" r="1.5"/><circle cx="48" cy="172" r="1.5"/></g>
  <path d="M48 22Q100 11 152 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".12"/>
  <g font-family="Consolas,monospace" font-weight="900"><text x="100" y="28" fill="#2dd4bf" font-size="7" text-anchor="middle" letter-spacing="1.5">OVERVIEW · ALICE</text><text x="100" y="176" fill="#64748b" font-size="5" text-anchor="middle" letter-spacing="1">LOCAL · VERIFIED</text></g>
  <g transform="translate(14 65)" fill="#07111e" stroke="#2dd4bf" stroke-width=".8"><path d="M0 0h22l4 5v25l-4 5H0z"/><path d="M5 8h14M5 14h10M5 20h14M5 26h7" stroke="#2dd4bf"/><circle class="overview-pulse" cx="19" cy="27" r="2" fill="#fb923c" stroke="none"/></g>
  <g transform="translate(160 65)" fill="#07111e" stroke="#fb923c" stroke-width=".8"><path d="M4 0h22v35H4l-4-5V5z"/><path d="M8 8h14M12 14h10M8 20h14M15 26h7" stroke="#fb923c"/><circle class="overview-pulse" cx="8" cy="27" r="2" fill="#2dd4bf" stroke="none"/></g>
  <g transform="translate(100 91)" filter="url(#overview-shadow)"><ellipse cy="48" rx="55" ry="14" fill="#052e2b" stroke="#2dd4bf" opacity=".55"/>
      <circle r="54" fill="#071c22" stroke="#2dd4bf" stroke-width="2"/><g fill="none" stroke="#1f5e62"><circle r="39"/><circle r="23"/><path d="M-54 0h108M0-54v108M-38-38l76 76M38-38l-76 76"/></g>
      <path d="M0 0 39-31A50 50 0 0 1 50 15z" fill="#2dd4bf" opacity=".25"/><path d="M0 0 39-31" stroke="#2dd4bf" stroke-width="3" filter="url(#overview-glow)"/>
      <g fill="#fff"><circle cx="-26" cy="-31" r="5"/><circle cx="37" cy="-10" r="5"/><circle cx="17" cy="38" r="5"/></g><g fill="#fb923c"><circle cx="-26" cy="-31" r="2"/><circle cx="37" cy="-10" r="2"/><circle cx="17" cy="38" r="2"/></g>
    </g>
  <g font-family="Consolas,monospace" font-size="5" font-weight="900"><g transform="translate(34 126)"><rect width="132" height="30" rx="3" fill="#071716" stroke="#2dd4bf"/><text x="7" y="9" fill="#94a3b8">AVAILABLE</text><text x="48" y="9" fill="#2dd4bf">07</text><text x="69" y="9" fill="#94a3b8">PLANNED</text><text x="108" y="9" fill="#fb923c">17</text><g transform="translate(7 15)"><rect width="115" height="7" rx="3.5" fill="#1e293b"/><rect width="38" height="7" rx="3.5" fill="#2dd4bf"/><path d="M46 0v7m24-7v7m24-7v7" stroke="#0f172a"/></g><circle cx="126" cy="19" r="4" fill="#4ade80"/></g><text x="100" y="163" fill="#2dd4bf" text-anchor="middle">24 CAPABILITIES · NATIVE SNAPSHOT</text></g>
  <g class="overview-scan" stroke="#fb923c" stroke-width=".8" opacity=".55"><path d="M52 58h96M52 100h96M52 142h96"/></g>
  <g opacity=".65" stroke="#2dd4bf" stroke-width="1"><path d="M24 108h10l5 5h8M176 108h-10l-5 5h-8" fill="none"/><path d="M24 113h15M176 113h-15"/></g>
  <g transform="translate(63 181)"><rect width="74" height="5" rx="2.5" fill="#020617" stroke="#334155" stroke-width=".7"/><rect x="2" y="1.5" width="46" height="2" rx="1" fill="#2dd4bf"/><circle cx="58" cy="2.5" r="1.5" fill="#fb923c"/><circle cx="66" cy="2.5" r="1.5" fill="#4ade80"/></g>
</svg>
