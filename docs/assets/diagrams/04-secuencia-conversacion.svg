  <rect width="960" height="610" rx="8" fill="#050d19"/><text x="34" y="38" fill="#f59e0b" font-family="Consolas,monospace" font-size="13" font-weight="700">D-04 · SECUENCIA DE CONVERSACIÓN AUTORIZADA</text>
  <g font-family="Inter,Segoe UI,sans-serif"><g fill="#0b1b2d" stroke="#2d4865"><rect x="35" y="70" width="150" height="48"/><rect x="225" y="70" width="150" height="48"/><rect x="415" y="70" width="150" height="48"/><rect x="605" y="70" width="150" height="48"/><rect x="795" y="70" width="130" height="48"/></g><g fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="800"><text x="110" y="99">Enrique</text><text x="300" y="99">React</text><text x="490" y="99">Núcleo local</text><text x="680" y="99">Tauri / Rust</text><text x="860" y="99">Proveedor</text></g></g>
