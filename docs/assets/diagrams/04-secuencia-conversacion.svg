<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia de conversación autorizada</title><desc id="desc">El usuario redacta, Alice recupera memoria local, muestra la previsualización, solicita autorización y recién entonces Tauri llama al proveedor.</desc>
