  <g fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#b)"><path d="M680 465H855"/><path d="M860 515H685"/></g><path d="M680 555H305" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <g font-family="Consolas,monospace" font-size="11"><text x="155" y="147" fill="#7dd3fc">1 · redactar</text><text x="344" y="197" fill="#7dd3fc">2 · recuperar localmente</text><text x="335" y="247" fill="#7dd3fc">3 · coincidencias explicables</text><text x="148" y="297" fill="#7dd3fc">4 · mostrar contenido exacto</text><text x="150" y="357" fill="#7dd3fc">5 · autorizar envío</text><text x="430" y="407" fill="#7dd3fc">6 · solicitud validada</text><text x="723" y="457" fill="#fbbf24">7 · HTTPS</text><text x="720" y="507" fill="#fbbf24">8 · respuesta</text><text x="435" y="547" fill="#7dd3fc">9 · respuesta + procedencia</text></g>
  <rect x="85" y="325" width="620" height="53" rx="4" fill="#241a08" stroke="#f59e0b"/><text x="395" y="348" text-anchor="middle" fill="#fde68a" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="800">PUERTA DE PRIVACIDAD</text><text x="395" y="365" text-anchor="middle" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="11">cancelar aquí significa que ningún dato sale del equipo</text>
