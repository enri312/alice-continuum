<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de aprendizaje y memoria de Alice</title><desc id="desc">Una enseñanza pasa por validación, memoria candidata, revisión, consolidación, recuperación y refuerzo o corrección.</desc>
