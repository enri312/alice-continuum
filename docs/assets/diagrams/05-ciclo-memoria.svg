  <rect width="960" height="450" rx="8" fill="#050d19"/><text x="34" y="38" fill="#f59e0b" font-family="Consolas,monospace" font-size="13" font-weight="700">D-05 · CICLO DE MEMORIA ENSEÑABLE</text>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><g fill="#0b1b2d" stroke="#38bdf8"><rect x="36" y="110" width="135" height="70" rx="6"/><rect x="222" y="110" width="135" height="70" rx="6"/><rect x="408" y="110" width="135" height="70" rx="6"/><rect x="594" y="110" width="135" height="70" rx="6"/><rect x="780" y="110" width="145" height="70" rx="6"/></g>
  <g fill="#e2e8f0" font-size="13" font-weight="800"><text x="103" y="141">ENSEÑANZA</text><text x="103" y="160" fill="#94a3b8" font-size="10">fuente + importancia</text><text x="289" y="141">VALIDACIÓN</text><text x="289" y="160" fill="#94a3b8" font-size="10">campos y formato</text><text x="475" y="141">CANDIDATA</text><text x="475" y="160" fill="#94a3b8" font-size="10">registro revisable</text><text x="661" y="141">CONSOLIDACIÓN</text><text x="661" y="160" fill="#94a3b8" font-size="10">fuerza limitada</text><text x="852" y="141">RECUPERACIÓN</text><text x="852" y="160" fill="#94a3b8" font-size="10">lexical + visible</text></g>
  <g fill="#081522" stroke="#a855f7"><rect x="570" y="280" width="180" height="70" rx="6"/></g><text x="660" y="310" fill="#e9d5ff" font-size="13" font-weight="800">REPASO ESPACIADO</text><text x="660" y="330" fill="#a78bfa" font-size="10">confirmar vigencia</text>
  <g fill="#220c17" stroke="#fb7185"><rect x="280" y="280" width="180" height="70" rx="6"/></g><text x="370" y="310" fill="#fecdd3" font-size="13" font-weight="800">CORRECCIÓN</text><text x="370" y="330" fill="#fda4af" font-size="10">conflicto visible</text></g>
