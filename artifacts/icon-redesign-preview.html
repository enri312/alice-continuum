<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vista previa de iconos Alice</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 240px; display: flex; align-items: center; justify-content: center; gap: 28px; background: #07101e; color: #dbeafe; font: 700 12px Consolas, monospace; }
    figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
    img { display: block; width: 180px; height: 180px; }
    figcaption { letter-spacing: .12em; }
    .small { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; }
    .small img { width: 52px; height: 52px; }
  </style>
</head>
<body>
  <figure><img src="../icons/nav-activity.svg" alt="Actividad"><figcaption>ACTIVIDAD</figcaption></figure>
  <figure><img src="../icons/nav-nucleus.svg" alt="Núcleo"><figcaption>NÚCLEO</figcaption></figure>
  <div class="small"><img src="../icons/nav-activity.svg" alt="Actividad a 52 píxeles"><img src="../icons/nav-nucleus.svg" alt="Núcleo a 52 píxeles"></div>
</body>
</html>
