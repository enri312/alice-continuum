[package]
name = "proyecto-p"
version = "0.1.0"
description = "Asistente personal local con contexto explícito"
edition = "2021"

[lib]
name = "proyecto_p_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
