[package]
name = "alice-continuum"
version = "0.1.0"
description = "Alice Continuum: plataforma local de memoria, cognición y presencia digital"
edition = "2021"

[lib]
name = "alice_continuum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
signal-hook = "0.3"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Alice prioriza no acumular varios GB de artefactos incrementales reproducibles.
# Cargo conserva las dependencias compiladas, pero no el historial interno por edición.
[profile.dev]
incremental = false

[profile.test]
incremental = false
