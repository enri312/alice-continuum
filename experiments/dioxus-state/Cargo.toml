[package]
name = "alice-dioxus-state"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated Dioxus-Web state inspector with synthetic fixtures"

[lib]
crate-type = ["cdylib", "rlib"]

# Independent experiment: never join the application's Cargo workspace.
[workspace]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.0", default-features = false, features = ["minimal", "web"] }
wasm-bindgen = "=0.2.105"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
